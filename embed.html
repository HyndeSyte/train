<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Train embed</title>
<!--
  The native shell's embed wrapper (plan v4, R2 build order 4). The shell's web view runs at
  capacitor://localhost, which sends no HTTP Referer, and YouTube answers an embed without one with
  Error 153. This page has an https origin on Pages, so the player it hosts gets a Referer. It is not
  part of the PWA: the live app embeds YouTube directly. Query: yt=<videoId>&start=<s>&end=<s>.
  It reports to its parent through postMessage ({ type: 'train-embed', state: loaded | ready | error }).
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #p, #p iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #m { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ccc; font: 13px/1.4 -apple-system, system-ui, sans-serif; padding: 12px; text-align: center; }
</style>
</head>
<body>
<div id="p"></div>
<div id="m" hidden></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = q.get('yt');
  var start = parseInt(q.get('start'), 10) || 0;
  var end = parseInt(q.get('end'), 10) || 0;
  function post(state, extra) {
    var m = { type: 'train-embed', state: state, id: id };
    if (extra) for (var k in extra) m[k] = extra[k];
    try { parent.postMessage(m, '*'); } catch (e) { /* no parent */ }
  }
  function message(text) { var el = document.getElementById('m'); el.hidden = false; el.textContent = text; }
  if (!id || !/^[\w-]{6,20}$/.test(id)) { message('No video.'); post('error', { code: 'no-id' }); return; }
  post('loaded');
  window.onYouTubeIframeAPIReady = function () {
    var vars = { playsinline: 1, rel: 0, modestbranding: 1, origin: location.origin };
    if (start) vars.start = start;
    if (end) vars.end = end;
    try {
      new YT.Player('p', {
        host: 'https://www.youtube-nocookie.com',
        videoId: id,
        playerVars: vars,
        events: {
          onReady: function () { post('ready'); },
          onError: function (e) { var code = e && e.data; message('The video did not load (' + code + ').'); post('error', { code: code }); }
        }
      });
    } catch (e) { message('The player did not start.'); post('error', { code: 'player:' + (e && e.message) }); }
  };
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function () { message('The player did not load.'); post('error', { code: 'api-load' }); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
