# Native shell (plan v4, R2): on a fresh clone, run the shell's Node tests (copy step, durable store),
# generate the Xcode project with XcodeGen, sync Capacitor (SPM), build for the simulator and run the
# UI tests: gate 0 (the bridge answers at capacitor://localhost) and the durable-store smoke (a
# synthetic fixture, one session through the UI, relaunch: no banner, the session in History and in
# the file, the store line in Settings). Then regenerate the project and assert no diff. Native-lane
# only: a path check fails any run whose change set touches both native/ and a PWA file. Actions are
# GitHub-owned and pinned by commit SHA.
name: native gate 0
on:
  push:
    branches: ['native-*']
    paths: ['native/**', '.github/workflows/native-gate0.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-gate0.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-gate0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  path-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Native-lane changes never touch index.html, data.js or style.css
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          printf 'changed since %s:\n%s\n' "$base" "$changed"
          if printf '%s\n' "$changed" | grep -q '^native/' && printf '%s\n' "$changed" | grep -Eq '^(index\.html|data\.js|style\.css)$'; then
            echo '::error::a native-lane change set touches a served PWA file'
            exit 1
          fi
  gate0:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Toolchain (Xcode 26.6 selected explicitly, XcodeGen from Homebrew)
        run: |
          set -euo pipefail
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer; fi
          xcode-select -p
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
          { echo '### Toolchain'; echo; echo '```'; xcodebuild -version; echo "xcodegen $(xcodegen --version)"; node --version; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=toolchain::$(xcodebuild -version | tr '\n' ' ') | xcodegen $(xcodegen --version) | node $(node --version) | $(xcode-select -p)"
      - name: Dependencies (exact, from the lockfile)
        run: |
          npm ci
          deps=$(node -e "const l=require('./package-lock.json').packages; const out=[]; for (const k of Object.keys(l)) if (/^node_modules\/@capacitor\/[^/]+$/.test(k)) out.push(k.replace('node_modules/','')+'@'+l[k].version); console.log(out.join(' '))")
          echo "$deps"
          echo "::notice title=deps::$deps"
      - name: Copy step (patches the shell's own copy of index.html)
        run: node scripts/copy-www.mjs
      - name: Shell Node tests (copy step, durable store against the fake plugin, parity, cutover)
        run: |
          node --check www/bridge.js
          node --test 2>&1 | tee "$RUNNER_TEMP/node-tests.log" | tail -12
          grep -q '^# fail 0' "$RUNNER_TEMP/node-tests.log"
          echo "::notice title=node-tests::$(grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/node-tests.log" | tr '\n' ' ')"
      - name: Export round trip (a native Export imports losslessly into the PWA harness; a check for every build)
        run: |
          node --test test/export-roundtrip.test.mjs 2>&1 | tee "$RUNNER_TEMP/roundtrip.log" | tail -8
          grep -q '^# fail 0' "$RUNNER_TEMP/roundtrip.log"
          echo "::notice title=export-roundtrip::$(grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/roundtrip.log" | tr '\n' ' ')"
      - name: Generate the Xcode project (bootstrap; cap sync reads the project)
        working-directory: native/ios/App
        run: xcodegen generate
      - name: Capacitor sync (SPM)
        run: npx cap sync ios
      - name: Generate the Xcode project (with the synced public folder)
        working-directory: native/ios/App
        run: xcodegen generate
      - name: Plugin presence
        run: |
          node -e "
            const c = require('./ios/App/App/capacitor.config.json');
            const want = ['FilesystemPlugin','HapticsPlugin','LocalNotificationsPlugin','SharePlugin'];
            const have = c.packageClassList || [];
            const missing = want.filter(w => !have.includes(w));
            console.log('packageClassList', JSON.stringify(have));
            if (missing.length) { console.error('missing', missing); process.exit(1); }"
          grep -c 'capacitor-swift-pm' ios/App/CapApp-SPM/Package.swift
          cat ios/App/CapApp-SPM/Package.swift
          echo "::notice title=plugins::$(node -e "console.log(JSON.stringify(require('./ios/App/App/capacitor.config.json').packageClassList))") | $(grep -o 'capacitor-swift-pm.git", exact: "[^"]*"' ios/App/CapApp-SPM/Package.swift)"
      - name: Resolve Swift packages
        working-directory: native/ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          node -e "
            const d = require(process.env.RUNNER_TEMP + '/devices.json').devices;
            const runtimes = Object.keys(d).filter(k => /SimRuntime\.iOS-/.test(k)).sort((a,b) => {
              const v = s => s.split('iOS-')[1].split('-').map(Number); const [x,y]=[v(a),v(b)];
              return (y[0]-x[0]) || ((y[1]||0)-(x[1]||0)); });
            for (const rt of runtimes) {
              const devs = d[rt].filter(x => x.isAvailable && /^iPhone \d+( Pro)?$/.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true})).reverse();
              if (devs.length) { console.log(JSON.stringify({ runtime: rt, name: devs[0].name, udid: devs[0].udid })); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'udid=' + devs[0].udid + '\nname=' + devs[0].name + '\nruntime=' + rt + '\n'); process.exit(0); }
            }
            console.error('no available iPhone simulator'); process.exit(1);"
      - name: Build and run the UI tests in the simulator (gate 0, smoke, parity, drill, probe)
        working-directory: native/ios/App
        env:
          # the X-Train-Client the tombstone probe sends: pwa until cutover, native after (flipped here at cutover)
          TRAIN_PROBE_CLIENT: pwa
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcodebuild test -project App.xcodeproj -scheme App \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            TEST_RUNNER_TRAIN_PROBE_CLIENT="$TRAIN_PROBE_CLIENT" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -resultBundlePath "$RUNNER_TEMP/gate0.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "GATE0_RESULT|SMOKE_|PARITY_|DRILL_|PROBE_|error:|warning: .*Train|Test Case|Test Suite|\*\* TEST|BUILD" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"
      - name: Gate 0 result
        if: always()
        run: |
          { echo '### Gate 0'; echo; echo "simulator: ${{ steps.sim.outputs.name }} (${{ steps.sim.outputs.runtime }})"; echo; echo '```json'; grep -h 'GATE0_RESULT' "$RUNNER_TEMP/xcodebuild.log" | head -1 | sed 's/.*GATE0_RESULT //' || echo 'no result line'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -h 'GATE0_RESULT' "$RUNNER_TEMP/xcodebuild.log" | head -1 || true
          result=$(grep -h 'GATE0_RESULT' "$RUNNER_TEMP/xcodebuild.log" | head -1 | sed 's/.*GATE0_RESULT //' || true)
          echo "::notice title=gate0::simulator ${{ steps.sim.outputs.name }} (${{ steps.sim.outputs.runtime }}) | ${result:-no GATE0_RESULT line in the xcodebuild log}"
          grep -E "Test Case .*(passed|failed)|\*\* TEST" "$RUNNER_TEMP/xcodebuild.log" | head -6 | while IFS= read -r line; do echo "::notice title=xctest::$line"; done
          # GitHub keeps at most 10 notice annotations per step: the smoke's lines here, the parity lines in the next step
          for key in SMOKE_TRAIL SMOKE_RESULT_1 SMOKE_RESULT_2; do line=$(grep -h "$key " "$RUNNER_TEMP/xcodebuild.log" | head -1 | sed "s/.*$key //" || true); [ -n "$line" ] && echo "::notice title=$key::${line:0:900}"; done; true
          # on a failure, surface what went wrong where the container can read it (annotations): compiler
          # errors, failing assertions, and the tail of the log
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"; then
            grep -E "error:|: error |failed: |XCTAssert|Assertion Failure" "$RUNNER_TEMP/xcodebuild.log" | grep -v "^\s*$" | awk '!seen[$0]++' | head -12 | while IFS= read -r line; do echo "::error title=xcodebuild::${line:0:900}"; done
            tail -c 2500 "$RUNNER_TEMP/xcodebuild.log" | tr '\n' ' ' | sed 's/::/: :/g' | cut -c1-2400 | while IFS= read -r line; do echo "::notice title=log-tail::$line"; done
          fi
      - name: Parity and cutover result (wake, audio, embed, drill and probe lines from the UI tests)
        if: always()
        run: |
          { echo '### Parity and cutover'; echo; echo '```'; grep -hE "PARITY_|SMOKE_AUDIO|SMOKE_DEBUG_BOOT|DRILL_|PROBE_" "$RUNNER_TEMP/xcodebuild.log" | sed -E 's/^.*(PARITY_|SMOKE_|DRILL_|PROBE_)/\1/' | cut -c1-1200 || echo 'no parity lines'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # at most ten notices per step
          for key in SMOKE_AUDIO PARITY_WAKE_1 PARITY_WAKE_2 PARITY_WAKE_3 PARITY_SWITCH PARITY_EMBED_PROBE PARITY_EMBED DRILL_BEFORE DRILL_RESULT PROBE_RESULT; do line=$(grep -h "$key " "$RUNNER_TEMP/xcodebuild.log" | head -1 | sed "s/.*$key //" || true); [ -n "$line" ] && echo "::notice title=$key::${line:0:900}"; done; true
      - name: Regenerate the project and assert no diff
        working-directory: native/ios/App
        run: |
          set -euo pipefail
          cp App.xcodeproj/project.pbxproj "$RUNNER_TEMP/before.pbxproj"
          xcodegen generate
          diff -u "$RUNNER_TEMP/before.pbxproj" App.xcodeproj/project.pbxproj && echo 'project.pbxproj stable across generate' && echo "::notice title=pbxproj::stable across a second xcodegen generate ($(wc -c < App.xcodeproj/project.pbxproj) bytes)"
      - name: Keep the result bundle and log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate0-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gate0.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
