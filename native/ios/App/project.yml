# XcodeGen owns App.xcodeproj (plan v4, R2). Never hand-edit the generated project; change this
# file and run `xcodegen generate`. `npx cap sync ios` manages CapApp-SPM/Package.swift and
# writes App/capacitor.config.json, App/config.xml and App/public (the copied web app).
name: App
options:
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: ../debug.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CapApp-SPM:
    path: CapApp-SPM
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "public"
          - "public/**"
          - "capacitor.config.json"
          - "config.xml"
          - "Info.plist"
      - path: App/public
        type: folder
        optional: true
      - path: App/capacitor.config.json
        optional: true
      - path: App/config.xml
        optional: true
    dependencies:
      - package: CapApp-SPM
        product: CapApp-SPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyndesyte.train
        PRODUCT_NAME: Train
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    scheme:
      testTargets:
        - AppUITests
      gatherCoverageData: false
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyndesyte.train.uitests
        TEST_TARGET_NAME: App
        GENERATE_INFOPLIST_FILE: YES
