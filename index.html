<!-- data.js defines window.EXERCISE_LIBRARY, window.FORM, window.SESSION_TEMPLATES; it MUST load before the inline app script below. Keep both classic (no defer/async/module). -->
<script src="data.js?v=7.2"></script>
<script>
"use strict";
// ===================================================================
// SCHEMA VERSION
// ===================================================================
const SCHEMA_VERSION = 8;
const BUILD_ID = 'v7.2-2026-08-16-form-card';  // bump on every deploy; surfaced in Settings to expose a stale cached shell

// ===================================================================
// DATA BOOTSTRAP - EXERCISE_LIBRARY, FORM, SESSION_TEMPLATES come from data.js,
// which loads before this script. Fail visibly if it did not load.
// ===================================================================
if (!window.EXERCISE_LIBRARY || !window.FORM || !window.FORM.screens || !window.SESSION_TEMPLATES) {
  document.body.innerHTML = '<div style="max-width:32rem;margin:4rem auto;padding:1.5rem;font:16px/1.5 -apple-system,system-ui,sans-serif;color:#222;text-align:center;"><h1 style="font-size:1.25rem;margin:0 0 .5rem;">Train failed to load</h1><p style="margin:0;">Required app data did not load. Refresh and try again.</p></div>';
  throw new Error('Train: data.js failed to load (EXERCISE_LIBRARY/FORM/SESSION_TEMPLATES missing)');
}
const EXERCISE_LIBRARY = window.EXERCISE_LIBRARY;
const FORM = window.FORM;
const SESSION_TEMPLATES = window.SESSION_TEMPLATES;

const ROTATION = ['RP','LP','RPush','LS','RPr'];
const REST_TIMES = { form:0, anchor:150, builder:75, finisher:45 };
const FORM_REST = 0; // Form screens are advance-only, no rest timer

function isDurationUnit(unit){ return unit === 'sec'; }

// ===================================================================
// STATE
// ===================================================================
function loadRaw(){ try { const r = localStorage.getItem('train_state'); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function saveState(s){ try { localStorage.setItem('train_state', JSON.stringify(s)); } catch(e){ console.error('save failed', e); } }

function migrate(state){
  if(!state) return null;
  // Bring any older state up to current schema without losing history.
  if(!state.schemaVersion || state.schemaVersion < 4){
    state.schemaVersion = 4;
  }
  if(!state.log) state.log = [];
  if(!('activeSession' in state)) state.activeSession = null;
  // v4 ring-spine rotation: drop any in-progress session keyed to a retired session type
  // (old U1/L1/U2/L2). Its templates no longer exist, so resuming would throw. History is untouched.
  if(state.activeSession && !SESSION_TEMPLATES[state.activeSession.type]) state.activeSession = null;
  // v7.2 one-screen kata: remap an in-flight session built on the 7-screen Form flow
  // (7 form items collapsed to 1 -> indexes shift by 6; mid-Form restarts the kata).
  {
    const as = state.activeSession;
    if(as && (as.schemaVersion || 0) < 8){
      const t = SESSION_TEMPLATES[as.type];
      if(t && !t.noForm){
        as.cursor = (as.cursor <= 6) ? 0 : as.cursor - 6;
        if(!as.records) as.records = {};
        if(!as.records['form-all']) as.records['form-all'] = { kind:'form', status:'pending' };
      }
      as.schemaVersion = 8;
    }
  }
  // clamp a stale rotationIndex into the new rotation length
  if(typeof state.rotationIndex === 'number') state.rotationIndex = ((state.rotationIndex % ROTATION.length) + ROTATION.length) % ROTATION.length;

  // Session-picker override (Option A): validate against SESSION_TEMPLATES. The picker
  // only ever stores a valid template key; this is the defensive seam against stale
  // storage, schema drift, or hand-edited state. Missing field is initialized to null.
  if(!Object.prototype.hasOwnProperty.call(state, 'nextSessionOverride')) state.nextSessionOverride = null;
  if(state.nextSessionOverride != null && !SESSION_TEMPLATES[state.nextSessionOverride]) state.nextSessionOverride = null;

  // ---- v5 INFRASTRUCTURE (Chunk 2, commit 1) ----
  // Schema/infrastructure only: introduce the total-quality-reps progression scaffolding
  // WITHOUT changing any scoring behavior yet. The legacy HIT fields (promotions,
  // exerciseVariations, promotionLog) deliberately remain top-level and live — they are
  // quarantined later, in the same commit that cuts over their readers, so there is never
  // a half-migrated state with deleted fields and live readers.
  if(!state.progressionEngineVersion || state.progressionEngineVersion < 2){
    // one-time raw backup before the v5 line of work begins (best-effort; never block migration)
    try {
      if(!localStorage.getItem('train_state_backup_pre_v2')){
        localStorage.setItem('train_state_backup_pre_v2', JSON.stringify(state));
      }
    } catch(e){ /* storage unavailable; proceed without backup */ }
    state.progressionEngineVersion = 2;
    state.schemaVersion = 5;  // v5 step only brings state to 5; the v6 backfill below must still run
  }
  if(!state.anchorProgress) state.anchorProgress = {};

  // ---- v5 LEGACY QUARANTINE (Chunk 2, commit 3) ----
  // The old binary HIT/ladder fields are moved under state.legacy and removed from the top
  // level, in the SAME commit that cuts over every reader to the new engine. Any reader that
  // still reaches for a top-level promotion field will now throw loudly (caught and surfaced)
  // instead of silently rendering stale/contradictory progression. One-way; idempotent.
  if(state.promotions !== undefined || state.exerciseVariations !== undefined || state.promotionLog !== undefined){
    state.legacy = state.legacy || {};
    if(state.promotions !== undefined){ state.legacy.promotions = state.promotions; delete state.promotions; }
    if(state.exerciseVariations !== undefined){ state.legacy.exerciseVariations = state.exerciseVariations; delete state.exerciseVariations; }
    if(state.promotionLog !== undefined){ state.legacy.promotionLog = state.promotionLog; delete state.promotionLog; }
  }
  if(!state.legacy) state.legacy = { promotions:{}, exerciseVariations:{}, promotionLog:[] };
  if(!state.legacy.exerciseVariations) state.legacy.exerciseVariations = {};

  // ---- v6 NOTION SYNC INFRASTRUCTURE ----
  // Transport-only fields for the PWA -> Notion mirror. The scoring engine NEVER reads
  // notionSync; it is sync bookkeeping, kept parallel to (not inside) the progression data.
  // localStorage remains the source of truth; Notion is a derived, self-healing mirror.
  if(typeof state.nextSessionSequence !== 'number') state.nextSessionSequence = 0;
  if(!Array.isArray(state.pendingDeletes)) state.pendingDeletes = [];
  // Self-healing backfill: ANY log entry missing transport fields gets them, on EVERY load,
  // regardless of schemaVersion. Repairs states that reached v6 before this assignment ran
  // (e.g. an older state whose v5 step had jumped schemaVersion past the gate). Idempotent:
  // only fills missing fields; the server upsert dedupes by sessionId.
  {
    const _log = state.log || [];
    let _maxSeq = -1;
    _log.forEach((e)=>{ if(typeof e.sessionSequence === 'number' && e.sessionSequence > _maxSeq) _maxSeq = e.sessionSequence; });
    if(state.nextSessionSequence <= _maxSeq) state.nextSessionSequence = _maxSeq + 1;
    _log.forEach((entry)=>{
      if(!entry.sessionId) entry.sessionId = genSessionId();
      if(typeof entry.sessionSequence !== 'number') entry.sessionSequence = state.nextSessionSequence++;
      if(!entry.notionSync) entry.notionSync = { status:'pending', lastAttemptAt:null, syncedAt:null, notionPageId:null, error:null };
    });
  }
  if(state.schemaVersion < 6) state.schemaVersion = 6;

  // ---- v7 ELASTIC SESSIONS (2026-08-16) ----
  // Backfill entry.coreComplete for history (null when the template is retired/unknown or
  // the entry predates performed[]), then re-run the scoreboard replay ONCE under the v3
  // gate: logged quality anchor work scores regardless of session end-state. This is the
  // migration that admits the 2026-07-02 stopped RPush (8/8/8/8 = 32 = owned top):
  // RPush steps to +5 lb and re-baselines — an EXPECTED, test-fixtured outcome.
  (state.log || []).forEach((e)=>{ if(e && !('coreComplete' in e)) e.coreComplete = entryCoreComplete(e); });
  if(state.progressionEngineVersion < 3){
    state.progressionEngineVersion = 3;
    rebuildAnchorProgress(state);
  }
  if(state.schemaVersion < 7) state.schemaVersion = 7;
  return state;
}

// ===================================================================
// CORE GATE (v7 elastic sessions)
// ===================================================================
// Gate slots for a session type: every exercise in a gate:true block, addressed by the
// same slotId vocabulary buildFlow/performed[] use. Null when the template is unknown
// (retired types) or defines no gate.
function templateGateSlots(sessionType){
  const t = SESSION_TEMPLATES[sessionType]; if(!t) return null;
  const slots = [];
  t.blocks.forEach(b=>{ if(b.gate) b.exercises.forEach(exId=> slots.push({ slotId: sessionType+'_'+b.type+'_'+exId, exId })); });
  return slots.length ? slots : null;
}
// Core gate for a LOG ENTRY (historical or fresh): every gate exercise has all sets
// logged with reps > 0 in performed[] — the same completeness predicate the scoring
// engine uses. Returns null (unknown, not false) for pre-engine or retired-type entries.
function entryCoreComplete(entry){
  const slots = entry && templateGateSlots(entry.sessionType);
  if(!slots || !Array.isArray(entry.performed)) return null;
  return slots.every(g=>{
    const p = entry.performed.find(x=> x.slotId === g.slotId && !x.skipped);
    if(!p) return false;
    const ex = EXERCISE_LIBRARY[g.exId]; if(!ex) return false;
    const done = (p.reps || []).filter(r=> typeof r === 'number' && r > 0);
    return done.length >= ex.sets;
  });
}

// Stable per-session id. crypto.randomUUID where available; otherwise a sufficient fallback
// (ids only need to be unique within one user's log to drive idempotent upserts).
function genSessionId(){
  try { if(typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return 'sid-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

// The two heavy-anchor slot identities (must match buildFlow's slotId derivation:
// `${type}_${blockType}_${exId}`). Used by the scoring engine in a later commit; defined
// here so the slot vocabulary lives in one place. Not read by any display yet.
const HEAVY_ANCHOR_SLOTS = {
  'RP_anchor_ring-pullup': { exId:'ring-pullup', label:'Heavy Pull' },
  'RPush_anchor_ring-pushup': { exId:'ring-pushup', label:'Heavy Push' }
};

function getState(){
  let s = migrate(loadRaw());
  if(!s){
    s = { schemaVersion:SCHEMA_VERSION, progressionEngineVersion:2, rotationIndex:0, nextSessionOverride:null, nextSessionSequence:0, pendingDeletes:[], log:[], anchorProgress:{}, legacy:{ promotions:{}, exerciseVariations:{}, promotionLog:[] }, activeSession:null };
    saveState(s);
  }
  return s;
}

// ===================================================================
// SESSION-PICKER OVERRIDE (added 2026-05-30; spec locked Option A)
// ===================================================================
// Behavior contract (do not change without re-running the 8 acceptance tests):
//   - state.nextSessionOverride: SESSION_TEMPLATES key, or null.
//   - Home + Start ALWAYS resolve via getEffectiveSessionType() - never duplicate
//     (override || ROTATION[index]) logic in callers.
//   - On COMPLETED (finalize statusReason==='completed'): rotation advances from
//     the LOGGED sessionType (entry.sessionType), not from the override field
//     and not from rotationIndex+1. The log is source of truth. Override clears.
//   - On STOPPED ('Save partial'): rotation UNCHANGED. Override clears.
//   - On DISCARD: nothing changes. Override PERSISTS (discard = 'didn't happen').
//   - HISTORY DELETE: rebuildAnchorProgress is scoreboard replay only. It never
//     touches rotationIndex or nextSessionOverride. (No edit to that function
//     in this commit - its behavior is correct as-is.)

function isValidSessionType(t){
  return typeof t === 'string' && Object.prototype.hasOwnProperty.call(SESSION_TEMPLATES, t);
}
function getDefaultSessionType(s){ return ROTATION[s.rotationIndex % ROTATION.length]; }
function getEffectiveSessionType(s){
  return isValidSessionType(s.nextSessionOverride) ? s.nextSessionOverride : getDefaultSessionType(s);
}
function hasSessionOverride(s){ return isValidSessionType(s.nextSessionOverride); }
function setSessionOverride(type){
  if(!isValidSessionType(type)) return;
  const s = getState();
  s.nextSessionOverride = type;
  saveState(s);
  renderHome();
}
function clearSessionOverride(){
  const s = getState();
  s.nextSessionOverride = null;
  saveState(s);
  renderHome();
}

function getCurrentVariation(exId){ const s = getState(); return (s.legacy && s.legacy.exerciseVariations && s.legacy.exerciseVariations[exId]) || 0; }
function getVariationName(exId){ const ex = EXERCISE_LIBRARY[exId]; const i = getCurrentVariation(exId); return ex.ladder[Math.min(i, ex.ladder.length-1)]; }

// ===================================================================
// PROMOTION
// ===================================================================
function checkHit(exId, reps){
  const ex = EXERCISE_LIBRARY[exId];
  if(!ex || !reps || reps.length === 0) return false;
  const valid = reps.filter(r => r > 0);
  if(valid.length === 0) return false;
  return valid.length === ex.sets && valid.every(r => r >= ex.repRange[1]);
}
// ===================================================================
// ANCHOR PROGRESSION ENGINE v2 (total quality reps; Chunk 2, commit 3)
// ===================================================================
// Scoreboard for the two heavy ring anchors only (HEAVY_ANCHOR_SLOTS). Progression is
// TOTAL QUALITY REPS across all anchor sets, with a +2 credited-reps/week cap. Raw reps
// are never destroyed (history keeps them); the cap lives only in the credited number.
//
// anchorProgress[slotId] = {
//   exId, label,
//   lastRawQualityReps,            // most recent session's raw total (display truth)
//   creditedQualityReps,           // capped running figure the target is based on (null = establish baseline)
//   previousCreditedQualityReps,   // prior credited (for "+N this week" verdicts)
//   creditCapped,                  // was the most recent credit capped by the +2 rule
//   externalLoad, loadUnit,        // added load on the same movement (backpack/band)
//   variationId,                   // slot-scoped variation (ladder is reference only)
//   lastDate
// }
const WEEKLY_CREDIT_CAP = 2;       // max credited-rep gain per session (target-sanity, not tendon)
const LOAD_STEP_LB = 5;            // default load step when the top total is owned

// Top total for an anchor slot = sets * top-of-rep-range (e.g. 4 x 6 = 24 for pull).
function anchorTopTotal(exId){
  const ex = EXERCISE_LIBRARY[exId];
  return ex.sets * ex.repRange[1];
}

// Apply scoring for one finalized log entry into the in-memory next-state. Pure w.r.t.
// `next` (mutates only next.anchorProgress). Builder work never scores — only performed[]
// items flagged progressionType:'heavyAnchor' whose slotId is a known HEAVY_ANCHOR_SLOT.
function applyAnchorProgressionV2(next, entry){
  if(!next.anchorProgress) next.anchorProgress = {};
  if(!entry || !Array.isArray(entry.performed)) return;
  entry.performed.forEach(p=>{
    if(p.progressionType !== 'heavyAnchor') return;          // only heavy anchors score
    if(!HEAVY_ANCHOR_SLOTS[p.slotId]) return;                // only the two known scoreboard slots
    const ex = EXERCISE_LIBRARY[p.exId]; if(!ex) return;
    // INCOMPLETE GUARD: require all anchor sets present and done (no skipped, full set count).
    if(p.skipped) return;
    const reps = Array.isArray(p.reps) ? p.reps : [];
    const doneReps = reps.filter(r=> typeof r === 'number' && r > 0);
    if(doneReps.length < ex.sets) return;                    // not all sets logged -> no scoring

    const rawQualityReps = doneReps.reduce((a,b)=>a+b, 0);
    const prog = next.anchorProgress[p.slotId] || {
      exId: p.exId, label: (HEAVY_ANCHOR_SLOTS[p.slotId].label || p.exId),
      lastRawQualityReps: null, creditedQualityReps: null, previousCreditedQualityReps: null,
      creditCapped: false, externalLoad: 0, loadUnit: 'lb', variationId: null, lastDate: null
    };
    const prevCredited = (typeof prog.creditedQualityReps === 'number') ? prog.creditedQualityReps : null;

    let credited, creditCapped = false;
    if(prevCredited === null){
      // Establishing a baseline (first session, or just after a load step-up).
      credited = rawQualityReps;
    } else {
      const capped = Math.min(rawQualityReps, prevCredited + WEEKLY_CREDIT_CAP);
      credited = Math.max(capped, prevCredited);             // never decrease credited on a down day
      creditCapped = rawQualityReps > prevCredited + WEEKLY_CREDIT_CAP;
    }

    prog.previousCreditedQualityReps = prevCredited;
    prog.lastRawQualityReps = rawQualityReps;
    prog.creditedQualityReps = credited;
    prog.creditCapped = creditCapped;
    prog.lastDate = entry.date;

    // TOP-OF-RANGE STEP-UP: once credited owns the top total, add load and re-baseline.
    // creditedQualityReps=null => next completed session establishes the baseline at new load.
    const top = anchorTopTotal(p.exId);
    if(typeof prog.creditedQualityReps === 'number' && prog.creditedQualityReps >= top){
      prog.externalLoad = (prog.externalLoad || 0) + LOAD_STEP_LB;
      prog.previousCreditedQualityReps = prog.creditedQualityReps;
      prog.creditedQualityReps = null;     // re-establish baseline at the new load
      prog.steppedUp = true;
    } else {
      prog.steppedUp = false;
    }

    next.anchorProgress[p.slotId] = prog;
  });
}

// Post-session verdict line for an anchor slot, shown under the meter on Home.
// Branch logic is unchanged from the engine commit (no scoring behavior here) —
// only the copy is warmer/clearer. Chunk 3.
function anchorVerdict(prog){
  if(!prog) return '';
  // Same branch logic as before (no scoring change) — warmer post-session copy.
  if(prog.steppedUp) return `You owned the top. Load goes up to +${prog.externalLoad||LOAD_STEP_LB}${prog.loadUnit||'lb'} — next time just set your new baseline.`;
  if(prog.creditedQualityReps === null) return 'Fresh load. First session sets your baseline, no target to beat.';
  const prev = prog.previousCreditedQualityReps;
  if(typeof prev !== 'number') return `Baseline locked in at ${prog.lastRawQualityReps}. Now we climb.`;
  const gain = prog.creditedQualityReps - prev;
  if(gain > 0) return prog.creditCapped
    ? `Huge day — banked +${gain} (capped at +${WEEKLY_CREDIT_CAP}/session so the target stays honest).`
    : `+${gain} rep${gain===1?'':'s'} banked. That counts.`;
  if(prog.lastRawQualityReps >= prev) return 'Matched last time — holding ground is progress on a hard lift.';
  return 'Off your best today, but your banked total holds. No ground lost.';
}

// ===================================================================
// VOLUME
// ===================================================================
function estimateDuration(type){
  const t = SESSION_TEMPLATES[type]; let sec = t.noForm ? 60 : 7*60; // Form ~7 min
  if(t.activation) sec += 90;
  t.blocks.forEach(b=> b.exercises.forEach(exId=>{
    const ex = EXERCISE_LIBRARY[exId];
    const work = isDurationUnit(ex.unit) ? ex.repRange[1] : 30;
    sec += ex.sets * (work + REST_TIMES[b.type]);
  }));
  return Math.round(sec/60);
}
// Core-only estimate — the honest "what does today ask of me" number.
function estimateCoreDuration(type){
  const t = SESSION_TEMPLATES[type]; let sec = t.noForm ? 60 : 7*60;
  if(t.activation) sec += 90;
  t.blocks.forEach(b=>{ if(b.core || b.gate) b.exercises.forEach(exId=>{
    const ex = EXERCISE_LIBRARY[exId];
    const work = isDurationUnit(ex.unit) ? ex.repRange[1] : 30;
    sec += ex.sets * (work + REST_TIMES[b.type]);
  }); });
  return Math.round(sec/60);
}

// ===================================================================
// NOTION SYNC (v6) - PWA -> Netlify Function -> Notion mirror
// ===================================================================
// localStorage is the source of truth; the Notion DB is a derived, self-healing mirror.
// Every finalized session carries a stable sessionId; the server upserts by that id, so a
// timeout that wrote the row but never returned is healed on the next push (no duplicates).
// Sync NEVER blocks finishing a workout, and notionSync metadata is transport-only -
// the scoring engine never reads it.
const SYNC_ENDPOINT = 'https://hyndesyte-train-sync.netlify.app/.netlify/functions/sync-training-session';

function statusToNotion(s){ return s === 'stopped' ? 'Stopped' : s === 'partial' ? 'Partial' : 'Completed'; }

// Build the heavy-anchor block for the payload from the entry alone (stable across re-pushes).
// Performance fields come from performed[]; scoreboard fields from the snapshot taken at
// finalize (absent on backfilled history, which is fine - those fields are simply omitted).
function buildAnchorBlock(entry){
  if(!Array.isArray(entry.performed)) return null;
  const p = entry.performed.find(x => x.progressionType === 'heavyAnchor' && HEAVY_ANCHOR_SLOTS[x.slotId] && !x.skipped);
  if(!p) return null;
  const done = (p.reps || []).filter(r => typeof r === 'number' && r > 0);
  if(!done.length) return null;
  const block = {
    slot: p.slotId,
    exercise: p.exId,
    reps: done.join('/'),
    rawQualityReps: done.reduce((a,b)=>a+b,0),
    targetTotal: anchorTopTotal(p.exId)
  };
  const snap = entry.anchorSnapshot;
  if(snap){
    if(typeof snap.creditedReps === 'number') block.creditedReps = snap.creditedReps;
    if(typeof snap.creditDelta === 'number') block.creditDelta = snap.creditDelta;
    if(typeof snap.creditCapped === 'boolean') block.creditCapped = snap.creditCapped;
    if(typeof snap.load === 'number') block.load = snap.load;
    if(snap.loadUnit) block.loadUnit = snap.loadUnit;
  }
  return block;
}

// Map a log entry -> the Netlify function's upsert contract.
function buildSyncPayload(entry){
  const meta = entry.exerciseMeta || {};
  const issues = Array.isArray(entry.issues) ? entry.issues : [];
  const exercises = Array.isArray(entry.performed) ? entry.performed.map(p => {
    const m = meta[p.exId] || {};
    const ex = EXERCISE_LIBRARY[p.exId];
    const out = { name: ex ? ex.name : p.exId, role: p.role, reps: p.skipped ? 'skipped' : (p.reps || []) };
    if(m.issueFlag === 'issue' && m.note) out.issue = m.note;
    else if(m.note) out.note = m.note;
    return out;
  }) : [];
  const { notionSync, ...rawEntry } = entry;   // keep transport state out of the stored raw
  const payload = {
    op: 'upsert',
    sessionId: entry.sessionId,
    sessionSequence: entry.sessionSequence,
    date: entry.date,
    completedAt: entry.completedAt || null,
    sessionType: entry.sessionType,
    status: statusToNotion(entry.sessionStatus),
    durationMin: typeof entry.duration === 'number' ? entry.duration : null,
    overrideUsed: !!entry.overrideUsed,
    sessionNote: entry.notes || '',
    coreComplete: (typeof entry.coreComplete === 'boolean') ? entry.coreComplete : null,
    issueCount: issues.length,
    issueFlags: [...new Set(issues.map(i => i.exId).filter(Boolean))],
    attentionFlag: !!entry.attentionFlag,
    detail: { exercises, collectedIssues: issues.map(i => i.note).filter(Boolean) },
    raw: rawEntry
  };
  const anchor = buildAnchorBlock(entry);
  if(anchor) payload.anchor = anchor;
  return payload;
}

// Mutate one entry's notionSync in place inside the live state, then persist. Looked up by
// sessionId so a concurrent edit elsewhere can't clobber the whole log.
function markSync(sessionId, patch){
  const s = getState();
  const e = (s.log || []).find(x => x.sessionId === sessionId);
  if(!e) return;
  e.notionSync = Object.assign({ status:'pending', lastAttemptAt:null, syncedAt:null, notionPageId:null, error:null }, e.notionSync, patch);
  saveState(s);
}

async function postSync(body){
  const res = await fetch(SYNC_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('sync ' + res.status);
  return res.json();
}

// Push a single entry (upsert). Non-blocking caller; updates notionSync + the indicator.
async function syncEntry(sessionId){
  const s = getState();
  const entry = (s.log || []).find(x => x.sessionId === sessionId);
  if(!entry) return;
  markSync(sessionId, { status:'pending', lastAttemptAt:new Date().toISOString(), error:null });
  refreshSyncIndicator();
  try {
    const data = await postSync(buildSyncPayload(entry));
    markSync(sessionId, { status:'synced', syncedAt:new Date().toISOString(), notionPageId:(data && data.notionPageId) || null, error:null });
  } catch(e){
    markSync(sessionId, { status:'failed', error:String(e && e.message || e) });
  }
  refreshSyncIndicator();
}

// Drain pending soft-deletes (tombstones), then push every not-yet-synced session oldest-first.
// One attempt per item per call (no hammering); failures stay queued for the next app-open or
// manual retry. A verified failure is left as data, not retried in a tight loop.
let syncDraining = false;
async function pushUnsynced(){
  if(syncDraining) return;
  syncDraining = true;
  try {
    // tombstones first
    let s = getState();
    const deletes = Array.isArray(s.pendingDeletes) ? [...s.pendingDeletes] : [];
    for(const sid of deletes){
      try {
        await postSync({ op:'delete', sessionId: sid });
        const cur = getState();
        cur.pendingDeletes = (cur.pendingDeletes || []).filter(x => x !== sid);
        saveState(cur);
      } catch(e){ /* leave queued; try again next open */ }
    }
    // then unsynced sessions, oldest-first by sequence
    s = getState();
    const pending = (s.log || [])
      .filter(e => e.sessionId && (!e.notionSync || e.notionSync.status !== 'synced'))
      .sort((a,b)=> (a.sessionSequence||0) - (b.sessionSequence||0));
    for(const e of pending){ await syncEntry(e.sessionId); }
  } finally {
    syncDraining = false;
    refreshSyncIndicator();
  }
}

// Indicator reflects real state: Synced when nothing is outstanding, otherwise a pending count
// (red dot if any have hard-failed). Empty before the first session exists.
function refreshSyncIndicator(){
  const el = document.getElementById('sync-indicator'); if(!el) return;
  const s = getState();
  if(!s.log || !s.log.length){ el.innerHTML = ''; return; }
  const pendingSessions = s.log.filter(e => !e.notionSync || e.notionSync.status !== 'synced');
  const failed = pendingSessions.filter(e => e.notionSync && e.notionSync.status === 'failed').length;
  const outstanding = pendingSessions.length + (Array.isArray(s.pendingDeletes) ? s.pendingDeletes.length : 0);
  if(outstanding === 0){ el.innerHTML = '<span class="sync-dot synced"></span>Synced'; return; }
  el.innerHTML = `<span class="sync-dot ${failed ? 'error' : 'syncing'}"></span>${outstanding} pending`;
}

// ===================================================================
// AUDIO (Web Audio; unlocked on a user gesture)
// ===================================================================
let audioCtx = null;
function unlockAudio(){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){ /* audio unavailable; fall back to vibrate only */ }
}
function tone(freq, start, dur, vol){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  const t0 = audioCtx.currentTime + start;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.25, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
// Sound on/off (persisted). Default on.
function soundEnabled(){ try { return localStorage.getItem('train_sound_off') !== '1'; } catch(e){ return true; } }
function setSoundEnabled(on){ try { localStorage.setItem('train_sound_off', on ? '0' : '1'); } catch(e){} }

// Waveform-capable tone. Mirrors tone() but lets a cue pick its timbre.
function toneW(freq, start, dur, vol, type){
  if(!audioCtx || !soundEnabled()) return;
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  const t0 = audioCtx.currentTime + start;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.25, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function buzz(pattern){ if(soundEnabled() && navigator.vibrate) navigator.vibrate(pattern); }

// ---- The six locked cues (vocabulary fixed 2026-05-24) ----
// Rising family (GO / STARTED / SESSION DONE) separated by note count + interval.
// Singles (LOGGED / NOTED) separated by pitch. Shapes carry meaning; on/off only.
function cueGo(){ unlockAudio(); toneW(523,0,0.13,0.30,'triangle'); toneW(784,0.12,0.20,0.34,'triangle'); buzz([90,60,130]); }        // rest over -> go
function cueRelease(){ unlockAudio(); toneW(784,0,0.16,0.26,'sine'); toneW(523,0.16,0.22,0.26,'sine'); buzz([140,80,140]); }       // hold up -> come off
function cueStarted(){ unlockAudio(); toneW(587,0,0.09,0.20,'sine'); toneW(740,0.10,0.12,0.22,'sine'); buzz(50); }                 // hold timing started
function cueLogged(){ unlockAudio(); toneW(587,0,0.14,0.24,'triangle'); buzz(40); }                                               // set saved
function cueSessionDone(){ unlockAudio(); toneW(523,0,0.14,0.28,'triangle'); toneW(659,0.14,0.14,0.30,'triangle'); toneW(784,0.30,0.26,0.32,'triangle'); buzz([110,70,110,70,150]); } // workout complete
function cueNoted(){ unlockAudio(); toneW(392,0,0.16,0.20,'sine'); buzz(30); }                                                    // skip / issue logged

// ===================================================================
// SESSION STATE MACHINE
// ===================================================================
// activeSession (persisted in state.activeSession):
// { schemaVersion, type, startTime, cursor, phase, setIdx, timerEnd, timerKind,
//   records:{ uid:{ kind, exId?, sets:[], setStatus:[], status, issueFlag, note, quality, painFree } },
//   sessionNote, issues:[] }
let timerRAF = null;
let AS = null; // in-memory mirror of activeSession

function buildFlow(type){
  const t = SESSION_TEMPLATES[type];
  const flow = [];
  if(!t.noForm) flow.push({ kind:'form', uid:'form-all' });
  if(t.activation) flow.push({ kind:'activation', uid:'activation' });
  t.blocks.forEach(block=> block.exercises.forEach(exId=> flow.push({ kind:'exercise', uid:'ex-'+exId, exId, blockType:block.type, blockLabel:block.label, core: !!(block.core || block.gate), gate: !!block.gate, slotId: type+'_'+block.type+'_'+exId, progressionType: block.progressionType || 'loose' })));
  return flow;
}

// ---- ACTIVE-TIME CLOCK (v7): duration is accumulated engaged time, never wall-clock
// span. Gaps beyond the idle cap (backgrounded, left) don't count; Park freezes the
// clock entirely. Kills the multi-day "4,256 min" duration class at the source.
const IDLE_GAP_CAP_MS = 10*60*1000;
function markActive(){
  if(!AS || AS.parkedAt) return;
  const now = Date.now();
  if(typeof AS.activeMs !== 'number') AS.activeMs = 0;
  if(AS.lastActiveAt) AS.activeMs += Math.min(now - AS.lastActiveAt, IDLE_GAP_CAP_MS);
  AS.lastActiveAt = now;
}
function sessionActiveMinutes(){
  markActive();
  if(typeof AS.activeMs === 'number') return Math.max(1, Math.round(AS.activeMs/60000));
  return Math.max(1, Math.round((Date.now() - AS.startTime)/60000)); // legacy in-flight session
}
// Core gate for the LIVE session — same predicate as entryCoreComplete, read from records.
function liveCoreComplete(){
  if(!AS) return false;
  const slots = templateGateSlots(AS.type); if(!slots) return false;
  const flow = currentFlow();
  return slots.every(g=>{
    const st = flow.find(x=> x.kind === 'exercise' && x.slotId === g.slotId); if(!st) return false;
    const rec = AS.records[st.uid]; const ex = EXERCISE_LIBRARY[g.exId];
    if(!rec || !ex) return false;
    let done = 0;
    rec.setStatus.forEach((s,i)=>{ if(s === 'done' && rec.sets[i] > 0) done++; });
    return done >= ex.sets;
  });
}

function persistAS(){ markActive(); const s = getState(); s.activeSession = AS; saveState(s); }

function startSession(type){
  unlockAudio();
  const flow = buildFlow(type);
  AS = {
    schemaVersion: SCHEMA_VERSION,
    type, startTime: Date.now(),
    activeMs: 0, lastActiveAt: Date.now(), coreForkShown: false,
    cursor: 0, phase: 'view', setIdx: 0,
    timerEnd: null, timerKind: null,
    records: {}, sessionNote: '', issues: []
  };
  flow.forEach(st=>{
    if(st.kind === 'exercise'){
      const ex = EXERCISE_LIBRARY[st.exId];
      AS.records[st.uid] = { kind:'exercise', exId:st.exId, sets:new Array(ex.sets).fill(0), setStatus:new Array(ex.sets).fill('pending'), status:'pending', issueFlag:'none', note:'', quality:'unknown', painFree:'unknown' };
    } else {
      AS.records[st.uid] = { kind: st.kind, status:'pending' };
    }
  });
  persistAS();
  enterSessionScreen();
}

function resumeSession(){
  const s = getState();
  if(!s.activeSession){ renderHome(); return; }
  AS = s.activeSession;
  // Un-park: clear the bound, restart the clock. Frozen timers stay paused — the user
  // restarts them deliberately (no ambush).
  if(AS.parkedAt){ delete AS.parkedAt; delete AS.parkExpiresAt; }
  if(typeof AS.activeMs !== 'number') AS.activeMs = 0;
  AS.lastActiveAt = Date.now();
  // Reconcile a timer that expired while the app was closed. Cold resume never
  // fires a cue (GO/RELEASE) — the user is already looking at the resume state,
  // so surprise audio on page load would be worse than silence.
  let reconciled = false;
  if(AS.timerEnd && Date.now() >= AS.timerEnd){
    const wasKind = AS.timerKind;
    const expiredAt = AS.timerEnd;
    clearTimerState();
    if(wasKind === 'rest' && AS.phase === 'rest'){
      // Rest finished while away → terminal rest-complete; wait for the user's tap.
      AS.phase = 'restComplete';
    } else if(wasKind === 'work' && AS.phase === 'work'){
      // Hold finished while away. Treat it as a completed hold (mirrors
      // onWorkTimerComplete), then place the user correctly relative to the rest
      // that would have started at expiredAt — never a dead 'work' screen.
      reconcileExpiredWork(expiredAt);
    }
    reconciled = true;
  }
  if(reconciled) persistAS();
  enterSessionScreen();
}

// Cold-resume handler for a hold timer that expired while the app was closed.
// Marks the set complete at full target, then branches on the rest window:
// still-running rest → 'rest' with correct remaining; elapsed rest → 'restComplete';
// no rest (final set/station or restSec 0) → advance. Plays no cue (cold resume).
function reconcileExpiredWork(expiredAt){
  const flow = currentFlow();
  const st = flow[AS.cursor];
  const ex = EXERCISE_LIBRARY[st.exId];
  const rec = AS.records[st.uid];
  rec.sets[AS.setIdx] = ex.repRange[1]; // full hold achieved
  rec.setStatus[AS.setIdx] = 'done';
  clearTimerState();
  const restSec = REST_TIMES[st.blockType] || 0;
  const moreSets = AS.setIdx + 1 < ex.sets;
  const moreStations = AS.cursor + 1 < flow.length;
  if(restSec > 0 && (moreSets || moreStations)){
    const restEnd = expiredAt + restSec*1000;
    if(Date.now() >= restEnd){
      AS.phase = 'restComplete'; // rest already elapsed while away
    } else {
      AS.phase = 'rest';
      AS.timerKind = 'rest';
      AS.timerEnd = restEnd; // resume the rest already in progress, not a fresh one
    }
  } else {
    // No rest after this set: advance the cursor exactly as advanceAfterSet would.
    if(moreSets){
      AS.setIdx++; AS.phase = 'view';
    } else {
      rec.status = rec.setStatus.every(x=>x==='skipped') ? 'skipped' : 'done';
      AS.cursor++; AS.setIdx = 0; AS.phase = 'view';
    }
  }
}

function enterSessionScreen(){
  const t = SESSION_TEMPLATES[AS.type];
  document.getElementById('session-title').textContent = t.name;
  const gc = t.grip === 'high' ? 'var(--grip-high)' : t.grip === 'low' ? 'var(--grip-low)' : 'var(--grip-none)';
  document.getElementById('session-grip').innerHTML = `<span class="grip-dot" style="background:${gc}"></span>`;
  showScreen('session');
  renderStation();
}

function currentFlow(){ return buildFlow(AS.type); }

function renderProgressBar(){
  const flow = currentFlow();
  const wrap = document.getElementById('flow-progress');
  wrap.innerHTML = flow.map((st,i)=>{
    let cls = 'flow-seg';
    if(i < AS.cursor) cls += ' done';
    else if(i === AS.cursor) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
}

function renderStation(){
  if(!AS){ showScreen('home'); return; }
  const flow = currentFlow();
  if(AS.phase === 'coreFork'){ renderCoreFork(); return; }
  if(AS.cursor >= flow.length){ renderCompletion(); return; }
  renderProgressBar();
  const st = flow[AS.cursor];
  if(st.kind === 'form') renderFormStation(st);
  else if(st.kind === 'activation') renderActivationStation(st);
  else renderExerciseStation(st);
}

// ---- CORE FORK (v7 elastic sessions) ----
// Shown once, at the moment the core gate is earned with extension work remaining.
// Primary = Finish: Core IS the completed session (red-team Major 2 — the primary action
// matches the declared success unit; extensions are a genuine option, not a debt).
function maybeEnterCoreFork(){
  if(!AS || AS.coreForkShown) return false;
  const flow = currentFlow();
  const lastCoreIdx = flow.reduce((acc,st,i)=> st.core ? i : acc, -1);
  if(lastCoreIdx === -1) return false;
  if(AS.cursor <= lastCoreIdx) return false;   // still inside the core path
  if(AS.cursor >= flow.length) return false;   // nothing after core -> normal completion
  if(!liveCoreComplete()) return false;        // gate not earned (e.g. skipped anchor sets)
  AS.coreForkShown = true;
  AS.phase = 'coreFork';
  return true;
}
function renderCoreFork(){

}

// Demo modal for a Form step: embedded video, or an open-in-browser card for page links.
function showFormRef(idx){

  let html = sc.breath ? `<div style="font-size:13px;color:var(--text2);font-style:italic;margin-bottom:10px;">${sc.breath}</div>` : '';
  if(ref.status === 'video'){
    const u = buildEmbedUrl(ref);
    if(u) html += `<div style="position:relative;width:100%;padding-bottom:56.25%;background:#000;border-radius:8px;overflow:hidden;"><iframe src="${u}" style="position:absolute;inset:0;width:100%;height:100%;border:0;" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
    if(ref.fallbackUrl) html += `<div style="margin-top:8px;"><a href="${ref.fallbackUrl}" target="_blank" rel="noopener" style="font-size:12px;color:var(--text2);">Not loading? Open source ↗</a></div>`;
    if(ref.sourceLabel) html += `<div style="font-size:11px;color:var(--text3);margin-top:6px;">Source: ${ref.sourceLabel}</div>`;
  } else if(ref.status === 'link' && ref.url){
    html += `<a href="${ref.url}" target="_blank" rel="noopener" style="display:block;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);text-decoration:none;font-size:14px;font-weight:600;">Open demo ↗<span style="display:block;font-size:12px;color:var(--text2);font-weight:400;margin-top:3px;">${ref.sourceLabel || ''}</span></a>`;
  }
  document.getElementById('modal-title').textContent = sc.title.replace(/&amp;/g,'&');
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-actions').innerHTML = '<button class="btn btn-secondary" onclick="hideModal()">Close</button>';
  document.getElementById('modal').classList.add('visible');
}
function advanceForm(){ unlockAudio(); const flow = currentFlow(); const st = flow[AS.cursor]; if(!AS.records[st.uid]) AS.records[st.uid] = { kind: st.kind, status:'pending' }; AS.records[st.uid].status = 'done'; AS.cursor++; AS.phase='view'; AS.setIdx=0; persistAS(); renderStation(); }
function skipFormScreen(){ cueNoted(); const flow = currentFlow(); const st = flow[AS.cursor]; if(!AS.records[st.uid]) AS.records[st.uid] = { kind: st.kind, status:'pending' }; AS.records[st.uid].status = 'skipped'; AS.cursor++; AS.phase='view'; AS.setIdx=0; persistAS(); renderStation(); }

// ---- EXERCISE STATION ----
function renderExerciseStation(st){
  const ex = EXERCISE_LIBRARY[st.exId];
  const rec = AS.records[st.uid];
  const varName = getVariationName(st.exId);
  const isDur = isDurationUnit(ex.unit);
  const top = ex.repRange[1];
  const body = document.getElementById('flow-body');
  const foot = document.getElementById('flow-foot');

  // set pills
  const pills = rec.sets.map((v,i)=>{
    let cls = 'set-pill';
    if(rec.setStatus[i] === 'skipped') cls += ' skipped';
    else if(rec.setStatus[i] === 'done'){ cls += (v >= top && v > 0) ? ' hit' : ' done'; }
    if(i === AS.setIdx && AS.phase !== 'rest') cls += ' current';
    const label = rec.setStatus[i] === 'skipped' ? '–' : (rec.setStatus[i] === 'done' ? v : (i+1));
    return `<div class="${cls}">${label}</div>`;
  }).join('');

  const showLookahead = (AS.phase === 'view' || AS.phase === 'ready' || AS.phase === 'log' || AS.phase === 'work' || AS.phase === 'workPaused');
  const head = `
    ${showLookahead ? `<div style="font-size:12px;color:var(--text3);margin-bottom:6px;">Coming up: ${nextFlowItemLabel()}</div>` : ''}
    <div class="flow-meta">
      <span class="badge badge-${AS.type.toLowerCase()}">${st.blockLabel}</span>
      Set ${Math.min(AS.setIdx+1, ex.sets)} of ${ex.sets}
    </div>
    <div class="flow-title">${varName}</div>
    <div class="flow-sub">${ex.name} &middot; target ${ex.repRange[0]}–${ex.repRange[1]} ${ex.unit}</div>
    <div class="set-pills">${pills}</div>`;

  if(AS.phase === 'restComplete'){
    // Terminal rest state: timer hit zero, GO already played. Wait for the user.
    body.innerHTML = head + `
      <div class="statebig-rc">Rest complete</div>
      <div class="exercise-note" style="text-align:center;">Next: ${restNextLabel(st, ex)}</div>${thenLine(ex)}`;
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="startNextAfterRest()">Start Next Set</button>
      <div class="flow-actions-row">
        <button class="mini-btn" onclick="redoLastSet()">Redo last set</button>
        <button class="mini-btn" onclick="noteIssue()">Note</button>
        <button class="mini-btn warn" onclick="confirmStopSession()">Stop</button>
      </div>`;
    return;
  }

  if(AS.phase === 'rest' || AS.phase === 'restPaused'){
    const paused = AS.phase === 'restPaused';
    // Rest timer view (chains after a logged/duration set)
    body.innerHTML = head + `
      <div class="timer-phase">${paused ? 'Rest paused' : 'Rest'}</div>
      <div class="timer-big rest" id="timer-display">${paused ? fmtRemaining() : '--'}</div>
      <div class="exercise-note">Next: ${restNextLabel(st, ex)}</div>${thenLine(ex)}`;
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="endRestNow()">Skip rest → Next</button>
      <div class="flow-actions-row">
        <button class="mini-btn" onclick="${paused ? 'resumeTimer()' : 'pauseTimer()'}">${paused ? 'Resume' : 'Pause'}</button>
        <button class="mini-btn" onclick="noteIssue()">Note issue</button>
        <button class="mini-btn warn" onclick="confirmStopSession()">Stop</button>
      </div>`;
    if(!paused) startTimerLoop();
    return;
  }

  if(isDur && (AS.phase === 'work' || AS.phase === 'workPaused')){
    const paused = AS.phase === 'workPaused';
    body.innerHTML = head + `
      <div class="timer-phase">${paused ? 'Paused' : 'Hold'}</div>
      <div class="timer-big work" id="timer-display">${paused ? fmtRemaining() : '--'}</div>
      <div class="exercise-note">${refCue(ex)}</div>`;
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="${paused ? 'resumeTimer()' : 'pauseTimer()'}">${paused ? 'Resume' : 'Pause'}</button>
      <div class="flow-actions-row">
        <button class="mini-btn" onclick="finishDurationEarly()">End set early</button>
        <button class="mini-btn" onclick="skipCurrentSet()">Skip set</button>
        <button class="mini-btn warn" onclick="confirmStopSession()">Stop</button>
      </div>`;
    if(!paused) startTimerLoop();
    return;
  }

  // phase === 'view' / 'ready' / 'log'
  if(isDur){
    // duration set ready
    body.innerHTML = head + `
      <div class="target-pill">Hold for ${top} ${ex.unit}</div>
      <div class="exercise-note">${refCue(ex)}</div>
      <button class="ref-btn" onclick="showRef('${st.exId}')">&#9654; Reference</button>`;
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="startDurationSet()">Start hold</button>
      <div class="flow-actions-row">
        <button class="mini-btn" onclick="skipCurrentSet()">Skip set</button>
        <button class="mini-btn" onclick="skipExercise()">Skip exercise</button>
        <button class="mini-btn warn" onclick="confirmStopSession()">Stop</button>
      </div>`;
  } else {
    // rep set ready/log
    const cur = rec.sets[AS.setIdx] || '';
    body.innerHTML = head + `
      <div class="target-pill">Target ${ex.repRange[0]}–${ex.repRange[1]} ${ex.unit}</div>
      <input class="rep-input-big" id="rep-input" type="number" inputmode="numeric" pattern="[0-9]*" value="${cur}" placeholder="0" onfocus="this.select()">
      <div class="exercise-note">${refCue(ex)}</div>
      <button class="ref-btn" onclick="showRef('${st.exId}')">&#9654; Reference</button>`;
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="logRepSet()">Log set</button>
      <div class="flow-actions-row">
        <button class="mini-btn" onclick="skipCurrentSet()">Skip set</button>
        <button class="mini-btn" onclick="skipExercise()">Skip exercise</button>
        <button class="mini-btn warn" onclick="confirmStopSession()">Stop</button>
      </div>`;
  }
}

function nextFlowItemLabel(){
  const flow = currentFlow();
  const next = flow[AS.cursor + 1];
  if(!next) return 'Finish';
  if(next.kind === 'form') return 'Form';
  if(next.kind === 'activation') return (SESSION_TEMPLATES[AS.type].activation || {}).title || 'Prep';
  return getVariationName(next.exId);
}

function restNextLabel(st, ex){
  // What comes after this rest?
  if(AS.setIdx + 1 < ex.sets) return `${getVariationName(st.exId)} — set ${AS.setIdx + 2}`;
  const flow = currentFlow();
  const next = flow[AS.cursor + 1];
  if(!next) return 'Finish session';
  if(next.kind === 'form') return 'Form';
  if(next.kind === 'activation') return (SESSION_TEMPLATES[AS.type].activation || {}).title || 'Prep';
  return getVariationName(next.exId);
}
// The exercise AFTER this one — shown during between-set rests (2026-06-03 note).
function thenLine(ex){
  if(AS.setIdx + 1 >= ex.sets) return '';
  return `<div style="font-size:12px;color:var(--text3);text-align:center;margin-top:4px;">Then: ${nextFlowItemLabel()}</div>`;
}

// ---- rep set ----
function logRepSet(){
  unlockAudio();
  const flow = currentFlow(); const st = flow[AS.cursor]; const ex = EXERCISE_LIBRARY[st.exId]; const rec = AS.records[st.uid];
  const input = document.getElementById('rep-input');
  const val = parseInt(input && input.value, 10) || 0;
  rec.sets[AS.setIdx] = val;
  rec.setStatus[AS.setIdx] = 'done';
  cueLogged();
  beginRestOrAdvance(st, ex, rec);
}

// ---- duration set ----
function startDurationSet(){
  unlockAudio();
  const flow = currentFlow(); const st = flow[AS.cursor]; const ex = EXERCISE_LIBRARY[st.exId];
  AS.phase = 'work';
  AS.timerKind = 'work';
  AS.timerEnd = Date.now() + ex.repRange[1]*1000;
  cueStarted();
  persistAS();
  renderStation();
}
function finishDurationEarly(){
  const flow = currentFlow(); const st = flow[AS.cursor]; const ex = EXERCISE_LIBRARY[st.exId]; const rec = AS.records[st.uid];
  const elapsed = Math.max(1, ex.repRange[1] - Math.max(0, Math.round((AS.timerEnd - Date.now())/1000)));
  stopTimerLoop();
  rec.sets[AS.setIdx] = elapsed;
  rec.setStatus[AS.setIdx] = 'done';
  clearTimerState();
  cueLogged();
  beginRestOrAdvance(st, ex, rec);
}
function onWorkTimerComplete(){
  const flow = currentFlow(); const st = flow[AS.cursor]; const ex = EXERCISE_LIBRARY[st.exId]; const rec = AS.records[st.uid];
  rec.sets[AS.setIdx] = ex.repRange[1]; // full hold achieved
  rec.setStatus[AS.setIdx] = 'done';
  cueRelease();
  clearTimerState();
  beginRestOrAdvance(st, ex, rec);
}

function beginRestOrAdvance(st, ex, rec){
  const restSec = REST_TIMES[st.blockType] || 0;
  // If there are more sets or another station, run a rest timer; otherwise advance.
  const moreSets = AS.setIdx + 1 < ex.sets;
  const flow = currentFlow();
  const moreStations = AS.cursor + 1 < flow.length;
  if(restSec > 0 && (moreSets || moreStations)){
    AS.phase = 'rest';
    AS.timerKind = 'rest';
    AS.timerEnd = Date.now() + restSec*1000;
    persistAS();
    renderStation();
  } else {
    advanceAfterSet();
  }
}
// Clears every timer-related field. Used on every path that leaves a work/rest
// timer so stale paused-remaining time can never resurface in a later phase.
function clearTimerState(){ AS.timerEnd = null; AS.timerKind = null; AS.timerRemaining = null; }
function endRestNow(){ stopTimerLoop(); clearTimerState(); advanceAfterSet(); }
// Pause/resume for work and rest timers. Stores remaining ms so the absolute
// timerEnd can be rebuilt on resume (survives the wall-clock model).
function fmtRemaining(){
  const ms = (AS && AS.timerRemaining != null) ? AS.timerRemaining
           : (AS && AS.timerEnd ? Math.max(0, AS.timerEnd - Date.now()) : 0);
  const sec = Math.max(0, Math.round(ms/1000));
  return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
}
function pauseTimer(){
  if(!AS || !AS.timerEnd) return;
  stopTimerLoop();
  AS.timerRemaining = Math.max(0, AS.timerEnd - Date.now());
  AS.timerEnd = null;
  AS.phase = (AS.phase === 'rest') ? 'restPaused' : 'workPaused';
  persistAS();
  renderStation();
}
function resumeTimer(){
  if(!AS || AS.timerRemaining == null) return;
  AS.timerEnd = Date.now() + AS.timerRemaining;
  AS.timerRemaining = null;
  AS.phase = (AS.phase === 'restPaused') ? 'rest' : 'work';
  persistAS();
  renderStation();
}
// User-tapped advance from the terminal restComplete state.
function startNextAfterRest(){ unlockAudio(); advanceAfterSet(); }
// Rest timer expiring must NOT auto-advance. Play GO and wait for the user's tap.
function onRestTimerComplete(){ cueGo(); clearTimerState(); AS.phase='restComplete'; persistAS(); renderStation(); }

function advanceAfterSet(){
  const flow = currentFlow(); const st = flow[AS.cursor]; const ex = EXERCISE_LIBRARY[st.exId]; const rec = AS.records[st.uid];
  if(AS.setIdx + 1 < ex.sets){
    AS.setIdx++; AS.phase = 'view';
  } else {
    rec.status = rec.setStatus.every(s=>s==='skipped') ? 'skipped' : 'done';
    AS.cursor++; AS.setIdx = 0; AS.phase = 'view';
    maybeEnterCoreFork();
  }
  persistAS();
  renderStation();
}

function redoLastSet(){
  stopTimerLoop();
  const flow = currentFlow(); const st = flow[AS.cursor]; const rec = AS.records[st.uid];
  rec.sets[AS.setIdx] = 0; rec.setStatus[AS.setIdx] = 'pending';
  AS.phase = 'view'; clearTimerState();
  persistAS();
  renderStation();
}

function skipCurrentSet(){
  cueNoted();
  stopTimerLoop();
  const flow = currentFlow(); const st = flow[AS.cursor]; const ex = EXERCISE_LIBRARY[st.exId]; const rec = AS.records[st.uid];
  rec.sets[AS.setIdx] = 0; rec.setStatus[AS.setIdx] = 'skipped';
  clearTimerState();
  if(AS.setIdx + 1 < ex.sets){ AS.setIdx++; AS.phase='view'; persistAS(); renderStation(); }
  else { advanceAfterSet(); }
}

function skipExercise(){
  cueNoted();
  stopTimerLoop();
  const flow = currentFlow(); const st = flow[AS.cursor]; const rec = AS.records[st.uid];
  rec.setStatus = rec.setStatus.map(s=> s==='done' ? s : 'skipped');
  rec.sets = rec.sets.map((v,i)=> rec.setStatus[i]==='done' ? v : 0);
  rec.status = rec.setStatus.some(s=>s==='done') ? 'done' : 'skipped';
  clearTimerState();
  AS.cursor++; AS.setIdx = 0; AS.phase = 'view';
  maybeEnterCoreFork();
  persistAS();
  renderStation();
}

// The exercise's text cue, read from the reference schema (note field retired in the
// curation pass). Empty string if somehow absent — callers supply their own fallback.
function refCue(ex){ return (ex && ex.reference && ex.reference.cue) || ''; }

// Reference modal (v1 curation): cues-first, in-PWA. Renders the standalone form cue, an
// inline embedded clip when status==='video' (built from mediaType + videoId + start/end;
// loads paused, no autoplay dependency), a "not loading?" source fallback, engaged muscles
// as text, and a source label. status: 'text' (cue only, a complete state) | 'video' |
// 'broken' (degrades to cue + fallback). Muscle-highlight graphics intentionally deferred.
function buildEmbedUrl(ref){
  const id = ref.videoId;
  if(!id) return null;
  if(ref.mediaType === 'youtube'){
    let u = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?playsinline=1&rel=0&modestbranding=1';
    if(ref.start) u += '&start=' + ref.start;
    if(ref.end) u += '&end=' + ref.end;
    return u;
  }
  if(ref.mediaType === 'vimeo'){
    let u = 'https://player.vimeo.com/video/' + encodeURIComponent(id) + '?playsinline=1&title=0&byline=0&portrait=0';
    if(ref.start) u += '#t=' + ref.start + 's';
    return u;
  }
  return null;
}
function showRef(exId){
  const ex = EXERCISE_LIBRARY[exId]; if(!ex) return;
  const ref = ex.reference || {};
  const status = ref.status || 'text';
  const cue = refCue(ex) || 'Text cue coming soon.';
  const title = getVariationName(exId);
  const embedUrl = (status === 'video') ? buildEmbedUrl(ref) : null;
  let html = `<div style="font-size:14px;color:var(--text);line-height:1.45;">${cue}</div>`;
  if(embedUrl){
    html += `<div style="position:relative;width:100%;padding-bottom:56.25%;margin-top:14px;background:#000;border-radius:8px;overflow:hidden;"><iframe src="${embedUrl}" style="position:absolute;inset:0;width:100%;height:100%;border:0;" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
    if(ref.fallbackUrl) html += `<div style="margin-top:8px;"><a href="${ref.fallbackUrl}" target="_blank" rel="noopener" style="font-size:12px;color:var(--text2);">Not loading? Open source ↗</a></div>`;
    if(ref.sourceLabel) html += `<div style="font-size:11px;color:var(--text3);margin-top:6px;">Source: ${ref.sourceLabel}</div>`;
  } else if(status === 'broken' && ref.fallbackUrl){
    html += `<div style="margin-top:10px;"><a href="${ref.fallbackUrl}" target="_blank" rel="noopener" style="font-size:12px;color:var(--text2);">Open reference ↗</a></div>`;
  }
  if(Array.isArray(ref.muscles) && ref.muscles.length) html += `<div style="font-size:12px;color:var(--text3);margin-top:14px;">Muscles: ${ref.muscles.join(', ')}</div>`;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-actions').innerHTML = '<button class="btn btn-secondary" onclick="hideModal()">Close</button>';
  document.getElementById('modal').classList.add('visible');
}

function noteIssue(){
  const flow = currentFlow(); const st = flow[AS.cursor]; const rec = AS.records[st.uid];
  const txt = prompt('Add a note for this set:', rec.note || '');
  if(txt === null) return;
  rec.note = txt.trim();
  rec.issueFlag = txt.trim() ? 'issue' : 'none';
  if(txt.trim()){ AS.issues.push({ exId: st.exId || null, note: txt.trim() }); cueNoted(); }
  persistAS();
}

// ---- TIMER LOOP (absolute-time based; survives backgrounding) ----
function startTimerLoop(){
  stopTimerLoop();
  const tick = ()=>{
    if(!AS || !AS.timerEnd){ return; }
    const remaining = Math.max(0, Math.round((AS.timerEnd - Date.now())/1000));
    const el = document.getElementById('timer-display');
    if(el){ const m = Math.floor(remaining/60), s = remaining%60; el.textContent = m + ':' + String(s).padStart(2,'0'); }
    if(remaining <= 0){
      stopTimerLoop();
      const kind = AS.timerKind;
      if(kind === 'work') onWorkTimerComplete();
      else if(kind === 'rest') onRestTimerComplete();
      return;
    }
    timerRAF = setTimeout(tick, 250);
  };
  tick();
}
function stopTimerLoop(){ if(timerRAF){ clearTimeout(timerRAF); timerRAF = null; } }

// ---- LEAVE / PARK / STOP / COMPLETE ----
function confirmStopSession(){
  // v7 leave sheet: Park primary (resumable, bounded, self-clearing); End & save = Stopped
  // (still counts + scores if core done); Discard destroys with no log entry.
  showModal('Leave session?',
    'Park it and pick up where you left off — parks clear after tomorrow. Or end it now and save what’s done.',
    [
      { text:'Park through tomorrow', cls:'btn-primary',   action:()=>{ hideModal(); parkSession(); } },
      { text:'End & save',            cls:'btn-secondary', action:()=>{ hideModal(); finalizeSession('stopped'); } },
      { text:'Discard',               cls:'btn-danger',    action:()=>{ hideModal(); discardCurrentSession(); } },
      { text:'Cancel',                cls:'btn-secondary', action:()=>hideModal() }
    ], { stack:true });
}

// ---- PARK (v7): thin metadata on the already-resumable activeSession. Atomically
// freezes any live timer into the existing paused representation (timerRemaining), so a
// hold can never "complete" while parked. The bound is fixed from parkedAt — end of the
// FOLLOWING local day — and reopening the app never slides it. Expiry is lazy (no
// scheduler, no notification): enforced on the first Home render past the bound.
function endOfNextDay(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()+2); return d.getTime(); }
function parkSession(){
  if(!AS) return;
  stopTimerLoop();
  if(AS.timerEnd){
    AS.timerRemaining = Math.max(0, AS.timerEnd - Date.now());
    AS.timerEnd = null;
    AS.phase = (AS.phase === 'rest') ? 'restPaused' : (AS.phase === 'work') ? 'workPaused' : AS.phase;
  }
  markActive();                       // bank the segment, THEN freeze the clock
  AS.lastActiveAt = null;
  AS.parkedAt = Date.now();
  AS.parkExpiresAt = endOfNextDay(AS.parkedAt);
  persistAS();
  AS = null;
  showScreen('home');
}
// Finalize an expired park as-is (Completed iff core done), quietly. Returns true if it
// finalized — that path re-renders Home; the caller must stop rendering stale state.
function expireParkIfDue(){
  const s = getState();
  const a = s.activeSession;
  if(a && a.parkedAt && a.parkExpiresAt && Date.now() > a.parkExpiresAt){
    AS = a;
    finalizeSession('parkExpired');
    return true;
  }
  return false;
}

// Single source of truth for "destroy the in-progress session without logging".
// Called from confirmStopSession's Discard and from Home's Resume-card Discard.
// Clears AS, nulls activeSession in storage, plays no cue, advances no rotation, writes no log.
function discardCurrentSession(){
  stopTimerLoop();
  const s = getState();
  s.activeSession = null;
  saveState(s);
  AS = null;
  showScreen('home');
}

function renderCompletion(){
  stopTimerLoop();
  renderProgressBar();
  const flow = currentFlow();
  let done=0, skipped=0, exTotal=0;
  flow.forEach(st=>{ if(st.kind==='exercise'){ exTotal++; const r=AS.records[st.uid]; if(r.setStatus && r.setStatus.some(s=>s==='done')) done++; else skipped++; } });
  const body = document.getElementById('flow-body');
  body.innerHTML = `
    <div class="flow-meta"><span class="badge badge-${AS.type.toLowerCase()}">${AS.type}</span> Session review</div>
    <div class="flow-title">Nice work.</div>
    <div class="flow-sub">${done} completed &middot; ${skipped} skipped of ${exTotal} exercises.${SESSION_TEMPLATES[AS.type].noForm ? '' : ' The Form is done too.'}</div>
    <div style="margin-top:14px;">
      <div class="move-name" style="font-size:14px;margin-bottom:8px;">Anything to note? (optional)</div>
      <textarea class="note-field" id="session-note" rows="3" placeholder="How it felt, anything to remember…">${AS.sessionNote||''}</textarea>
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--text2);cursor:pointer;">
        <input type="checkbox" id="session-attention" ${AS.attentionFlag?'checked':''} style="width:18px;height:18px;flex:none;">
        Flag this session for review
      </label>
    </div>`;
  const foot = document.getElementById('flow-foot');
  foot.innerHTML = `<button class="btn btn-primary" onclick="finalizeSession('completed')">Complete Session</button>`;
}

function finalizeSession(statusReason){
  stopTimerLoop();
  if(!AS){ showScreen('home'); return; }
  const noteEl = document.getElementById('session-note');
  if(noteEl) AS.sessionNote = noteEl.value.trim();
  const attnEl = document.getElementById('session-attention');
  if(attnEl) AS.attentionFlag = !!attnEl.checked;

  // TRANSACTIONAL FINALIZE (Chunk 2, commit 2):
  // Build the entire next state in memory, validate it, then save ONCE and render.
  // On any throw, we neither save nor advance rotation — the in-progress session is
  // left intact so the user can retry, rather than half-committing.
  try {
    const flow = currentFlow();
    const today = new Date().toISOString().split('T')[0];
    const gc = liveCoreComplete();   // the v7 core gate, computed while records are live

    // Build the slot-aware performed/skipped records from flow metadata (added in commit 1).
    // performed[] preserves slotId + exId + role + progressionType + reps for each exercise
    // (the durable shape commit 3's scoring engine reads). exercises{exId:[reps]} and
    // skipped[] are kept in parallel for backward-compatible reads (history/sync/renderers).
    const exercises = {}; const skipped = []; const exerciseMeta = {}; const performed = [];
    let anyDone = false, anySkipped = false;
    flow.forEach(st=>{
      if(st.kind !== 'exercise') return;
      const rec = AS.records[st.uid];
      const role = (st.progressionType === 'heavyAnchor') ? 'anchor' : (st.blockType || 'builder');
      const doneSets = rec.setStatus.map((status,i)=> status==='done' ? rec.sets[i] : null).filter(v=>v!==null);
      const wasSkippedWhole = rec.setStatus.every(x=>x==='skipped') || (rec.status==='skipped' && doneSets.length===0);
      const reps = rec.sets.map((v,i)=> rec.setStatus[i]==='done' ? v : 0);
      if(wasSkippedWhole || doneSets.length===0){
        skipped.push(st.exId); anySkipped = true;
        performed.push({ slotId: st.slotId, exId: st.exId, role, progressionType: st.progressionType || 'loose', reps, skipped: true });
      } else {
        exercises[st.exId] = reps;
        anyDone = true;
        if(rec.setStatus.some(x=>x==='skipped')) anySkipped = true;
        performed.push({ slotId: st.slotId, exId: st.exId, role, progressionType: st.progressionType || 'loose', reps });
      }
      // reserved fields preserved (hidden)
      exerciseMeta[st.exId] = { setStatus:rec.setStatus, issueFlag:rec.issueFlag, note:rec.note||'', quality:rec.quality, painFree:rec.painFree };
    });

    // v7 status: Completed = core done (extension tail optional, never demotes). Stopped
    // stays a DISTINCT intent status; coreComplete is the orthogonal counting gate.
    let sessionStatus;
    if(statusReason === 'stopped') sessionStatus = 'stopped';
    else if(statusReason === 'parkExpired') sessionStatus = gc ? 'completed' : 'partial';
    else sessionStatus = gc ? 'completed' : (anySkipped ? 'partial' : 'completed');

    const entry = {
      date: today, sessionType: AS.type, logSchemaVersion: 2, coreComplete: gc,
      sessionId: genSessionId(),
      completedAt: new Date().toISOString(),
      attentionFlag: !!AS.attentionFlag,
      exercises, skipped: skipped.length ? skipped : undefined,
      performed,
      sessionStatus, exerciseMeta,
      issues: AS.issues.length ? AS.issues : undefined,
      notes: AS.sessionNote || undefined,
      duration: sessionActiveMinutes()
    };

    // Build next state in memory (do not mutate live state until validated).
    const next = getState();
    entry.sessionSequence = next.nextSessionSequence++;
    entry.overrideUsed = ROTATION.indexOf(entry.sessionType) !== -1 && entry.sessionType !== getDefaultSessionType(next);
    entry.notionSync = { status:'pending', lastAttemptAt:null, syncedAt:null, notionPageId:null, error:null };
    next.log.push(entry);

    // ANCHOR SCORING (v3 gate): end-state no longer gates scoring. The complete-anchor
    // predicate is UNCHANGED and remains the only quality gate — "one great set, then
    // stop" still earns nothing. Builder work never scores.
    applyAnchorProgressionV2(next, entry);
    {
      // Snapshot the heavy-anchor scoreboard for this session so the Notion mirror's credited
      // figures stay correct even when this entry is re-pushed after later sessions move the
      // running scoreboard. Performance fields (reps, raw total) are re-derived at send time.
      const ap = entry.performed.find(x => x.progressionType === 'heavyAnchor' && HEAVY_ANCHOR_SLOTS[x.slotId] && !x.skipped);
      if(ap && next.anchorProgress[ap.slotId]){
        const sb = next.anchorProgress[ap.slotId];
        entry.anchorSnapshot = {
          creditedReps: (typeof sb.creditedQualityReps === 'number') ? sb.creditedQualityReps : null,
          creditDelta: (typeof sb.creditedQualityReps === 'number' && typeof sb.previousCreditedQualityReps === 'number') ? (sb.creditedQualityReps - sb.previousCreditedQualityReps) : null,
          creditCapped: !!sb.creditCapped,
          load: sb.externalLoad || 0,
          loadUnit: sb.loadUnit || 'lb'
        };
      }
    }

    // Rotation + override (v7 invariant, red-teamed 2026-08-16): advance iff CORE achieved
    // and rotation type, from the LOGGED sessionType (GPT blocker 1). Override is consumed
    // iff the selected rotation session achieved core — pre-core stop/park-expiry
    // PRESERVES it. Floor (MVS) never advances or consumes. Discard never reaches here.
    const rotIdx = ROTATION.indexOf(entry.sessionType);
    if(entry.coreComplete && rotIdx !== -1){
      next.rotationIndex = (rotIdx + 1) % ROTATION.length;
      next.nextSessionOverride = null;
    }

    next.activeSession = null;

    // Validate before committing: log grew by exactly one, rotation index in range,
    // active session cleared. If anything is off, throw — nothing is saved, rotation
    // does not advance, the in-progress session stays put.
    if(!Array.isArray(next.log) || next.log.length < 1) throw new Error('finalize: log invalid');
    if(typeof next.rotationIndex !== 'number' || next.rotationIndex < 0 || next.rotationIndex >= ROTATION.length) throw new Error('finalize: rotationIndex out of range');
    if(next.activeSession !== null) throw new Error('finalize: activeSession not cleared');

    saveState(next);   // single write
    AS = null;
    if(statusReason === 'completed') cueSessionDone();
    syncEntry(entry.sessionId);   // fire-and-forget; never blocks finishing
    showScreen('home');
  } catch(err){
    // Do NOT save, do NOT advance rotation, do NOT null AS — leave the session resumable.
    console.error('finalizeSession aborted; no state saved', err);
    showModal('Could not finish session', 'Something went wrong saving this session, so nothing was changed. Your in-progress session is still here — try finishing again.', [
      { text:'OK', cls:'btn-secondary', action:()=>hideModal() }
    ]);
  }
}

let currentScreen = 'home';
function showScreen(name){
  if(name !== 'session') stopTimerLoop();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  currentScreen = name;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const map = { home:'today', history:'history', reference:'exercises', settings:'settings' };
  document.querySelectorAll('.nav-btn').forEach(b=>{ if(b.textContent.trim().toLowerCase().includes(map[name]||name)) b.classList.add('active'); });
  if(name==='home') renderHome();
  if(name==='history') renderHistory();
  if(name==='reference') renderReference();
  if(name==='settings') renderSettings();
}
