<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="theme-color" content="#0a0a0a">
<title>Train</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1e1e1e;
  --border: #2a2a2a;
  --text: #e8e8e8;
  --text2: #888;
  --text3: #555;
  --accent: #4ade80;
  --accent-dim: #22543d;
  --warn: #fbbf24;
  --warn-dim: #78350f;
  --hit: #4ade80;
  --miss: #555;
  --grip-high: #ef4444;
  --grip-low: #fbbf24;
  --grip-none: #4ade80;
  --font: 'SF Pro Text', -apple-system, system-ui, sans-serif;
  --font-mono: 'SF Mono', 'Menlo', monospace;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
}

body { }

.screen { display:none; height:100vh; height:100dvh; flex-direction:column; overflow:hidden; }
.screen.active { display:flex; }

/* Scrollable content area */
.scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding: 12px 16px; }

/* Header */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 12px 16px; padding-top: calc(12px + var(--safe-top));
  border-bottom: 1px solid var(--border);
  min-height: 48px; flex-shrink:0;
}
.header h1 { font-size:18px; font-weight:700; letter-spacing:-0.3px; }
.header-btn {
  background:none; border:none; color:var(--text2); font-size:14px;
  padding:8px; cursor:pointer; font-family:var(--font);
}
.header-btn:active { color:var(--text); }

/* Cards */
.card {
  background: var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:14px; margin-bottom:10px;
}

/* Session type badges */
.badge {
  display:inline-block; padding:3px 10px; border-radius:6px;
  font-size:12px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase;
}
.badge-u1 { background:#1e3a5f; color:#60a5fa; }
.badge-u2 { background:#3b1f5e; color:#c084fc; }
.badge-l1 { background:#1e3b1e; color:#4ade80; }
.badge-l2 { background:#3b351e; color:#fbbf24; }

/* Grip indicator */
.grip-dot {
  display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:8px; vertical-align:middle;
}

/* Buttons */
.btn {
  display:block; width:100%; padding:14px; border:none; border-radius:10px;
  font-family:var(--font); font-size:16px; font-weight:600;
  cursor:pointer; text-align:center; transition: opacity 0.1s;
}
.btn:active { opacity:0.7; }
.btn-primary { background:var(--accent); color:#0a0a0a; }
.btn-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.btn-small { padding:10px 16px; font-size:14px; width:auto; display:inline-block; }
.btn-danger { background:#7f1d1d; color:#fca5a5; }

/* Home screen */
.next-session-title { font-size:24px; font-weight:800; letter-spacing:-0.5px; margin:6px 0 2px; }
.session-meta { color:var(--text2); font-size:13px; margin-bottom:12px; }

/* Streak dots */
.streak-row { display:flex; gap:6px; margin:12px 0; }
.streak-dot {
  width:28px; height:28px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:9px; color:var(--text3); font-weight:600;
}
.streak-dot.done { background:var(--accent-dim); color:var(--accent); }
.streak-dot.empty { background:var(--surface2); border:1px solid var(--border); }
.streak-dot.today { border:2px solid var(--accent); }

/* Nav */
.nav {
  display:flex; border-top:1px solid var(--border); flex-shrink:0;
  padding-bottom: var(--safe-bottom); background:var(--surface);
}
.nav-btn {
  flex:1; padding:10px 0 8px; background:none; border:none;
  color:var(--text3); font-size:10px; font-family:var(--font);
  cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
}
.nav-btn.active { color:var(--accent); }
.nav-icon { font-size:20px; }

/* Session screen */
.block-label {
  font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  color:var(--text3); margin:20px 0 8px; padding-top:8px;
  border-top:1px solid var(--border);
}
.block-label:first-child { border-top:none; margin-top:8px; }

.exercise-card {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px; margin-bottom:8px;
}
.exercise-name { font-size:15px; font-weight:600; margin-bottom:2px; }
.exercise-detail { font-size:12px; color:var(--text2); margin-bottom:10px; }
.exercise-note { font-size:11px; color:var(--text3); font-style:italic; margin-top:8px; }

/* Set logging */
.sets-row { display:flex; gap:6px; align-items:center; flex-wrap: wrap; }
.set-input {
  width:48px; height:44px; background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-family:var(--font-mono);
  font-size:18px; text-align:center; -webkit-appearance:none;
}
.set-input:focus { border-color:var(--accent); outline:none; }
.set-input.hit { border-color:var(--hit); background:var(--accent-dim); }
.set-label { font-size:10px; color:var(--text3); text-align:center; width:48px; }
.target-label { font-size:12px; color:var(--text2); margin-left:auto; white-space:nowrap; }

/* Rest timer */
.rest-timer {
  position:fixed; bottom:60px; left:0; right:0; z-index:100;
  background:var(--surface); border-top:1px solid var(--border);
  padding:12px 16px; display:none; align-items:center; gap:12px;
}
.rest-timer.visible { display:flex; }
.rest-time {
  font-family:var(--font-mono); font-size:28px; font-weight:700; min-width:70px;
}
.rest-time.done { color:var(--accent); }
.rest-label { font-size:12px; color:var(--text2); flex:1; }
.rest-dismiss {
  background:var(--surface2); border:1px solid var(--border); color:var(--text2);
  padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer;
  font-family:var(--font);
}

/* Promotion prompt */
.promo-card {
  background:var(--accent-dim); border:1px solid var(--accent);
  border-radius:10px; padding:14px; margin-bottom:8px;
}
.promo-card h3 { color:var(--accent); font-size:14px; margin-bottom:4px; }
.promo-card p { font-size:13px; color:var(--text2); margin-bottom:10px; }
.promo-actions { display:flex; gap:8px; }

/* History */
.history-item {
  background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:14px; margin-bottom:8px; cursor:pointer;
}
.history-date { font-size:13px; color:var(--text2); }
.history-type { font-size:16px; font-weight:600; margin:4px 0; }
.history-hits { font-size:12px; color:var(--accent); }
.history-detail { display:none; margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
.history-item.expanded .history-detail { display:block; }
.history-exercise { font-size:13px; margin-bottom:6px; }
.history-exercise span { color:var(--text2); }

/* Progress */
.progress-section { margin-bottom:24px; }
.progress-section h2 { font-size:15px; font-weight:700; margin-bottom:12px; }
.bar-chart { display:flex; align-items:flex-end; gap:4px; height:100px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
.bar {
  width:100%; background:var(--accent-dim); border-radius:4px 4px 0 0; min-height:2px;
  transition: height 0.3s;
}
.bar-label { font-size:9px; color:var(--text3); }
.bar-value { font-size:10px; color:var(--text2); }

.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stat-box {
  background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:14px; text-align:center;
}
.stat-num { font-size:28px; font-weight:800; font-family:var(--font-mono); }
.stat-label { font-size:11px; color:var(--text2); margin-top:4px; }

/* Promotion log */
.promo-log-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;
}
.promo-log-item:last-child { border-bottom:none; }
.promo-arrow { color:var(--accent); margin:0 6px; }

/* Settings */
.setting-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 0; border-bottom:1px solid var(--border);
}
.setting-row:last-child { border-bottom:none; }

/* Exercise reference */
.ref-exercise { padding:10px 0; border-bottom:1px solid var(--border); }
.ref-exercise:last-child { border-bottom:none; }
.ref-name { font-size:14px; font-weight:600; }
.ref-ladder { font-size:12px; color:var(--text2); margin-top:4px; }
.ref-current { color:var(--accent); font-weight:600; }

/* Empty state */
.empty { text-align:center; padding:40px 20px; color:var(--text3); }
.empty-icon { font-size:40px; margin-bottom:12px; }

/* Sync indicator */
.sync-dot {
  width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle;
}
.sync-dot.synced { background:var(--accent); }
.sync-dot.syncing { background:var(--warn); animation: pulse 1s infinite; }
.sync-dot.error { background:var(--grip-high); }
.sync-dot.none { background:var(--text3); }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
.sync-status { font-size:11px; color:var(--text3); display:flex; align-items:center; }
.sync-url-input {
  width:100%; background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-family:var(--font-mono);
  font-size:12px; padding:10px; margin:8px 0; -webkit-appearance:none;
}
.sync-url-input:focus { border-color:var(--accent); outline:none; }
.setup-steps { font-size:12px; color:var(--text2); line-height:1.8; }
.setup-steps code { background:var(--surface2); padding:2px 6px; border-radius:4px; font-family:var(--font-mono); font-size:11px; }

/* Confirm modal */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200;
  display:none; align-items:flex-end; justify-content:center;
}
.modal-overlay.visible { display:flex; }
.modal {
  background:var(--surface); border-radius:16px 16px 0 0;
  padding:24px 16px; width:100%; max-width:500px;
  padding-bottom: calc(16px + var(--safe-bottom));
}
.modal h3 { font-size:17px; margin-bottom:8px; }
.modal p { font-size:14px; color:var(--text2); margin-bottom:16px; }
.modal-actions { display:flex; gap:8px; }
.modal-actions .btn { flex:1; }
</style>
</head>
<body>

<!-- ==================== HOME SCREEN ==================== -->
<div id="screen-home" class="screen active">
  <div class="header">
    <div style="display:flex;align-items:center;gap:8px;">
      <h1>Train</h1>
      <span id="sync-indicator" class="sync-status"></span>
    </div>
    <button class="header-btn" onclick="showScreen('settings')">&#9881;</button>
  </div>
  <div class="scroll">
    <div id="home-content"></div>
  </div>
  <nav class="nav">
    <button class="nav-btn active" onclick="showScreen('home')">
      <span class="nav-icon">&#9679;</span>Today
    </button>
    <button class="nav-btn" onclick="showScreen('history')">
      <span class="nav-icon">&#9776;</span>History
    </button>
    <button class="nav-btn" onclick="showScreen('progress')">
      <span class="nav-icon">&#9650;</span>Progress
    </button>
    <button class="nav-btn" onclick="showScreen('reference')">
      <span class="nav-icon">&#9881;</span>Exercises
    </button>
  </nav>
</div>

<!-- ==================== SESSION SCREEN ==================== -->
<div id="screen-session" class="screen">
  <div class="header">
    <button class="header-btn" onclick="confirmExitSession()">&#8592; Back</button>
    <h1 id="session-title"></h1>
    <div id="session-grip"></div>
  </div>
  <div class="scroll" id="session-content"></div>
  <div style="padding:12px 16px; flex-shrink:0; border-top:1px solid var(--border);">
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <button class="feel-btn" data-feel="easy" onclick="setFeel('easy')" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:13px;font-family:var(--font);cursor:pointer;">Easy</button>
      <button class="feel-btn" data-feel="solid" onclick="setFeel('solid')" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:13px;font-family:var(--font);cursor:pointer;">Solid</button>
      <button class="feel-btn" data-feel="hard" onclick="setFeel('hard')" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:13px;font-family:var(--font);cursor:pointer;">Hard</button>
    </div>
    <input type="text" id="session-notes" placeholder="Notes (optional)" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:13px;padding:10px;margin-bottom:8px;-webkit-appearance:none;">
    <button class="btn btn-primary" onclick="completeSession()">Complete Session</button>
  </div>
  <div class="rest-timer" id="rest-timer">
    <div class="rest-time" id="rest-time">2:30</div>
    <div class="rest-label" id="rest-label">Rest</div>
    <button class="rest-dismiss" onclick="dismissTimer()">Skip</button>
  </div>
</div>

<!-- ==================== HISTORY SCREEN ==================== -->
<div id="screen-history" class="screen">
  <div class="header">
    <h1>History</h1>
  </div>
  <div class="scroll" id="history-content"></div>
  <nav class="nav">
    <button class="nav-btn" onclick="showScreen('home')">
      <span class="nav-icon">&#9679;</span>Today
    </button>
    <button class="nav-btn active" onclick="showScreen('history')">
      <span class="nav-icon">&#9776;</span>History
    </button>
    <button class="nav-btn" onclick="showScreen('progress')">
      <span class="nav-icon">&#9650;</span>Progress
    </button>
    <button class="nav-btn" onclick="showScreen('reference')">
      <span class="nav-icon">&#9881;</span>Exercises
    </button>
  </nav>
</div>

<!-- ==================== PROGRESS SCREEN ==================== -->
<div id="screen-progress" class="screen">
  <div class="header">
    <h1>Progress</h1>
  </div>
  <div class="scroll" id="progress-content"></div>
  <nav class="nav">
    <button class="nav-btn" onclick="showScreen('home')">
      <span class="nav-icon">&#9679;</span>Today
    </button>
    <button class="nav-btn" onclick="showScreen('history')">
      <span class="nav-icon">&#9776;</span>History
    </button>
    <button class="nav-btn active" onclick="showScreen('progress')">
      <span class="nav-icon">&#9650;</span>Progress
    </button>
    <button class="nav-btn" onclick="showScreen('reference')">
      <span class="nav-icon">&#9881;</span>Exercises
    </button>
  </nav>
</div>

<!-- ==================== REFERENCE SCREEN ==================== -->
<div id="screen-reference" class="screen">
  <div class="header">
    <h1>Exercises</h1>
  </div>
  <div class="scroll" id="reference-content"></div>
  <nav class="nav">
    <button class="nav-btn" onclick="showScreen('home')">
      <span class="nav-icon">&#9679;</span>Today
    </button>
    <button class="nav-btn" onclick="showScreen('history')">
      <span class="nav-icon">&#9776;</span>History
    </button>
    <button class="nav-btn" onclick="showScreen('progress')">
      <span class="nav-icon">&#9650;</span>Progress
    </button>
    <button class="nav-btn active" onclick="showScreen('reference')">
      <span class="nav-icon">&#9881;</span>Exercises
    </button>
  </nav>
</div>

<!-- ==================== SETTINGS SCREEN ==================== -->
<div id="screen-settings" class="screen">
  <div class="header">
    <button class="header-btn" onclick="showScreen('home')">&#8592; Back</button>
    <h1>Settings</h1>
    <div></div>
  </div>
  <div class="scroll" id="settings-content"></div>
</div>

<!-- ==================== MODAL ==================== -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
// ===================================================================
// DATA MODEL
// ===================================================================

const EXERCISE_LIBRARY = {
  // === U1 Exercises (Ring-dominant) ===
  'ring-row': {
    name: 'Ring Row', grip: 'high',
    ladder: ['Inverted Row (feet down)', 'Ring Row (feet elevated)', 'Archer Ring Row', 'Front Lever Tuck Row'],
    repRange: [5, 8], sets: 3, unit: 'reps',
    note: 'Full range, slow eccentric. Control the bottom. Grip: heel of palm over ring, not fingers.'
  },
  'ring-pushup': {
    name: 'Ring Push-Up', grip: 'high',
    ladder: ['Ring Push-Up', 'Ring Push-Up (feet elevated)', 'Ring Archer Push-Up', 'Ring Dip (partial)'],
    repRange: [6, 10], sets: 3, unit: 'reps',
    note: 'Turn rings out at top. Elbows at 45°. Grip: heel of palm over ring, not fingers.'
  },
  'ring-support': {
    name: 'Ring Support Hold', grip: 'high',
    ladder: ['Ring Support Hold', 'Ring Support (turned out)', 'Ring L-Sit Support', 'Ring Support + Slow Turn'],
    repRange: [15, 30], sets: 3, unit: 'sec',
    note: 'Locked arms, rings turned out. Breathe. Grip: heel of palm over ring, not fingers.'
  },
  'ring-curl': {
    name: 'Ring Bicep Curl', grip: 'high',
    ladder: ['Ring Curl (steep angle)', 'Ring Curl (moderate)', 'Ring Curl (low angle)', 'Ring Curl (feet elevated)'],
    repRange: [8, 12], sets: 2, unit: 'reps',
    note: 'Slow eccentric, strict body line. Grip: heel of palm over ring, not fingers.'
  },
  'ring-pullup': {
    name: 'Ring Pull-Up', grip: 'high',
    ladder: ['Ring Negative Pull-Up (5s)', 'Ring Pull-Up (band assist)', 'Ring Pull-Up', 'Ring L-Sit Pull-Up'],
    repRange: [3, 6], sets: 3, unit: 'reps',
    note: 'Rings allow natural wrist rotation — use it. Start from dead hang, pull to chest, slow negative. Grip: heel of palm over ring.',
    travelAlt: 'Same — rings are portable.'
  },

  // === U2 Exercises (Parallette/DB) ===
  'para-pushup': {
    name: 'Parallette Push-Up', grip: 'low',
    ladder: ['Parallette Push-Up', 'Parallette Deficit Push-Up', 'Parallette Archer Push-Up', 'Parallette Planche Lean Push-Up'],
    repRange: [6, 10], sets: 3, unit: 'reps',
    note: 'Neutral grip. Full depth past handles.'
  },
  'db-press': {
    name: 'DB Floor Press', grip: 'low',
    ladder: ['DB Floor Press', 'DB Floor Press (slow ecc)', 'DB Floor Press (pause)', 'DB Single-Arm Floor Press'],
    repRange: [8, 12], sets: 3, unit: 'reps',
    note: '25lb DBs. Control the bottom, pause at chest.'
  },
  'ring-face-pull': {
    name: 'Ring Face Pull', grip: 'low',
    ladder: ['Ring Y-Raise', 'Ring Face Pull', 'Ring Face Pull (feet up)', 'Ring Face Pull + Hold'],
    repRange: [8, 12], sets: 3, unit: 'reps',
    note: 'Light angle. Strict form, squeeze rear delts.'
  },
  'ab-wheel': {
    name: 'Ab Wheel Rollout', grip: 'low',
    ladder: ['Kneeling Partial Rollout', 'Kneeling Full Rollout', 'Kneeling Rollout + Pause', 'Standing Partial Rollout'],
    repRange: [5, 10], sets: 3, unit: 'reps',
    note: 'Hollow body throughout. Don\'t collapse lower back.'
  },
  'pike-pushup': {
    name: 'Pike Push-Up', grip: 'low',
    ladder: ['Pike Push-Up', 'Pike Push-Up (elevated feet)', 'Parallette Pike Push-Up (deficit)', 'Wall HSPU Negative (5s)'],
    repRange: [5, 8], sets: 3, unit: 'reps',
    note: 'Overhead pressing pattern. Head passes between hands. 8ft ceiling is fine for parallette pike.',
    travelAlt: 'Pike push-up on floor — no equipment needed.'
  },

  // === L1 Exercises (Hinge-primary) ===
  'jefferson-curl': {
    name: 'Jefferson Curl', grip: 'none',
    ladder: ['BW Jefferson Curl', 'Light DB Jefferson Curl', 'DB Jefferson Curl (slow)', 'DB Jefferson Curl (deficit)'],
    repRange: [5, 8], sets: 3, unit: 'reps',
    note: 'Light weight. Vertebra by vertebra. Never rush.'
  },
  'glute-bridge': {
    name: 'Glute-Ham Bridge', grip: 'none',
    ladder: ['Glute Bridge', 'Glute Bridge (feet elevated)', 'Single-Leg Glute Bridge', 'Single-Leg Bridge (elevated)'],
    repRange: [8, 12], sets: 3, unit: 'reps',
    note: 'Drive through heels. Squeeze at top.'
  },
  'single-leg-rdl': {
    name: 'Single-Leg RDL', grip: 'none',
    ladder: ['BW Single-Leg RDL', 'DB Single-Leg RDL', 'DB SL RDL (slow ecc)', 'DB SL RDL (deficit)'],
    repRange: [6, 10], sets: 3, unit: 'reps/side',
    note: 'Hinge at hip, not back. Light touch on wall for balance if needed. 25lb DB in opposite hand.',
    travelAlt: 'BW single-leg RDL — no equipment needed.'
  },
  'jump-rope': {
    name: 'Jump Rope', grip: 'none',
    ladder: ['Jump Rope 20s on/off', 'Jump Rope 30s on/off', 'Jump Rope 40s on/off', 'Jump Rope 30s on/15s off'],
    repRange: [4, 6], sets: 1, unit: 'rounds',
    note: 'Stay light on feet. Sub hill sprints outdoors.',
    travelAlt: 'Hill sprints or burpees.'
  },
  'hanging-knee-raise': {
    name: 'Hanging Knee Raise', grip: 'none',

// ===================================================================
// STATE MANAGEMENT
// ===================================================================

function loadState() {
  try {
    const raw = localStorage.getItem('train_state');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function saveState(state) {
  localStorage.setItem('train_state', JSON.stringify(state));
}

// ===================================================================
// GOOGLE SHEETS SYNC
// ===================================================================

function getSyncUrl() {
  try { return localStorage.getItem('train_sync_url') || ''; } catch(e) { return ''; }
}

function setSyncUrl(url) {
  localStorage.setItem('train_sync_url', url.trim());
}

function updateSyncIndicator(status) {
  const el = document.getElementById('sync-indicator');
  if (!el) return;
  const url = getSyncUrl();
  if (!url) {
    el.innerHTML = '';
    return;
  }
  const labels = { synced: 'Synced', syncing: 'Syncing...', error: 'Sync failed', none: '' };
  el.innerHTML = `<span class="sync-dot ${status}"></span>${labels[status] || ''}`;
}

async function syncToSheet() {
  const url = getSyncUrl();
  if (!url) return;
  updateSyncIndicator('syncing');
  try {
    const state = loadState();
    if (!state) return;

    // Build human-readable log rows for the Sheet
    // Include exercise names resolved from the library
    const logRows = state.log.map(entry => {
      const rows = [];
      if (entry.exercises) {
        Object.entries(entry.exercises).forEach(([exId, reps]) => {
          const ex = EXERCISE_LIBRARY[exId];
          const varIdx = state.exerciseVariations[exId] || 0;
          const varName = ex ? ex.ladder[Math.min(varIdx, ex.ladder.length - 1)] : exId;
          const hit = ex ? reps.every(r => r >= ex.repRange[1]) : false;
          rows.push({
            date: entry.date,
            session: entry.sessionType,
            exercise: ex ? ex.name : exId,
            variation: varName,
            sets: reps,
            hit: hit,
            duration: entry.duration || 0,
            feel: entry.feel || '',
            notes: entry.notes || ''
          });
        });
      }
      if (entry.skipped) {
        entry.skipped.forEach(exId => {
          const ex = EXERCISE_LIBRARY[exId];
          rows.push({
            date: entry.date,
            session: entry.sessionType,
            exercise: ex ? ex.name : exId,
            variation: 'SKIPPED',
            sets: [],
            hit: false,
            duration: entry.duration || 0,
            feel: entry.feel || '',
            notes: entry.notes || ''
          });
        });
      }
      return rows;
    }).flat();

    const payload = {
      state: state,
      logRows: logRows,
      lastLogCount: state.log.length
    };

    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
      mode: 'no-cors'
    });
    updateSyncIndicator('synced');
    localStorage.setItem('train_last_sync', new Date().toISOString());
  } catch(e) {
    console.error('Sync push failed:', e);
    updateSyncIndicator('error');
  }
}

async function pullFromSheet() {
  const url = getSyncUrl();
  if (!url) return false;
  updateSyncIndicator('syncing');
  try {
    const resp = await fetch(url + '?action=pull', { mode: 'cors' });
    if (!resp.ok) throw new Error('Pull failed');
    const data = await resp.json();
    if (data && data.log && Array.isArray(data.log)) {
      const local = loadState();
      // Merge strategy: use whichever has more sessions
      // (covers: new phone with no data, or same phone with recent data)
      if (!local || local.log.length < data.log.length) {
        saveState(data);
        updateSyncIndicator('synced');
        return true; // data was restored
      }
    }
    updateSyncIndicator('synced');
    return false;
  } catch(e) {
    console.error('Sync pull failed:', e);
    updateSyncIndicator('error');
    return false;
  }
}

async function testSync() {
  const url = getSyncUrl();
  if (!url) { alert('Enter a sync URL first.'); return; }
  updateSyncIndicator('syncing');
  try {
    const resp = await fetch(url + '?action=ping', { mode: 'cors' });
    const text = await resp.text();
    if (text.includes('ok') || text.includes('pong')) {
      updateSyncIndicator('synced');
      alert('Connected! Sync is working.');
      // Do an initial push
      syncToSheet();
    } else {
      updateSyncIndicator('error');
      alert('Unexpected response. Check the URL and redeploy the script.');
    }
  } catch(e) {
    updateSyncIndicator('error');
    alert('Could not connect. Make sure:\n1. The URL starts with https://script.google.com/\n2. The script is deployed as "Anyone"\n3. You have internet access');
  }
}

function getState() {
  let state = loadState();
  if (!state) {
    state = {
      rotationIndex: 0,
      log: [],
      promotions: {},
      promotionLog: [],
      exerciseVariations: {}
    };
    saveState(state);
  }
  // Ensure all fields exist
  if (!state.promotions) state.promotions = {};
  if (!state.promotionLog) state.promotionLog = [];
  if (!state.exerciseVariations) state.exerciseVariations = {};
  if (!state.log) state.log = [];
  return state;
}

function getCurrentVariation(exerciseId) {
  const state = getState();
  return state.exerciseVariations[exerciseId] || 0;
}

function getVariationName(exerciseId) {
  const ex = EXERCISE_LIBRARY[exerciseId];
  const idx = getCurrentVariation(exerciseId);
  return ex.ladder[Math.min(idx, ex.ladder.length - 1)];
}

// ===================================================================
// PROMOTION LOGIC
// ===================================================================

function checkHit(exerciseId, reps) {
  const ex = EXERCISE_LIBRARY[exerciseId];
  if (!reps || reps.length === 0) return false;
  const target = ex.repRange[1];
  return reps.every(r => r >= target);
}

function getPromotionState(exerciseId) {
  const state = getState();
  return state.promotions[exerciseId] || { consecutiveHits: 0 };
}

function updatePromotionTracking(exerciseId, wasHit) {
  const state = getState();
  if (!state.promotions[exerciseId]) {
    state.promotions[exerciseId] = { consecutiveHits: 0 };
  }
  if (wasHit) {
    state.promotions[exerciseId].consecutiveHits++;
  } else {
    state.promotions[exerciseId].consecutiveHits = 0;
  }
  saveState(state);
}

function isReadyToPromote(exerciseId) {
  const state = getState();
  const promo = state.promotions[exerciseId];
  if (!promo) return false;
  const ex = EXERCISE_LIBRARY[exerciseId];
  const currentVar = getCurrentVariation(exerciseId);
  if (currentVar >= ex.ladder.length - 1) return false;
  return promo.consecutiveHits >= 2;
}

function promoteExercise(exerciseId) {
  const state = getState();
  const ex = EXERCISE_LIBRARY[exerciseId];
  const oldVar = getCurrentVariation(exerciseId);
  if (oldVar >= ex.ladder.length - 1) return;
  const newVar = oldVar + 1;
  state.exerciseVariations[exerciseId] = newVar;
  state.promotions[exerciseId] = { consecutiveHits: 0 };
  state.promotionLog.push({
    exerciseId,
    from: ex.ladder[oldVar],
    to: ex.ladder[newVar],
    date: new Date().toISOString().split('T')[0]
  });
  saveState(state);
}

// ===================================================================
// SESSION DURATION ESTIMATE
// ===================================================================

function estimateSessionDuration(sessionType) {
  const template = SESSION_TEMPLATES[sessionType];
  let totalSeconds = 0;
  template.blocks.forEach(block => {
    block.exercises.forEach(exId => {
      const ex = EXERCISE_LIBRARY[exId];
      const sets = ex.sets;
      const workingTimePerSet = ex.unit === 'sec' ? ex.repRange[1] : 30;
      const restPerSet = REST_TIMES[block.type];
      totalSeconds += sets * (workingTimePerSet + restPerSet);
    });
  });
  return Math.round(totalSeconds / 60);
}

// ===================================================================
// STREAK / STATS
// ===================================================================

function getLast7DaysStreak() {
  const state = getState();
  const today = new Date();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().split('T')[0];
    const dayLabel = ['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()];
    const trained = state.log.some(e => e.date === dateStr);
    const isToday = i === 0;
    days.push({ dateStr, dayLabel, trained, isToday });
  }
  return days;
}

function getWeeklyVolume(weeks) {
  const state = getState();
  const result = [];
  const today = new Date();
  for (let w = weeks - 1; w >= 0; w--) {
    const weekStart = new Date(today);
    weekStart.setDate(weekStart.getDate() - (w * 7 + today.getDay()));
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    const startStr = weekStart.toISOString().split('T')[0];
    const endStr = weekEnd.toISOString().split('T')[0];
    let sessions = 0;
    let totalSets = 0;
    state.log.forEach(entry => {
      if (entry.date >= startStr && entry.date <= endStr) {
        sessions++;
        if (entry.exercises) {
          Object.values(entry.exercises).forEach(sets => {
            totalSets += sets.filter(s => s > 0).length;
          });
        }
      }
    });
    result.push({ week: weeks - w, sessions, totalSets, startStr });
  }
  return result;
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  currentScreen = name;

  // Update nav
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => {
    if (b.textContent.trim().toLowerCase().includes(
      name === 'reference' ? 'exercises' : name
    )) b.classList.add('active');
  });

  // Render
  if (name === 'home') renderHome();
  if (name === 'history') renderHistory();
  if (name === 'progress') renderProgress();
  if (name === 'reference') renderReference();
  if (name === 'settings') renderSettings();
}

// HOME SCREEN
// ===================================================================

function renderHome() {
  const state = getState();
  const nextType = ROTATION[state.rotationIndex % 4];
  const template = SESSION_TEMPLATES[nextType];
  const streak = getLast7DaysStreak();
  const estimate = estimateSessionDuration(nextType);
  const gripColor = template.grip === 'high' ? 'var(--grip-high)' : template.grip === 'low' ? 'var(--grip-low)' : 'var(--grip-none)';

  // Pending promotions
  let promoHtml = '';
  const allExercises = getAllSessionExercises();
  allExercises.forEach(exId => {
    if (isReadyToPromote(exId)) {
      const ex = EXERCISE_LIBRARY[exId];
      const currentIdx = getCurrentVariation(exId);
      const nextVar = ex.ladder[currentIdx + 1];
      const currentVar = ex.ladder[currentIdx];
      promoHtml += `
        <div class="promo-card">
          <h3>&#9650; Ready to Promote</h3>
          <p>${ex.name}: ${currentVar} &#8594; ${nextVar}</p>
          <div class="promo-actions">
            <button class="btn btn-small btn-primary" onclick="handlePromote('${exId}')">Advance</button>
            <button class="btn btn-small btn-secondary" onclick="dismissPromo('${exId}')">Not Yet</button>
          </div>
        </div>`;
    }
  });

  const streakHtml = streak.map(d => {
    let cls = d.trained ? 'done' : 'empty';
    if (d.isToday) cls += ' today';
    return `<div class="streak-dot ${cls}">${d.dayLabel}</div>`;
  }).join('');

  const sessionsThisWeek = streak.filter(d => d.trained).length;

  document.getElementById('home-content').innerHTML = `
    ${promoHtml}
    <div class="card">
      <span class="badge badge-${nextType.toLowerCase()}">${nextType}</span>
      <span class="grip-dot" style="background:${gripColor}"></span>
      <span style="font-size:11px;color:var(--text3);margin-left:4px;">Grip: ${template.grip}</span>
      <div class="next-session-title">${template.name}</div>
      <div class="session-meta">~${estimate} min &middot; ${template.blocks.reduce((a,b) => a + b.exercises.length, 0)} exercises</div>
      <button class="btn btn-primary" onclick="startSession('${nextType}')">Start Session</button>
    </div>
    <div class="card">
      <div style="font-size:13px;color:var(--text2);margin-bottom:6px;">Last 7 days &middot; ${sessionsThisWeek} sessions</div>
      <div class="streak-row">${streakHtml}</div>
    </div>
    ${renderRotationLookahead(state.rotationIndex)}
    ${state.log.length > 0 ? renderLastSession(state) : ''}
    ${renderSessionPreview(nextType)}
  `;
}

function renderLastSession(state) {
  const last = state.log[state.log.length - 1];
  if (!last) return '';
  const hitCount = last.exercises ? Object.entries(last.exercises).filter(([id, reps]) => checkHit(id, reps)).length : 0;
  const totalEx = last.exercises ? Object.keys(last.exercises).length : 0;
  return `
    <div class="card">
      <div style="font-size:13px;color:var(--text2);">Last Session</div>
      <div style="font-size:15px;font-weight:600;margin:4px 0;">${SESSION_TEMPLATES[last.sessionType]?.name || last.sessionType}</div>
      <div style="font-size:12px;color:var(--text2);">${last.date} &middot; ${hitCount}/${totalEx} HITs${last.feel ? ' &middot; ' + last.feel : ''}</div>
    </div>`;
}

function renderSessionPreview(sessionType) {
  const template = SESSION_TEMPLATES[sessionType];
  let inner = '';
  template.blocks.forEach(block => {
    inner += `<div style="font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text3);margin:8px 0 3px;">${block.label}</div>`;
    block.exercises.forEach(exId => {
      const ex = EXERCISE_LIBRARY[exId];
      const isMob = ex.isMobility;
      const varName = isMob ? ex.name : getVariationName(exId);
      const detail = isMob ? '' : ` <span style="color:var(--text3);">${ex.repRange[0]}-${ex.repRange[1]} ${ex.unit} &times; ${ex.sets}</span>`;
      inner += `<div style="font-size:13px;padding:2px 0;">${varName}${detail}</div>`;
    });
  });
  return `<div class="card" style="padding:12px 16px;">
    <details>
      <summary style="font-size:13px;color:var(--text2);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;">
        Session Preview <span style="font-size:11px;color:var(--text3);">tap to expand</span>
      </summary>
      <div style="margin-top:8px;">${inner}</div>
    </details>
  </div>`;
}

function renderRotationLookahead(currentIndex) {
  let html = '<div class="card" style="padding:10px 16px;"><div style="display:flex;gap:8px;align-items:center;">';
  html += '<div style="font-size:11px;color:var(--text3);white-space:nowrap;">Up next</div>';
  for (let i = 1; i <= 3; i++) {
    const idx = (currentIndex + i) % 4;
    const type = ROTATION[idx];
    const t = SESSION_TEMPLATES[type];
    html += `<div style="flex:1;background:var(--surface2);border-radius:6px;padding:6px;text-align:center;">
      <span class="badge badge-${type.toLowerCase()}" style="font-size:9px;padding:2px 6px;">${type}</span>
      <div style="font-size:10px;color:var(--text3);margin-top:2px;">${t.name}</div>
    </div>`;
  }
  html += '</div></div>';
  return html;
}

function getAllSessionExercises() {
  const all = new Set();
  Object.values(SESSION_TEMPLATES).forEach(t => {
    t.blocks.forEach(b => b.exercises.forEach(e => {
      if (!EXERCISE_LIBRARY[e].isMobility) all.add(e);
    }));
  });
  return [...all];
}

function handlePromote(exId) {
  promoteExercise(exId);
  syncToSheet();
  renderHome();
}

function dismissPromo(exId) {
  const state = getState();
  state.promotions[exId] = { consecutiveHits: 0 };
  saveState(state);
  renderHome();
}

function startSession(type) {
  const template = SESSION_TEMPLATES[type];
  activeSession = {
    type,
    template,
    reps: {},
    skipped: {},
    feel: null,
    startTime: Date.now()
  };

  // Initialize reps storage
  template.blocks.forEach(block => {
    block.exercises.forEach(exId => {
      const ex = EXERCISE_LIBRARY[exId];
      activeSession.reps[exId] = new Array(ex.sets).fill(0);
    });
  });

  document.getElementById('session-title').textContent = template.name;
  const gripColor = template.grip === 'high' ? 'var(--grip-high)' : template.grip === 'low' ? 'var(--grip-low)' : 'var(--grip-none)';
  document.getElementById('session-grip').innerHTML = `<span class="grip-dot" style="background:${gripColor}"></span>`;

  // Reset feel buttons and notes
  document.querySelectorAll('.feel-btn').forEach(b => {
    b.style.borderColor = 'var(--border)';
    b.style.color = 'var(--text2)';
    b.style.background = 'var(--surface2)';
  });
  const notesEl = document.getElementById('session-notes');
  if (notesEl) notesEl.value = '';

  renderSessionContent();
  showScreen('session');
}

function setFeel(feel) {
  activeSession.feel = feel;
  document.querySelectorAll('.feel-btn').forEach(b => {
    const isActive = b.dataset.feel === feel;
    b.style.borderColor = isActive ? 'var(--accent)' : 'var(--border)';
    b.style.color = isActive ? 'var(--accent)' : 'var(--text2)';
    b.style.background = isActive ? 'var(--accent-dim)' : 'var(--surface2)';
  });
}

function renderSessionContent() {
  const { template } = activeSession;
  let html = '';

  template.blocks.forEach(block => {
    html += `<div class="block-label">${block.label}</div>`;

    block.exercises.forEach(exId => {
      const ex = EXERCISE_LIBRARY[exId];
      const varName = getVariationName(exId);
      const isMob = ex.isMobility;
      const reps = activeSession.reps[exId];
      const topRange = ex.repRange[1];
      const isSkipped = activeSession.skipped && activeSession.skipped[exId];

      let setsHtml = '';
      if (!isSkipped && (!isMob || ex.sets > 1)) {
        const setInputs = [];
        for (let s = 0; s < ex.sets; s++) {
          const val = reps[s] || '';
          const isHit = reps[s] >= topRange && reps[s] > 0;
          setInputs.push(`
            <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
              <div class="set-label">S${s+1}</div>
              <input type="number" inputmode="numeric" pattern="[0-9]*"
                class="set-input ${isHit ? 'hit' : ''}"
                value="${val || ''}"
                data-ex="${exId}" data-set="${s}"
                onfocus="this.select()"
                onchange="logRep(this)"
                onblur="logRep(this)">
            </div>`);
        }
        setsHtml = `
          <div class="sets-row">
            ${setInputs.join('')}
            <div class="target-label">${ex.repRange[0]}-${ex.repRange[1]} ${ex.unit}</div>
          </div>`;
      } else if (!isSkipped) {
        setsHtml = `<div style="font-size:12px;color:var(--text2);">${ex.repRange[0] === 1 && ex.unit === 'min' ? '2-3 min' : ex.repRange[0]+'-'+ex.repRange[1]+' '+ex.unit}</div>`;
      }

      const skipBtn = !isMob && !isSkipped ? `<button style="background:none;border:none;color:var(--text3);font-size:11px;padding:4px 0;cursor:pointer;font-family:var(--font);" onclick="skipExercise('${exId}')">Skip</button>` : '';
      const unskipBtn = isSkipped ? `<button style="background:none;border:none;color:var(--accent);font-size:11px;padding:4px 0;cursor:pointer;font-family:var(--font);" onclick="unskipExercise('${exId}')">Undo skip</button>` : '';

      html += `
        <div class="exercise-card" style="${isSkipped ? 'opacity:0.4;' : ''}">
          <div style="display:flex;justify-content:space-between;align-items:start;">
            <div>
              <div class="exercise-name">${isMob ? ex.name : varName}</div>
              ${!isMob ? `<div class="exercise-detail">${ex.name} progression</div>` : ''}
            </div>
            ${skipBtn}${unskipBtn}
          </div>
          ${isSkipped ? '<div style="font-size:12px;color:var(--text3);margin:4px 0;">Skipped</div>' : setsHtml}
          <div class="exercise-note">${ex.note}</div>
        </div>`;
    });
  });

  document.getElementById('session-content').innerHTML = html;
}

function skipExercise(exId) {
  if (!activeSession.skipped) activeSession.skipped = {};
  activeSession.skipped[exId] = true;
  activeSession.reps[exId] = activeSession.reps[exId].map(() => 0);
  renderSessionContent();
}

function unskipExercise(exId) {
  if (activeSession.skipped) delete activeSession.skipped[exId];
  renderSessionContent();
}

function logRep(input) {
  const exId = input.dataset.ex;
  const setIdx = parseInt(input.dataset.set);
  const val = parseInt(input.value) || 0;
  activeSession.reps[exId][setIdx] = val;

  // Update hit styling
  const ex = EXERCISE_LIBRARY[exId];
  const topRange = ex.repRange[1];
  input.classList.toggle('hit', val >= topRange && val > 0);

  // Start rest timer
  const block = activeSession.template.blocks.find(b => b.exercises.includes(exId));
  if (block && val > 0) {
    startRestTimer(REST_TIMES[block.type], block.label);
  }
}

// ===================================================================
// REST TIMER
// ===================================================================

function startRestTimer(seconds, label) {
  clearInterval(timerInterval);
  const timerEl = document.getElementById('rest-timer');
  const timeEl = document.getElementById('rest-time');
  const labelEl = document.getElementById('rest-label');
  timerEl.classList.add('visible');
  labelEl.textContent = label + ' rest';
  timeEl.classList.remove('done');

  let remaining = seconds;
  updateTimerDisplay(remaining, timeEl);

  timerInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timeEl.textContent = 'GO';
      timeEl.classList.add('done');
      if (navigator.vibrate) navigator.vibrate(200);
      setTimeout(() => { timerEl.classList.remove('visible'); }, 3000);
    } else {
      updateTimerDisplay(remaining, timeEl);
    }
  }, 1000);
}

function updateTimerDisplay(seconds, el) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  el.textContent = m + ':' + String(s).padStart(2, '0');
}

function dismissTimer() {
  clearInterval(timerInterval);
  document.getElementById('rest-timer').classList.remove('visible');
}

// ===================================================================
// COMPLETE SESSION
// ===================================================================

function completeSession() {
  if (!activeSession) return;
  const state = getState();
  const today = new Date().toISOString().split('T')[0];

  // Build exercise data (non-mobility only, non-skipped)
  const exercises = {};
  const skipped = [];
  Object.entries(activeSession.reps).forEach(([exId, reps]) => {
    if (!EXERCISE_LIBRARY[exId].isMobility) {
      if (activeSession.skipped && activeSession.skipped[exId]) {
        skipped.push(exId);
      } else {
        exercises[exId] = reps;
      }
    }
  });

  // Capture notes and feel
  const notesEl = document.getElementById('session-notes');
  const notes = notesEl ? notesEl.value.trim() : '';
  const feel = activeSession.feel || null;

  // Log entry
  const entry = {
    date: today,
    sessionType: activeSession.type,
    exercises,
    skipped: skipped.length > 0 ? skipped : undefined,
    feel,
    notes: notes || undefined,
    duration: Math.round((Date.now() - activeSession.startTime) / 60000)
  };
  state.log.push(entry);

  // Update promotion tracking (only for non-skipped)
  Object.entries(exercises).forEach(([exId, reps]) => {
    const hit = checkHit(exId, reps);
    updatePromotionTracking(exId, hit);
  });

  // Advance rotation
  state.rotationIndex = (state.rotationIndex + 1) % 4;
  saveState(state);

  // Auto-sync to Google Sheet
  syncToSheet();

  activeSession = null;
  dismissTimer();
  showScreen('home');
}

function confirmExitSession() {
  showModal(
    'Exit Session?',
    'Your progress for this session won\'t be saved.',
    [
      { text: 'Cancel', cls: 'btn-secondary', action: () => hideModal() },
      { text: 'Exit', cls: 'btn-danger', action: () => { activeSession = null; dismissTimer(); hideModal(); showScreen('home'); } }
    ]
  );
}

function renderHistory() {
  const state = getState();
  if (state.log.length === 0) {
    document.getElementById('history-content').innerHTML = `
      <div class="empty"><div class="empty-icon">&#128203;</div>No sessions yet.<br>Complete your first session to see history.</div>`;
    return;
  }

  const html = [...state.log].reverse().map((entry, i) => {
    const idx = state.log.length - 1 - i;
    const template = SESSION_TEMPLATES[entry.sessionType];
    const hitCount = entry.exercises ? Object.entries(entry.exercises).filter(([id, reps]) => checkHit(id, reps)).length : 0;
    const totalEx = entry.exercises ? Object.keys(entry.exercises).length : 0;

    let detailHtml = '';
    if (entry.exercises) {
      Object.entries(entry.exercises).forEach(([exId, reps]) => {
        const ex = EXERCISE_LIBRARY[exId];
        const hit = checkHit(exId, reps);
        detailHtml += `<div class="history-exercise">
          ${hit ? '&#9632;' : '&#9633;'} ${ex ? ex.name : exId}: <span>${reps.join(', ')}</span>
        </div>`;
      });
    }
    if (entry.skipped && entry.skipped.length > 0) {
      entry.skipped.forEach(exId => {
        const ex = EXERCISE_LIBRARY[exId];
        detailHtml += `<div class="history-exercise" style="color:var(--text3);">&#8212; ${ex ? ex.name : exId}: <span>skipped</span></div>`;
      });
    }
    if (entry.notes) {
      detailHtml += `<div style="font-size:12px;color:var(--text2);margin-top:8px;font-style:italic;">"${entry.notes}"</div>`;
    }

    const feelLabel = entry.feel ? ` &middot; ${entry.feel}` : '';

    return `
      <div class="history-item" onclick="this.classList.toggle('expanded')">
        <div class="history-date">${formatDate(entry.date)}${entry.duration ? ' &middot; ' + entry.duration + ' min' : ''}${feelLabel}</div>
        <div class="history-type">
          <span class="badge badge-${entry.sessionType.toLowerCase()}">${entry.sessionType}</span>
          ${template ? template.name : ''}
        </div>
        <div class="history-hits">${hitCount}/${totalEx} HITs${entry.skipped && entry.skipped.length > 0 ? ' &middot; ' + entry.skipped.length + ' skipped' : ''}</div>
        <div class="history-detail">${detailHtml}</div>
      </div>`;
  }).join('');

  document.getElementById('history-content').innerHTML = html;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;
}

function renderProgress() {
  const state = getState();
  const weeklyData = getWeeklyVolume(8);
  const totalSessions = state.log.length;
  const totalPromotions = state.promotionLog ? state.promotionLog.length : 0;

  // Stats
  const last4 = weeklyData.slice(-4);
  const avgSessions = last4.length > 0 ? (last4.reduce((a,b) => a + b.sessions, 0) / last4.length).toFixed(1) : '0';

  // Calculate total HITs
  let totalHits = 0;
  state.log.forEach(entry => {
    if (entry.exercises) {
      Object.entries(entry.exercises).forEach(([id, reps]) => {
        if (checkHit(id, reps)) totalHits++;
      });
    }

  // Sessions bar chart
  const maxSessions = Math.max(...weeklyData.map(w => w.sessions), 4);
  const barsHtml = weeklyData.map(w => {

  }

  document.getElementById('progress-content').innerHTML = `
    <div class="stat-grid">

        <div class="stat-num">${totalSessions}</div>
        <div class="stat-label">Total Sessions</div>

      </div>

        <div class="stat-num">${totalPromotions}</div>
        <div class="stat-label">Promotions</div>

    <div class="progress-section" style="margin-top:20px;">

function copySyncScript() {
  const script = `function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var payload = JSON.parse(e.postData.contents);

  // --- Sync tab: store full JSON state for restore ---
  var syncSheet = ss.getSheetByName('Sync');
  if (!syncSheet) syncSheet = ss.insertSheet('Sync');
  syncSheet.getRange('A1').setValue(JSON.stringify(payload.state));
  syncSheet.getRange('A2').setValue(new Date().toISOString());

  // --- Log tab: write human-readable rows ---
  var logSheet = ss.getSheetByName('Log');
  if (!logSheet) {
    logSheet = ss.insertSheet('Log');
    logSheet.appendRow(['Date','Session','Exercise','Variation','S1','S2','S3','HIT','Duration (min)','Feel','Notes']);
    logSheet.getRange('1:1').setFontWeight('bold');
    logSheet.setFrozenRows(1);
  }

  // Clear and rewrite all log rows (simple, no drift)
  var lastRow = logSheet.getLastRow();
  if (lastRow > 1) logSheet.getRange(2, 1, lastRow - 1, 11).clearContent();

  var rows = payload.logRows || [];
  if (rows.length > 0) {
    var data = rows.map(function(r) {
      var sets = r.sets || [];
      return [
        r.date,
        r.session,
        r.exercise,
        r.variation,
        sets[0] || '',
        sets[1] || '',
        sets[2] || '',
        r.hit ? 'HIT' : '',
        r.duration || '',
        r.feel || '',
        r.notes || ''
      ];
    });
    logSheet.getRange(2, 1, data.length, 11).setValues(data);
  }

  return ContentService.createTextOutput(JSON.stringify({status:'ok'}))
    .setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  var action = (e && e.parameter && e.parameter.action) || 'pull';
  if (action === 'ping') {
    return ContentService.createTextOutput(JSON.stringify({status:'ok',pong:true}))
      .setMimeType(ContentService.MimeType.JSON);
  }
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Sync');
  if (!sheet) {
    return ContentService.createTextOutput(JSON.stringify({status:'empty'}))
      .setMimeType(ContentService.MimeType.JSON);
  }
  var data = sheet.getRange('A1').getValue();
  if (!data) {
    return ContentService.createTextOutput(JSON.stringify({status:'empty'}))
      .setMimeType(ContentService.MimeType.JSON);
  }
  return ContentService.createTextOutput(data)
    .setMimeType(ContentService.MimeType.JSON);
}`;
  navigator.clipboard.writeText(script).then(() => {
    alert('Script copied! Paste it into the Apps Script editor.');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = script;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Script copied! Paste it into the Apps Script editor.');
  });
}

function exportData() {
  const state = getState();
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `train-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.log && Array.isArray(data.log)) {
        showModal('Import Data?', `This will replace your current data with ${data.log.length} sessions from the backup.`, [
          { text: 'Cancel', cls: 'btn-secondary', action: () => hideModal() },
          { text: 'Import', cls: 'btn-primary', action: () => { saveState(data); hideModal(); renderSettings(); showScreen('home'); } }
        ]);
      } else {
        alert('Invalid backup file.');
      }
    } catch(e) { alert('Could not read file.'); }
  };
  reader.readAsText(file);
}

function resetRotation() {
  const state = getState();
  state.rotationIndex = 0;
  saveState(state);
  renderSettings();
}

function confirmErase() {
  showModal('Erase All Data?', 'This will permanently delete all sessions, promotions, and progression. This cannot be undone.', [
    { text: 'Cancel', cls: 'btn-secondary', action: () => hideModal() },
    { text: 'Erase Everything', cls: 'btn-danger', action: () => {
      localStorage.removeItem('train_state');
      hideModal();
      showScreen('home');
    }}
  ]);
}

// ===================================================================
// MODAL
// ===================================================================

function showModal(title, body, buttons) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent = body;
  document.getElementById('modal-actions').innerHTML = buttons.map(b =>
    `<button class="btn ${b.cls}" id="modal-btn-${b.text.replace(/\s/g,'')}">${b.text}</button>`
  ).join('');
  buttons.forEach(b => {
    document.getElementById('modal-btn-' + b.text.replace(/\s/g,'')).onclick = b.action;
  });
  document.getElementById('modal').classList.add('visible');
}

function hideModal() {
  document.getElementById('modal').classList.remove('visible');
}

// ===================================================================
// INIT
// ===================================================================

document.addEventListener('DOMContentLoaded', async () => {
  // Try to restore from Google Sheet if local data is empty
  const local = loadState();
  if (getSyncUrl()) {
    if (!local || local.log.length === 0) {
      const restored = await pullFromSheet();
      if (restored) {
        console.log('Data restored from Google Sheet');
      }
    } else {
      updateSyncIndicator('synced');
    }
  }
  renderHome();
});

// Prevent pull-to-refresh
document.body.addEventListener('touchmove', function(e) {
  if (e.target.closest('.scroll')) return;
  e.preventDefault();
}, { passive: false });
</script>
