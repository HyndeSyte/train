<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Train</title>
<link rel="stylesheet" href="style.css?v=7.4.0">
</head>
<body>

<!-- ==================== HOME ==================== -->
<div id="screen-home" class="screen active">
  <div class="home-top">
    <span class="home-brand">Train</span>
    <span id="sync-indicator" class="sync-status"></span>
  </div>
  <div class="scroll"><div id="home-content"></div></div>
  <nav class="nav">
    <button class="nav-btn active" onclick="showScreen('home')"><span class="nav-icon">&#9679;</span>Today</button>
    <button class="nav-btn" onclick="showScreen('history')"><span class="nav-icon">&#9776;</span>History</button>
    <button class="nav-btn" onclick="showScreen('reference')"><span class="nav-icon">&#9733;</span>Exercises</button>
    <button class="nav-btn" onclick="showScreen('settings')"><span class="nav-icon">&#9881;</span>Settings</button>
  </nav>
</div>

<!-- ==================== SESSION (guided flow) ==================== -->
<div id="screen-session" class="screen">
  <div class="header">
    <button class="header-btn" onclick="confirmStopSession()">&#10005; Stop</button>
    <h1 id="session-title" onclick="showSessionMap()"></h1>
    <div id="session-grip"></div>
  </div>
  <div class="flow-wrap">
    <div class="flow-progress" id="flow-progress"></div>
    <div class="flow-body" id="flow-body"></div>
    <div class="flow-foot" id="flow-foot"></div>
  </div>
</div>

<!-- ==================== PT'S LIST (v7.3 recovery layer; outside the session slot) ==================== -->
<div id="screen-pt" class="screen">
  <div class="header">
    <button class="header-btn" onclick="closePtSession()">&#10005; Close</button>
    <h1>PT&rsquo;s list</h1>
    <div></div>
  </div>
  <div class="scroll" id="pt-content"></div>
</div>

<!-- ==================== HISTORY ==================== -->
<div id="screen-history" class="screen">
  <div class="header"><h1>History</h1></div>
  <div class="scroll" id="history-content"></div>
  <nav class="nav">
    <button class="nav-btn" onclick="showScreen('home')"><span class="nav-icon">&#9679;</span>Today</button>
    <button class="nav-btn active" onclick="showScreen('history')"><span class="nav-icon">&#9776;</span>History</button>
    <button class="nav-btn" onclick="showScreen('reference')"><span class="nav-icon">&#9733;</span>Exercises</button>
    <button class="nav-btn" onclick="showScreen('settings')"><span class="nav-icon">&#9881;</span>Settings</button>
  </nav>
</div>

<!-- ==================== REFERENCE ==================== -->
<div id="screen-reference" class="screen">
  <div class="header"><h1>Exercises</h1></div>
  <div class="scroll" id="reference-content"></div>
  <nav class="nav">
    <button class="nav-btn" onclick="showScreen('home')"><span class="nav-icon">&#9679;</span>Today</button>
    <button class="nav-btn" onclick="showScreen('history')"><span class="nav-icon">&#9776;</span>History</button>
    <button class="nav-btn active" onclick="showScreen('reference')"><span class="nav-icon">&#9733;</span>Exercises</button>
    <button class="nav-btn" onclick="showScreen('settings')"><span class="nav-icon">&#9881;</span>Settings</button>
  </nav>
</div>

<!-- ==================== SETTINGS ==================== -->
<div id="screen-settings" class="screen">
  <div class="header"><h1>Settings</h1></div>

  <nav class="nav">
    <button class="nav-btn" onclick="showScreen('home')"><span class="nav-icon">&#9679;</span>Today</button>

    <h3 id="modal-title"></h3>

    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<!-- data.js defines window.EXERCISE_LIBRARY, window.FORM, window.SESSION_TEMPLATES (+ v7.3 RECOVERY_TEMPLATES, PT_LIST); it MUST load before the inline app script below. Keep both classic (no defer/async/module). -->
<script src="data.js?v=8.0.0"></script>
<script>
"use strict";
// ===================================================================
// SCHEMA VERSION
// ===================================================================
const SCHEMA_VERSION = 9;
const BUILD_ID = 'v8.0.0-2026-10-26-abc';  // bump on every deploy; surfaced in Settings to expose a stale cached shell

// ===================================================================
// DATA BOOTSTRAP - EXERCISE_LIBRARY, FORM, SESSION_TEMPLATES come from data.js,
// which loads before this script. Fail visibly if it did not load.
// ===================================================================
if (!window.EXERCISE_LIBRARY || !window.FORM || !window.FORM.screens || !window.SESSION_TEMPLATES) {
  document.body.innerHTML = '<div style="max-width:32rem;margin:4rem auto;padding:1.5rem;font:16px/1.5 -apple-system,system-ui,sans-serif;color:#222;text-align:center;"><h1 style="font-size:1.25rem;margin:0 0 .5rem;">Train failed to load</h1><p style="margin:0;">Required app data did not load. Refresh and try again.</p></div>';
  throw new Error('Train: data.js failed to load (EXERCISE_LIBRARY/FORM/SESSION_TEMPLATES missing)');
}
const EXERCISE_LIBRARY = window.EXERCISE_LIBRARY;
const FORM = window.FORM;
const SESSION_TEMPLATES = window.SESSION_TEMPLATES;
// v7.3 recovery layer data (optional: without it the app simply runs in normal mode).
const RECOVERY_TEMPLATES = window.RECOVERY_TEMPLATES || {};
const PT_LIST = (window.PT_LIST && Array.isArray(window.PT_LIST.items)) ? window.PT_LIST : null;
const RING_DAYS = ['RP','RPush','RPr'];   // v7 legacy ring days end at a symptom stop; v8 A/B/C finish the legs
const OPENER = window.OPENER || null;   // v8 fixed opener for A/B/C

const ROTATION = ['A','B','C'];   // v8 (2026-10-26); RP..RPr stay defined as legacy for history
const REST_TIMES = { form:0, anchor:150, builder:75, finisher:45, power:45 };
const FORM_REST = 0; // Form screens are advance-only, no rest timer

function isDurationUnit(unit){ return unit === 'sec'; }
// '6–10', or a single number when the range is one value (power: 3 reps).
function repSpan(ex){ return ex.repRange[0] === ex.repRange[1] ? String(ex.repRange[0]) : `${ex.repRange[0]}–${ex.repRange[1]}`; }

// ===================================================================
// STATE
// ===================================================================
function loadRaw(){ try { const r = localStorage.getItem('train_state'); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function saveState(s){ try { localStorage.setItem('train_state', JSON.stringify(s)); } catch(e){ console.error('save failed', e); } }

function migrate(state){
  if(!state) return null;
  // Bring any older state up to current schema without losing history.
  if(!state.schemaVersion || state.schemaVersion < 4){
    state.schemaVersion = 4;
  }
  if(!state.log) state.log = [];
  if(!('activeSession' in state)) state.activeSession = null;
  // v4 ring-spine rotation: drop any in-progress session keyed to a retired session type
  // (old U1/L1/U2/L2). Its templates no longer exist, so resuming would throw. History is untouched.
  if(state.activeSession && !SESSION_TEMPLATES[state.activeSession.type]) state.activeSession = null;
  // v7.2 one-screen kata: remap an in-flight session built on the 7-screen Form flow
  // (7 form items collapsed to 1 -> indexes shift by 6; mid-Form restarts the kata).
  {
    const as = state.activeSession;
    if(as && (as.schemaVersion || 0) < 8){
      const t = SESSION_TEMPLATES[as.type];
      if(t && !t.noForm){
        as.cursor = (as.cursor <= 6) ? 0 : as.cursor - 6;
        if(!as.records) as.records = {};
        if(!as.records['form-all']) as.records['form-all'] = { kind:'form', status:'pending' };
      }
      as.schemaVersion = 8;
    }
  }
  // clamp a stale rotationIndex into the new rotation length; a missing or non-numeric one
  // (hand-edited or partial import) starts the rotation over instead of breaking Home/finalize
  if(typeof state.rotationIndex !== 'number' || !isFinite(state.rotationIndex)) state.rotationIndex = 0;
  state.rotationIndex = ((Math.trunc(state.rotationIndex) % ROTATION.length) + ROTATION.length) % ROTATION.length;

  // Session-picker override (Option A): validate against SESSION_TEMPLATES. The picker
  // only ever stores a valid template key; this is the defensive seam against stale
  // storage, schema drift, or hand-edited state. Missing field is initialized to null.
  if(!Object.prototype.hasOwnProperty.call(state, 'nextSessionOverride')) state.nextSessionOverride = null;
  if(state.nextSessionOverride != null && !SESSION_TEMPLATES[state.nextSessionOverride]) state.nextSessionOverride = null;

  // ---- v5 INFRASTRUCTURE (Chunk 2, commit 1) ----
  // Schema/infrastructure only: introduce the total-quality-reps progression scaffolding
  // WITHOUT changing any scoring behavior yet. The legacy HIT fields (promotions,
  // exerciseVariations, promotionLog) deliberately remain top-level and live — they are
  // quarantined later, in the same commit that cuts over their readers, so there is never
  // a half-migrated state with deleted fields and live readers.
  if(!state.progressionEngineVersion || state.progressionEngineVersion < 2){
    // one-time raw backup before the v5 line of work begins (best-effort; never block migration)
    try {
      if(!localStorage.getItem('train_state_backup_pre_v2')){
        localStorage.setItem('train_state_backup_pre_v2', JSON.stringify(state));
      }
    } catch(e){ /* storage unavailable; proceed without backup */ }
    state.progressionEngineVersion = 2;
    state.schemaVersion = 5;  // v5 step only brings state to 5; the v6 backfill below must still run
  }
  if(!state.anchorProgress) state.anchorProgress = {};

  // ---- v5 LEGACY QUARANTINE (Chunk 2, commit 3) ----
  // The old binary HIT/ladder fields are moved under state.legacy and removed from the top
  // level, in the SAME commit that cuts over every reader to the new engine. Any reader that
  // still reaches for a top-level promotion field will now throw loudly (caught and surfaced)
  // instead of silently rendering stale/contradictory progression. One-way; idempotent.
  if(state.promotions !== undefined || state.exerciseVariations !== undefined || state.promotionLog !== undefined){
    state.legacy = state.legacy || {};
    if(state.promotions !== undefined){ state.legacy.promotions = state.promotions; delete state.promotions; }
    if(state.exerciseVariations !== undefined){ state.legacy.exerciseVariations = state.exerciseVariations; delete state.exerciseVariations; }
    if(state.promotionLog !== undefined){ state.legacy.promotionLog = state.promotionLog; delete state.promotionLog; }
  }
  if(!state.legacy) state.legacy = { promotions:{}, exerciseVariations:{}, promotionLog:[] };
  if(!state.legacy.exerciseVariations) state.legacy.exerciseVariations = {};

  // ---- v6 NOTION SYNC INFRASTRUCTURE ----
  // Transport-only fields for the PWA -> Notion mirror. The scoring engine NEVER reads
  // notionSync; it is sync bookkeeping, kept parallel to (not inside) the progression data.
  // localStorage remains the source of truth; Notion is a derived, self-healing mirror.
  if(typeof state.nextSessionSequence !== 'number') state.nextSessionSequence = 0;
  if(!Array.isArray(state.pendingDeletes)) state.pendingDeletes = [];
  // Self-healing backfill: ANY log entry missing transport fields gets them, on EVERY load,
  // regardless of schemaVersion. Repairs states that reached v6 before this assignment ran
  // (e.g. an older state whose v5 step had jumped schemaVersion past the gate). Idempotent:
  // only fills missing fields; the server upsert dedupes by sessionId.
  {
    const _log = state.log || [];
    let _maxSeq = -1;
    _log.forEach((e)=>{ if(typeof e.sessionSequence === 'number' && e.sessionSequence > _maxSeq) _maxSeq = e.sessionSequence; });
    if(state.nextSessionSequence <= _maxSeq) state.nextSessionSequence = _maxSeq + 1;
    _log.forEach((entry)=>{
      if(!entry.sessionId) entry.sessionId = genSessionId();
      if(typeof entry.sessionSequence !== 'number') entry.sessionSequence = state.nextSessionSequence++;
      if(!entry.notionSync) entry.notionSync = { status:'pending', lastAttemptAt:null, syncedAt:null, notionPageId:null, error:null };
    });
  }
  if(state.schemaVersion < 6) state.schemaVersion = 6;

  // ---- v7 ELASTIC SESSIONS (2026-08-16) ----
  // Backfill entry.coreComplete for history (null when the template is retired/unknown or
  // the entry predates performed[]), then re-run the scoreboard replay ONCE under the v3
  // gate: logged quality anchor work scores regardless of session end-state. This is the
  // migration that admits the 2026-07-02 stopped RPush (8/8/8/8 = 32 = owned top):
  // RPush steps to +5 lb and re-baselines — an EXPECTED, test-fixtured outcome.
  (state.log || []).forEach((e)=>{ if(e && !('coreComplete' in e)) e.coreComplete = entryCoreComplete(e); });
  if(state.progressionEngineVersion < 3){
    state.progressionEngineVersion = 3;
    rebuildAnchorProgress(state);
  }
  if(state.schemaVersion < 7) state.schemaVersion = 7;

  // ---- v7.3 RECOVERY LAYER (2026-10-15) ----
  // Recovery mode is a switch inside Train: same rotation and log, reduced-load swaps, PT's
  // list as its own daily session. It starts ON for an install that predates it (its one
  // user is in PT); turning it off is a deliberate Settings action after PT clears him. A
  // brand-new install (getState) starts in normal mode. Idempotent: fills missing fields only.
  if(!state.recovery || typeof state.recovery !== 'object'){
    state.recovery = { on:true, cardioClear:false, since:null, offAt:null };
  }
  if(!('armCheck' in state)) state.armCheck = null;
  // Freeze the exercise list of an in-flight session started before v7.3 (normal mode), so a
  // later mode switch or template change can never re-shape a session in progress or parked.
  {
    const as = state.activeSession;
    if(as && !Array.isArray(as.flow)){
      // Raw template on purpose: the frozen list must index exactly like the records and
      // cursor it was built with. Anything newly parked is passed over at render time.
      as.mode = 'normal';
      as.flow = buildFlowFrom(as.type, SESSION_TEMPLATES[as.type]);
      as.tpl = tplSnapshot(SESSION_TEMPLATES[as.type]);
    }
  }
  // ---- v8 A/B/C (schema 9, 2026-10-26) ----
  // One time: keep a raw copy, start the new rotation at A, and drop a picked override
  // that names a retired v7 key. Old keys stay defined (legacy) so history and a parked
  // v7 session still resolve; they are never offered again.
  if(state.schemaVersion < 9){
    try {
      if(!localStorage.getItem('train_state_backup_pre_v9')) localStorage.setItem('train_state_backup_pre_v9', JSON.stringify(state));
    } catch(e){ /* storage unavailable; proceed without backup */ }
    state.rotationIndex = 0;
    state.schemaVersion = 9;
  }
  if(state.nextSessionOverride != null && !isValidSessionType(state.nextSessionOverride)) state.nextSessionOverride = null;
  if(!Array.isArray(state.markers)) state.markers = [];
  return state;
}

// ===================================================================
// CORE GATE (v7 elastic sessions)
// ===================================================================
// Gate slots for a session type: every exercise in a gate:true block, addressed by the
// same slotId vocabulary buildFlow/performed[] use. Null when the template is unknown
// (retired types) or defines no gate.
function templateGateSlots(sessionType){
  const t = SESSION_TEMPLATES[sessionType]; if(!t) return null;
  const slots = [];
  t.blocks.forEach(b=>{ if(b.gate) b.exercises.forEach(exId=> slots.push({ slotId: sessionType+'_'+b.type+'_'+exId, exId })); });
  return slots.length ? slots : null;
}
// Core gate for a LOG ENTRY (historical or fresh): every gate exercise has all sets
// logged with reps > 0 in performed[] — the same completeness predicate the scoring
// engine uses. Returns null (unknown, not false) for pre-engine or retired-type entries.
function entryCoreComplete(entry){
  const slots = entry && templateGateSlots(entry.sessionType);
  if(!slots || !Array.isArray(entry.performed)) return null;
  return slots.every(g=>{
    const p = entry.performed.find(x=> x.slotId === g.slotId && !x.skipped);
    if(!p) return false;
    const ex = EXERCISE_LIBRARY[g.exId]; if(!ex) return false;
    const done = (p.reps || []).filter(r=> typeof r === 'number' && r > 0);
    return done.length >= (p.targetSets || ex.sets);
  });
}

// Stable per-session id. crypto.randomUUID where available; otherwise a sufficient fallback
// (ids only need to be unique within one user's log to drive idempotent upserts).
function genSessionId(){
  try { if(typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return 'sid-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

// The two heavy-anchor slot identities (must match buildFlow's slotId derivation:
// `${type}_${blockType}_${exId}`). Used by the scoring engine in a later commit; defined
// here so the slot vocabulary lives in one place. Not read by any display yet.
const HEAVY_ANCHOR_SLOTS = {
  'A_anchor_ring-pullup': { exId:'ring-pullup', label:'Heavy Pull', sets:2 },
  'C_anchor_ring-pushup': { exId:'ring-pushup', label:'Heavy Push', sets:2 },
  // v7 slots: kept so old history replays exactly as before; never shown on Home.
  'RP_anchor_ring-pullup': { exId:'ring-pullup', label:'Heavy Pull (v7)', legacy:true },
  'RPush_anchor_ring-pushup': { exId:'ring-pushup', label:'Heavy Push (v7)', legacy:true }
};

// ===================================================================
// RECOVERY LAYER (v7.3, 2026-10-15)
// ===================================================================
// A switch, not a second app: same rotation, same log, same core gate. In recovery mode the
// ring-spine sessions use RECOVERY_TEMPLATES, PT's list runs as its own daily session
// (outside the active-session slot), a one-tap arm check opens each day's first session,
// and the heavy-anchor scoreboard is hidden. Every recovery log entry carries mode:
// 'recovery'; the scoring engine treats those entries as "anchors back to bodyweight", so
// the reset survives any history replay (see applyAnchorProgressionV2).
function isRecoveryOn(s){ return !!(s && s.recovery && s.recovery.on); }
function cardioCleared(s){ return !!(s && s.recovery && s.recovery.cardioClear); }
// Gate 4 belongs to cardiology, not to the mode: once recovery mode has been on, the effort
// cap (two reps short of failure, no sprints, hill repeats or jump rope, the warning signs)
// holds in EITHER mode until cardiology clears hard efforts. A fresh install never had it.
function cardioCapOn(s){ return !!(s && s.recovery && !s.recovery.cardioClear && (s.recovery.on || s.recovery.offAt)); }
const CARDIO_EXERCISES = ['jump-rope','squat-jump','broad-jump','hill-repeats'];   // conditioning that waits for cardiology (hill sprints ride on its cue)
function sessionModeFor(s, type){ return (isRecoveryOn(s) && RECOVERY_TEMPLATES[type]) ? 'recovery' : 'normal'; }
// Template for a session type in a mode. Recovery blocks flagged requiresCardioClear (jump
// rope) appear only once cardiology has cleared hard efforts (Gate 4).
function templateFor(type, mode, s){
  const st = s || getState();
  const cap = cardioCapOn(st);
  if(mode === 'recovery' && RECOVERY_TEMPLATES[type]){
    const rt = RECOVERY_TEMPLATES[type];
    return Object.assign({}, rt, { blocks: rt.blocks.filter(b=> !b.requiresCardioClear || !cap) });
  }
  const t = SESSION_TEMPLATES[type];
  if(!t || !cap) return t;
  // Normal mode under the cardiology cap: conditioning comes out until it clears.
  const blocks = t.blocks.map(b=> Object.assign({}, b, { exercises: b.exercises.filter(id=> CARDIO_EXERCISES.indexOf(id) === -1) }))
    .filter(b=> b.exercises.length);
  return Object.assign({}, t, { blocks });
}
// The template facts a running session needs, frozen into activeSession at start.
function tplSnapshot(t){
  t = t || {};
  return { name: t.name || '', fullName: t.fullName || '', grip: t.grip || 'none', noForm: !!t.noForm, opener: !!t.opener,
    activation: t.activation ? JSON.parse(JSON.stringify(t.activation)) : null };
}
// Local calendar day (the arm check and "PT's list done today" follow the user's day).
function localDay(ts){
  const d = (ts == null) ? new Date() : new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
// Display name for any log entry (rotation, recovery or PT).
function entryName(entry){
  if(!entry) return '';
  if(entry.sessionType === 'PT') return PT_LIST ? PT_LIST.name : 'PT’s list';
  if(entry.sessionType === 'EN') return 'Engine';
  if(entry.mode === 'recovery' && RECOVERY_TEMPLATES[entry.sessionType]) return RECOVERY_TEMPLATES[entry.sessionType].name;
  const t = SESSION_TEMPLATES[entry.sessionType];
  return t ? t.name : entry.sessionType;
}

// ---- DAILY ARM CHECK: one tap at the first session of each day (ring or PT). ----
// Stored as state.armCheck = { date: <local day>, value: 'better'|'same'|'worse'|null }.
// Skip is a real answer (null): it is not asked again that day.
const ARM_CHECK_VALUES = ['better','same','worse'];
function needsArmCheck(s){ return !(s && s.armCheck && s.armCheck.date === localDay()); }
function todayArmCheck(s){ return (s && s.armCheck && s.armCheck.date === localDay()) ? (s.armCheck.value || null) : null; }
function recordArmCheck(value){
  const s = getState();
  s.armCheck = { date: localDay(), value: ARM_CHECK_VALUES.indexOf(value) !== -1 ? value : null };
  saveState(s);
}
// `then` receives the tapped value (null for Skip), so a failed storage write can never
// loop the question or lose the answer.
function askArmCheck(then){
  const pick = (v)=>()=>{ recordArmCheck(v); hideModal(); then(v); };
  showModal('Arm check', 'Since your last session, your arms are:', [
    { text:'Better', cls:'btn-secondary', action: pick('better') },
    { text:'Same',   cls:'btn-secondary', action: pick('same') },
    { text:'Worse',  cls:'btn-secondary', action: pick('worse') },
    { text:'Skip',   cls:'btn-secondary', action: pick(null) }
  ], { stack:true });
}

// The most recent logged performance of an exercise: reps done and whether it ended at a
// symptom stop. Drives the recovery station's "Last time" and "one rung easier" lines.
function lastPerformance(s, exId){
  const log = (s && s.log) || [];
  for(let i = log.length - 1; i >= 0; i--){
    const e = log[i];
    if(!e || !Array.isArray(e.performed)) continue;
    const p = e.performed.find(x=> x.exId === exId);
    if(p) return { reps: p.skipped ? [] : (p.reps || []).filter(r=> typeof r === 'number' && r > 0), symptomStop: !!p.symptomStop, date: e.date };
  }
  return null;
}

function getState(){
  let s = migrate(loadRaw());
  if(!s){
    s = { schemaVersion:SCHEMA_VERSION, progressionEngineVersion:2, rotationIndex:0, nextSessionOverride:null, nextSessionSequence:0, pendingDeletes:[], log:[], anchorProgress:{}, legacy:{ promotions:{}, exerciseVariations:{}, promotionLog:[] }, activeSession:null, recovery:{ on:false, cardioClear:false, since:null, offAt:null }, armCheck:null };
    saveState(s);
  }
  return s;
}

// ===================================================================
// SESSION-PICKER OVERRIDE (added 2026-05-30; spec locked Option A)
// ===================================================================
// Behavior contract (do not change without re-running the 8 acceptance tests):
//   - state.nextSessionOverride: SESSION_TEMPLATES key, or null.
//   - Home + Start ALWAYS resolve via getEffectiveSessionType() - never duplicate
//     (override || ROTATION[index]) logic in callers.
//   - On COMPLETED (finalize statusReason==='completed'): rotation advances from
//     the LOGGED sessionType (entry.sessionType), not from the override field
//     and not from rotationIndex+1. The log is source of truth. Override clears.
//   - On STOPPED ('Save partial'): rotation UNCHANGED. Override clears.
//   - On DISCARD: nothing changes. Override PERSISTS (discard = 'didn't happen').
//   - HISTORY DELETE: rebuildAnchorProgress is scoreboard replay only. It never
//     touches rotationIndex or nextSessionOverride. (No edit to that function
//     in this commit - its behavior is correct as-is.)

// v8: only the live rotation and the Floor can be picked or stored as an override.
function isValidSessionType(t){
  return typeof t === 'string' && (ROTATION.indexOf(t) !== -1 || t === 'MVS') && Object.prototype.hasOwnProperty.call(SESSION_TEMPLATES, t);
}
function getDefaultSessionType(s){ return ROTATION[s.rotationIndex % ROTATION.length]; }
function getEffectiveSessionType(s){
  return isValidSessionType(s.nextSessionOverride) ? s.nextSessionOverride : getDefaultSessionType(s);
}
function hasSessionOverride(s){ return isValidSessionType(s.nextSessionOverride); }
function setSessionOverride(type){
  if(!isValidSessionType(type)) return;
  const s = getState();
  s.nextSessionOverride = type;

function getCurrentVariation(exId){ const s = getState(); return (s.legacy && s.legacy.exerciseVariations && s.legacy.exerciseVariations[exId]) || 0; }
function getVariationName(exId){ const ex = EXERCISE_LIBRARY[exId]; const i = getCurrentVariation(exId); return ex.ladder[Math.min(i, ex.ladder.length-1)]; }

function checkHit(exId, reps){
  const ex = EXERCISE_LIBRARY[exId];
  if(!ex || !reps || reps.length === 0) return false;
  const valid = reps.filter(r => r > 0);
  if(valid.length === 0) return false;
  return valid.length === (reps.length || ex.sets) && valid.every(r => r >= ex.repRange[1]);   // reps[] length = the session's set count
}
// ===================================================================
// ANCHOR PROGRESSION ENGINE v2 (total quality reps; Chunk 2, commit 3)
// ===================================================================
// Scoreboard for the two heavy ring anchors only (HEAVY_ANCHOR_SLOTS). Progression is
// TOTAL QUALITY REPS across all anchor sets, with a +2 credited-reps/week cap. Raw reps
// are never destroyed (history keeps them); the cap lives only in the credited number.
//
// anchorProgress[slotId] = {
//   exId, label,
//   lastRawQualityReps,            // most recent session's raw total (display truth)
//   creditedQualityReps,           // capped running figure the target is based on (null = establish baseline)
//   previousCreditedQualityReps,   // prior credited (for "+N this week" verdicts)
//   creditCapped,                  // was the most recent credit capped by the +2 rule
//   externalLoad, loadUnit,        // added load on the same movement (backpack/band)
//   variationId,                   // slot-scoped variation (ladder is reference only)
//   lastDate
// }
const WEEKLY_CREDIT_CAP = 2;       // max credited-rep gain per session (target-sanity, not tendon)
const LOAD_STEP_LB = 5;            // default load step when the top total is owned

// Top total for an anchor slot = sets * top-of-rep-range (e.g. 4 x 6 = 24 for pull).
// v8: the set count comes from the session (performed[].targetSets); old history falls
// back to the library default, so it replays exactly as it scored.
function anchorTopTotal(exId, sets){
  const ex = EXERCISE_LIBRARY[exId];
  return (sets || ex.sets) * ex.repRange[1];
}

// Apply scoring for one finalized log entry into the in-memory next-state. Pure w.r.t.
// `next` (mutates only next.anchorProgress). Builder work never scores — only performed[]
// items flagged progressionType:'heavyAnchor' whose slotId is a known HEAVY_ANCHOR_SLOT.
function applyAnchorProgressionV2(next, entry){
  if(!next.anchorProgress) next.anchorProgress = {};
  // v7.3 RECOVERY RESET: a recovery-mode entry (ring swap or PT's list) holds both heavy
  // anchors at bodyweight with no baseline, so the first anchor session after recovery
  // mode turns off sets a fresh baseline at bodyweight. Because the reset is read from the
  // log itself, every replay (history delete, migration) reproduces it. Recovery work never
  // scores and never steps load.
  if(entry && entry.mode === 'recovery'){ resetHeavyAnchors(next, entry.date); return; }
  if(!entry || !Array.isArray(entry.performed)) return;
  entry.performed.forEach(p=>{
    if(p.progressionType !== 'heavyAnchor') return;          // only heavy anchors score
    if(!HEAVY_ANCHOR_SLOTS[p.slotId]) return;                // only the two known scoreboard slots
    const ex = EXERCISE_LIBRARY[p.exId]; if(!ex) return;
    // INCOMPLETE GUARD: require all anchor sets present and done (no skipped, full set count).
    if(p.skipped) return;
    const reps = Array.isArray(p.reps) ? p.reps : [];
    const doneReps = reps.filter(r=> typeof r === 'number' && r > 0);
    if(doneReps.length < (p.targetSets || ex.sets)) return;  // not all sets logged -> no scoring

    const rawQualityReps = doneReps.reduce((a,b)=>a+b, 0);
    const prog = next.anchorProgress[p.slotId] || {
      exId: p.exId, label: (HEAVY_ANCHOR_SLOTS[p.slotId].label || p.exId),
      lastRawQualityReps: null, creditedQualityReps: null, previousCreditedQualityReps: null,
      creditCapped: false, externalLoad: 0, loadUnit: 'lb', variationId: null, lastDate: null
    };
    const prevCredited = (typeof prog.creditedQualityReps === 'number') ? prog.creditedQualityReps : null;

    let credited, creditCapped = false;
    if(prevCredited === null){
      // Establishing a baseline (first session, or just after a load step-up).
      credited = rawQualityReps;
    } else {
      const capped = Math.min(rawQualityReps, prevCredited + WEEKLY_CREDIT_CAP);
      credited = Math.max(capped, prevCredited);             // never decrease credited on a down day
      creditCapped = rawQualityReps > prevCredited + WEEKLY_CREDIT_CAP;
    }

    prog.previousCreditedQualityReps = prevCredited;
    prog.lastRawQualityReps = rawQualityReps;
    prog.creditedQualityReps = credited;
    prog.creditCapped = creditCapped;
    prog.lastDate = entry.date;

    // TOP-OF-RANGE STEP-UP: once credited owns the top total, add load and re-baseline.
    // creditedQualityReps=null => next completed session establishes the baseline at new load.
    const top = anchorTopTotal(p.exId, p.targetSets);
    if(typeof prog.creditedQualityReps === 'number' && prog.creditedQualityReps >= top){
      prog.externalLoad = (prog.externalLoad || 0) + LOAD_STEP_LB;
      prog.previousCreditedQualityReps = prog.creditedQualityReps;
      prog.creditedQualityReps = null;     // re-establish baseline at the new load
      prog.steppedUp = true;
    } else {
      prog.steppedUp = false;
    }

    next.anchorProgress[p.slotId] = prog;
  });
}

// Both heavy anchors back to bodyweight with no baseline (v7.3 recovery layer).
function resetHeavyAnchors(next, date){
  if(!next.anchorProgress) next.anchorProgress = {};
  Object.keys(HEAVY_ANCHOR_SLOTS).forEach(slotId=>{
    const meta = HEAVY_ANCHOR_SLOTS[slotId];
    next.anchorProgress[slotId] = {
      exId: meta.exId, label: meta.label,
      lastRawQualityReps: null, creditedQualityReps: null, previousCreditedQualityReps: null,
      creditCapped: false, externalLoad: 0, loadUnit: 'lb', variationId: null,
      lastDate: date || null, steppedUp: false, recoveryReset: true
    };
  });
}

// Post-session verdict line for an anchor slot, shown under the meter on Home.
// Branch logic is unchanged from the engine commit (no scoring behavior here) —
// only the copy is warmer/clearer. Chunk 3.
function anchorVerdict(prog){
  if(!prog) return '';
  // Same branch logic as before (no scoring change) — warmer post-session copy.
  if(prog.steppedUp) return `You owned the top. Load goes up to +${prog.externalLoad||LOAD_STEP_LB}${prog.loadUnit||'lb'} — next time just set your new baseline.`;
  if(prog.creditedQualityReps === null) return 'Fresh load. First session sets your baseline, no target to beat.';
  const prev = prog.previousCreditedQualityReps;
  if(typeof prev !== 'number') return `Baseline locked in at ${prog.lastRawQualityReps}. Now we climb.`;
  const gain = prog.creditedQualityReps - prev;
  if(gain > 0) return prog.creditCapped
    ? `Huge day — banked +${gain} (capped at +${WEEKLY_CREDIT_CAP}/session so the target stays honest).`
    : `+${gain} rep${gain===1?'':'s'} banked. That counts.`;
  if(prog.lastRawQualityReps >= prev) return 'Matched last time — holding ground is progress on a hard lift.';
  return 'Off your best today, but your banked total holds. No ground lost.';
}

// Estimates read a template object, so normal and recovery sessions share one formula.
function estimateFromTemplate(t, coreOnly){
  let sec = t.opener ? 90 : t.noForm ? 60 : 7*60; // v8 opener ~1.5 min; Form ~7 min
  if(t.activation) sec += 90;
  t.blocks.forEach(b=>{ if(coreOnly && !(b.core || b.gate)) return; b.exercises.forEach(exId=>{
    const ex = EXERCISE_LIBRARY[exId];
    const work = isDurationUnit(ex.unit) ? ex.repRange[1] : 30;
    sec += (b.sets || ex.sets) * (work + (REST_TIMES[b.type] || 0));
  }); });
  return Math.round(sec/60);
}
function estimateDuration(type, mode){ return estimateFromTemplate(templateFor(type, mode || 'normal')); }
// Core-only estimate — the honest "what does today ask of me" number.
function estimateCoreDuration(type, mode){ return estimateFromTemplate(templateFor(type, mode || 'normal'), true); }

// ===================================================================
// NOTION SYNC (v6) - PWA -> Netlify Function -> Notion mirror
// ===================================================================
// localStorage is the source of truth; the Notion DB is a derived, self-healing mirror.
// Every finalized session carries a stable sessionId; the server upserts by that id, so a
// timeout that wrote the row but never returned is healed on the next push (no duplicates).
// Sync NEVER blocks finishing a workout, and notionSync metadata is transport-only -
// the scoring engine never reads it.
const SYNC_ENDPOINT = 'https://hyndesyte-train-sync.netlify.app/.netlify/functions/sync-training-session';

// ===================================================================
// HAND-OFF (one writer, always; shipped before the native cutover)
// ===================================================================
// Two local switches decide which app logs and syncs: this one and the native app's "Start
// syncing". Nothing is decided by an icon. The flag lives in its own localStorage key, outside
// train_state, so it rides no export and Import leaves it alone. Values: 'on' (handed off:
// no logging, no sync, no Erase; History, Export and Import still work), 'off' (this copy
// writes) or 'unknown' (read-only until the remote flag can be read). Absent means a copy
// that predates the hand-off or one that was never handed off: writable, no network needed.
//
// The remote flag (writer.json on Pages) is a BACKSTOP for one case only: iOS evicted this
// copy's storage after a hand-off. It is read when both keys are absent, or when the flag
// says 'unknown'; never otherwise. Its value is written into the local key, so the default
// state a boot writes can never turn the copy writable later. writer.json exists as 'pwa'
// before this release, so a 404 never has to authorize writing.
//
// The native shell runs this same file and replaces handoffSupported() with () => false
// before DOMContentLoaded (the shell's bridge script loads after this one): it is never handed off, never
// fetches the flag, never shows the row, the hold or the banner.
const HANDOFF_KEY = 'train_handoff';
const WRITER_FLAG_URL = 'https://hyndesyte.github.io/train/writer.json';
const HANDOFF_FETCH_MS = 3000;
function handoffSupported(){ return true; }
let handoffBackstopPending = false;
function handoffValue(){ try { return localStorage.getItem(HANDOFF_KEY); } catch(e){ return null; } }
function setHandoffValue(v){ try { localStorage.setItem(HANDOFF_KEY, v); } catch(e){ console.error('handoff flag save failed', e); } }
// The one predicate: true while handed off, while the flag is unknown and while a backstop
// fetch is pending. Read by renderHome, renderHistory, renderSettings, expireParkIfDue and the
// three sync functions.
function handoffActive(){
  if(!handoffSupported()) return false;
  if(handoffBackstopPending) return true;
  const v = handoffValue();
  return v === 'on' || v === 'unknown';
}
// Both keys read raw, before the first getState() (which would write a default state).
function handoffBackstopNeeded(){
  if(!handoffSupported()) return false;
  let key = null, state = null;
  try { key = localStorage.getItem(HANDOFF_KEY); state = localStorage.getItem('train_state'); } catch(e){ return false; }
  if(key === 'unknown') return true;
  return key === null && state === null;
}
// Fetch writer.json (cache-busted, no store), wait at most HANDOFF_FETCH_MS. 'native' -> on,
// 'pwa' -> off, anything else (404, malformed, offline, no answer) -> unknown.
async function runHandoffBackstop(){
  handoffBackstopPending = true;
  let value = 'unknown';
  try {
    const ctl = (typeof AbortController === 'function') ? new AbortController() : null;
    let timer = null;
    const timeout = new Promise((_, reject)=>{ timer = setTimeout(()=>{ try { if(ctl) ctl.abort(); } catch(e){} reject(new Error('writer flag timeout')); }, HANDOFF_FETCH_MS); });
    const read = (async ()=>{
      const res = await fetch(WRITER_FLAG_URL + '?t=' + Date.now(), { cache:'no-store', signal: ctl ? ctl.signal : undefined });
      if(!res || !res.ok) return 'unknown';
      const j = await res.json();
      // the same reading as the sync function: trimmed, case-folded, nothing else accepted
      const w = (j && typeof j.writer === 'string') ? j.writer.trim().toLowerCase() : null;
      return w === 'native' ? 'on' : w === 'pwa' ? 'off' : 'unknown';
    })();
    read.catch(()=>{});   // a late rejection after the timeout won the race is not an error
    try { value = await Promise.race([read, timeout]); } finally { clearTimeout(timer); }
  } catch(e){ value = 'unknown'; }
  setHandoffValue(value);
  handoffBackstopPending = false;
  return value;
}
// The banner's Retry: one run at a time; Home shows the hold while it runs.
async function retryHandoffBackstop(){

  handoffBackstopPending = true;
  if(currentScreen === 'home') renderHome();
  refreshSyncIndicator();

  else if(currentScreen === 'settings') renderSettings();

// What stands in the way of a hand-off: an open or parked session, PT's list in progress,
// anything still to sync, or a drain in flight. Empty means the switch may turn on.
function handoffBlockers(s){
  const out = [];
  if(s.activeSession) out.push(s.activeSession.parkedAt ? 'the parked session (resume and finish it, or discard it)' : 'the session in progress');
  if(typeof PTS !== 'undefined' && PTS && !PTS.viewOnly) out.push('PT’s list in progress');
  const pendingSessions = (s.log || []).filter(e => e.sessionId && (!e.notionSync || e.notionSync.status !== 'synced')).length;
  const pendingDeletes = Array.isArray(s.pendingDeletes) ? s.pendingDeletes.length : 0;
  if(pendingSessions + pendingDeletes > 0) out.push(`${pendingSessions + pendingDeletes} item${pendingSessions + pendingDeletes === 1 ? '' : 's'} still to sync (Settings → Advanced → Retry sync)`);

}

function renderHandoffCard(){

// Session count and a short digest of the Session IDs, the cutover check against the native
// app: first 8 lowercase hex characters of SHA-256 over the sorted Session IDs joined by '\n'
// with no trailing newline. The sort is JavaScript's default (UTF-16 code units), which is
// code-point order for the ASCII ids this app generates (UUIDs and 'sid-…'); the mirror script
// sorts the same way. Needs crypto.subtle (a secure context).
function sessionIdsOf(s){ return (s.log || []).map(e => e && e.sessionId).filter(x => typeof x === 'string' && x.length).sort(); }
async function sessionDigest(s){
  const ids = sessionIdsOf(s);
  const bytes = new TextEncoder().encode(ids.join('\n'));
  const buf = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 8);
}
function fillSessionDigest(){
  const el = document.getElementById('session-digest'); if(!el) return;
  const s = getState();
  const n = sessionIdsOf(s).length;
  if(!(typeof crypto !== 'undefined' && crypto && crypto.subtle && typeof TextEncoder === 'function')){ el.textContent = `${n} session${n === 1 ? '' : 's'} · digest unavailable here`; return; }
  sessionDigest(s).then(d => { el.textContent = `${n} session${n === 1 ? '' : 's'} · digest ${d}`; }).catch(()=>{ el.textContent = `${n} session${n === 1 ? '' : 's'} · digest unavailable`; });
}

function statusToNotion(s){ return s === 'stopped' ? 'Stopped' : s === 'partial' ? 'Partial' : 'Completed'; }

// Build the heavy-anchor block for the payload from the entry alone (stable across re-pushes).
// Performance fields come from performed[]; scoreboard fields from the snapshot taken at
// finalize (absent on backfilled history, which is fine - those fields are simply omitted).
function buildAnchorBlock(entry){
  if(!Array.isArray(entry.performed)) return null;
  const p = entry.performed.find(x => x.progressionType === 'heavyAnchor' && HEAVY_ANCHOR_SLOTS[x.slotId] && !x.skipped);
  if(!p) return null;
  const done = (p.reps || []).filter(r => typeof r === 'number' && r > 0);
  if(!done.length) return null;
  const block = {
    slot: p.slotId,
    exercise: p.exId,
    reps: done.join('/'),
    rawQualityReps: done.reduce((a,b)=>a+b,0),
    targetTotal: anchorTopTotal(p.exId, p.targetSets)
  };
  const snap = entry.anchorSnapshot;
  if(snap){
    if(typeof snap.creditedReps === 'number') block.creditedReps = snap.creditedReps;
    if(typeof snap.creditDelta === 'number') block.creditDelta = snap.creditDelta;
    if(typeof snap.creditCapped === 'boolean') block.creditCapped = snap.creditCapped;
    if(typeof snap.load === 'number') block.load = snap.load;
    if(snap.loadUnit) block.loadUnit = snap.loadUnit;
  }
  return block;
}

// Map a log entry -> the Netlify function's upsert contract.
function buildSyncPayload(entry){
  const meta = entry.exerciseMeta || {};
  const issues = Array.isArray(entry.issues) ? entry.issues : [];
  const exercises = Array.isArray(entry.performed) ? entry.performed.map(p => {
    const m = meta[p.exId] || {};
    const ex = EXERCISE_LIBRARY[p.exId];
    const out = { name: ex ? ex.name : p.exId, role: p.role, reps: p.skipped ? 'skipped' : (p.reps || []) };
    if(m.issueFlag === 'issue' && m.note) out.issue = m.note;
    else if(m.note) out.note = m.note;
    return out;
  }) : [];
  // PT's list (v7.3): no set logging; its items + doses ride as the exercise detail.
  if(entry.sessionType === 'PT' && Array.isArray(entry.ptItems)){
    entry.ptItems.forEach(i=> exercises.push({ name: i.name, role: i.block === 'adds' ? 'train adds' : 'pt', reps: i.dose || '',
      issue: i.status === 'stopped' ? 'stopped for symptoms' : undefined,
      note: (i.status && i.status !== 'done' && i.status !== 'stopped') ? i.status : undefined }));
  }
  const { notionSync, ...rawEntry } = entry;   // keep transport state out of the stored raw
  const payload = {
    op: 'upsert',
    sessionId: entry.sessionId,
    sessionSequence: entry.sessionSequence,
    date: entry.date,
    completedAt: entry.completedAt || null,
    sessionType: entry.sessionType,
    status: statusToNotion(entry.sessionStatus),
    durationMin: typeof entry.duration === 'number' ? entry.duration : null,
    overrideUsed: !!entry.overrideUsed,
    sessionNote: entry.sessionType === 'EN' ? [entry.engineKind || 'Engine', entry.notes].filter(Boolean).join(' · ')
      : entry.legsOnly ? ['Legs only today', entry.notes].filter(Boolean).join(' · ') : (entry.notes || ''),
    coreComplete: (typeof entry.coreComplete === 'boolean') ? entry.coreComplete : null,
    issueCount: issues.length,
    issueFlags: [...new Set(issues.map(i => i.exId).filter(Boolean))],
    attentionFlag: !!entry.attentionFlag,
    detail: { exercises, collectedIssues: issues.map(i => i.note).filter(Boolean) },
    raw: rawEntry
  };
  // v7.3 recovery layer -> Notion 'Mode' / 'Arm Check' / 'PT List'. Omitted for entries that
  // predate the layer, so a re-push of old history never stamps a mode it didn't record.
  if(entry.mode === 'recovery' || entry.mode === 'normal') payload.mode = entry.mode === 'recovery' ? 'Recovery' : 'Normal';
  if(ARM_CHECK_VALUES.indexOf(entry.armCheck) !== -1) payload.armCheck = entry.armCheck.charAt(0).toUpperCase() + entry.armCheck.slice(1);
  if(typeof entry.ptList === 'boolean') payload.ptList = entry.ptList;
  const anchor = buildAnchorBlock(entry);
  if(anchor) payload.anchor = anchor;
  return payload;
}

// Mutate one entry's notionSync in place inside the live state, then persist. Looked up by
// sessionId so a concurrent edit elsewhere can't clobber the whole log.
function markSync(sessionId, patch){
  const s = getState();
  const e = (s.log || []).find(x => x.sessionId === sessionId);
  if(!e) return;
  e.notionSync = Object.assign({ status:'pending', lastAttemptAt:null, syncedAt:null, notionPageId:null, error:null }, e.notionSync, patch);
  saveState(s);
}

// X-Train-Client names this copy as the PWA; the sync function refuses the app that is not
// the writer (403) and answers 503 while the writer flag is unknown. Handed off: no request.
async function postSync(body){
  if(handoffActive()) throw new Error('handed off');
  const res = await fetch(SYNC_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Train-Client': 'pwa' },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('sync ' + res.status);
  return res.json();
}

// Push a single entry (upsert). Non-blocking caller; updates notionSync + the indicator.
async function syncEntry(sessionId){
  if(handoffActive()) return;
  const s = getState();
  const entry = (s.log || []).find(x => x.sessionId === sessionId);
  if(!entry) return;
  markSync(sessionId, { status:'pending', lastAttemptAt:new Date().toISOString(), error:null });
  refreshSyncIndicator();
  try {
    const data = await postSync(buildSyncPayload(entry));
    markSync(sessionId, { status:'synced', syncedAt:new Date().toISOString(), notionPageId:(data && data.notionPageId) || null, error:null });
  } catch(e){
    markSync(sessionId, { status:'failed', error:String(e && e.message || e) });
  }
  refreshSyncIndicator();
}

// Drain pending soft-deletes (tombstones), then push every not-yet-synced session oldest-first.
// One attempt per item per call (no hammering); failures stay queued for the next app-open or
// manual retry. A verified failure is left as data, not retried in a tight loop.
let syncDraining = false;
async function pushUnsynced(){
  if(syncDraining || handoffActive()) return;
  syncDraining = true;
  try {
    // tombstones first
    let s = getState();
    const deletes = Array.isArray(s.pendingDeletes) ? [...s.pendingDeletes] : [];
    for(const sid of deletes){
      try {
        await postSync({ op:'delete', sessionId: sid });
        const cur = getState();
        cur.pendingDeletes = (cur.pendingDeletes || []).filter(x => x !== sid);
        saveState(cur);
      } catch(e){ /* leave queued; try again next open */ }
    }
    // then unsynced sessions, oldest-first by sequence
    s = getState();
    const pending = (s.log || [])
      .filter(e => e.sessionId && (!e.notionSync || e.notionSync.status !== 'synced'))
      .sort((a,b)=> (a.sessionSequence||0) - (b.sessionSequence||0));
    for(const e of pending){ await syncEntry(e.sessionId); }
  } finally {
    syncDraining = false;
    refreshSyncIndicator();
  }
}

// Indicator reflects real state: Synced when nothing is outstanding, otherwise a pending count
// (red dot if any have hard-failed). Empty before the first session exists.
function refreshSyncIndicator(){
  const el = document.getElementById('sync-indicator'); if(!el) return;
  const s = getState();
  if(!s.log || !s.log.length){ el.innerHTML = ''; return; }
  const pendingSessions = s.log.filter(e => !e.notionSync || e.notionSync.status !== 'synced');
  const failed = pendingSessions.filter(e => e.notionSync && e.notionSync.status === 'failed').length;
  const outstanding = pendingSessions.length + (Array.isArray(s.pendingDeletes) ? s.pendingDeletes.length : 0);
  if(outstanding === 0){ el.innerHTML = '<span class="sync-dot synced"></span>Synced'; return; }
  if(handoffActive()){ el.innerHTML = `<span class="sync-dot error"></span>${outstanding} pending &middot; paused`; return; }   // nothing drains while handed off
  el.innerHTML = `<span class="sync-dot ${failed ? 'error' : 'syncing'}"></span>${outstanding} pending`;
}

// ===================================================================
// AUDIO (Web Audio; unlocked on a user gesture)
// ===================================================================
let audioCtx = null;
function unlockAudio(){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){ /* audio unavailable; fall back to vibrate only */ }
}
function tone(freq, start, dur, vol){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  const t0 = audioCtx.currentTime + start;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.25, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
// Sound on/off (persisted). Default on.
function soundEnabled(){ try { return localStorage.getItem('train_sound_off') !== '1'; } catch(e){ return true; } }
function setSoundEnabled(on){ try { localStorage.setItem('train_sound_off', on ? '0' : '1'); } catch(e){} }

// Waveform-capable tone. Mirrors tone() but lets a cue pick its timbre.
function toneW(freq, start, dur, vol, type){
  if(!audioCtx || !soundEnabled()) return;
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  const t0 = audioCtx.currentTime + start;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.25, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function buzz(pattern){ if(soundEnabled() && navigator.vibrate) navigator.vibrate(pattern); }

// ---- The six locked cues (vocabulary fixed 2026-05-24) ----
// Rising family (GO / STARTED / SESSION DONE) separated by note count + interval.
// Singles (LOGGED / NOTED) separated by pitch. Shapes carry meaning; on/off only.
function cueGo(){ unlockAudio(); toneW(523,0,0.13,0.30,'triangle'); toneW(784,0.12,0.20,0.34,'triangle'); buzz([90,60,130]); }        // rest over -> go
function cueRelease(){ unlockAudio(); toneW(784,0,0.16,0.26,'sine'); toneW(523,0.16,0.22,0.26,'sine'); buzz([140,80,140]); }       // hold up -> come off
function cueStarted(){ unlockAudio(); toneW(587,0,0.09,0.20,'sine'); toneW(740,0.10,0.12,0.22,'sine'); buzz(50); }                 // hold timing started
function cueLogged(){ unlockAudio(); toneW(587,0,0.14,0.24,'triangle'); buzz(40); }                                               // set saved
function cueSessionDone(){ unlockAudio(); toneW(523,0,0.14,0.28,'triangle'); toneW(659,0.14,0.14,0.30,'triangle'); toneW(784,0.30,0.26,0.32,'triangle'); buzz([110,70,110,70,150]); } // workout complete
function cueNoted(){ unlockAudio(); toneW(392,0,0.16,0.20,'sine'); buzz(30); }                                                    // skip / issue logged

// ===================================================================
// SESSION STATE MACHINE
// ===================================================================
// activeSession (persisted in state.activeSession):
// { schemaVersion, type, startTime, cursor, phase, setIdx, timerEnd, timerKind,
//   records:{ uid:{ kind, exId?, sets:[], setStatus:[], status, issueFlag, note, quality, painFree } },
//   sessionNote, issues:[] }
let timerRAF = null;
let AS = null; // in-memory mirror of activeSession

function buildFlow(type, mode, s){ return buildFlowFrom(type, templateFor(type, mode || 'normal', s)); }
function buildFlowFrom(type, t){
  const flow = [];
  if(t.opener) flow.push({ kind:'form', uid:'opener', variant:'opener' });   // v8 fixed opener
  else if(!t.noForm) flow.push({ kind:'form', uid:'form-all' });
  if(t.activation) flow.push({ kind:'activation', uid:'activation' });
  t.blocks.forEach(block=> block.exercises.forEach(exId=> flow.push({ kind:'exercise', uid:'ex-'+exId, exId, sets: block.sets || EXERCISE_LIBRARY[exId].sets, blockType:block.type, blockLabel:block.label, core: !!(block.core || block.gate), gate: !!block.gate, arms: !!block.arms, cardio: !!block.requiresCardioClear || CARDIO_EXERCISES.indexOf(exId) !== -1, slotId: type+'_'+block.type+'_'+exId, progressionType: block.progressionType || 'loose' })));
  return flow;
}
// Flow items passed over when the cursor reaches them (v7.3): arm work after a leg-day
// symptom stop, and conditioning while the cardiology cap holds (a frozen session can
// carry jump rope from before the cap came back on).
function isPassedOver(st, s){
  if(!st || st.kind !== 'exercise') return false;
  if(AS && AS.armWorkEnded && st.arms) return true;
  return !!(st.cardio && cardioCapOn(s || getState()));
}
// v8: an exercise's set count for this session: its live record (frozen at start), else the
// flow item's block sets, else the library default (v7 sessions).
function setsFor(st){
  const r = AS && st && AS.records && AS.records[st.uid];
  if(r && Array.isArray(r.sets) && r.sets.length) return r.sets.length;
  const ex = st && EXERCISE_LIBRARY[st.exId];
  return (st && st.sets) || (ex ? ex.sets : 0);
}
// Index of the next flow item that will actually run, from `from` on.
function nextLiveIndex(from){
  const flow = currentFlow(); const s = getState();
  let i = from;
  while(i < flow.length && isPassedOver(flow[i], s)) i++;
  return i;
}

// ---- ACTIVE-TIME CLOCK (v7): duration is accumulated engaged time, never wall-clock
// span. Gaps beyond the idle cap (backgrounded, left) don't count; Park freezes the
// clock entirely. Kills the multi-day "4,256 min" duration class at the source.
const IDLE_GAP_CAP_MS = 10*60*1000;
function markActive(){
  if(!AS || AS.parkedAt) return;
  const now = Date.now();
  if(typeof AS.activeMs !== 'number') AS.activeMs = 0;
  if(AS.lastActiveAt) AS.activeMs += Math.min(now - AS.lastActiveAt, IDLE_GAP_CAP_MS);
  AS.lastActiveAt = now;
}
function sessionActiveMinutes(){
  markActive();
  if(typeof AS.activeMs === 'number') return Math.max(1, Math.round(AS.activeMs/60000));
  return Math.max(1, Math.round((Date.now() - AS.startTime)/60000)); // legacy in-flight session
}
// Core gate for the LIVE session — same predicate as entryCoreComplete, read from records.
// v7.3: the gate exercises come from the session's frozen flow (never re-read from a
// template mid-session), and a symptom stop counts: "End arm work" marks the whole core
// complete, and an exercise stopped at PT's line satisfies its own gate slot.
function liveCoreComplete(){
  if(!AS) return false;
  // v7 ring days: a symptom stop ends the session and it counts. v8 A/B/C: End arm work or
  // Legs only passes the arm gates over, and Core counts on the leg gates (never instantly).
  if(AS.symptomStop && RING_DAYS.indexOf(AS.type) !== -1) return true;
  const allGates = currentFlow().filter(st=> st.kind === 'exercise' && st.gate);
  const gates = AS.armWorkEnded ? allGates.filter(st=> !st.arms) : allGates;
  if(!gates.length) return !!(AS.armWorkEnded && allGates.length);
  return gates.every(st=>{
    const rec = AS.records[st.uid]; const ex = EXERCISE_LIBRARY[st.exId];
    if(!rec || !ex) return false;
    if(rec.symptomStopped) return true;
    let done = 0;
    rec.setStatus.forEach((s,i)=>{ if(s === 'done' && rec.sets[i] > 0) done++; });
    return done >= setsFor(st);
  });
}

function persistAS(){ markActive(); const s = getState(); s.activeSession = AS; saveState(s); }

// Start a rotation (or Floor) session. In recovery mode the day's first session opens with
// the one-tap arm check, then the session starts.
// v8: opts.legsOnly ("Legs only today": a PT-visit day or a rough arm day) starts with the
// arm work already passed over; Core counts on the legs, nothing records a symptom stop.
function startSession(type, opts){
  if(handoffActive()){ showScreen('home'); return; }   // a handed-off copy starts nothing (stale tab guard)
  unlockAudio();
  const s = getState();
  const mode = sessionModeFor(s, type);
  const legsOnly = !!(opts && opts.legsOnly);
  if(mode === 'recovery' && needsArmCheck(s)){ askArmCheck((v)=> beginSession(type, mode, v, legsOnly)); return; }
  beginSession(type, mode, undefined, legsOnly);
}
function beginSession(type, mode, tappedArmCheck, legsOnly){
  mode = mode || 'normal';
  const s = getState();
  // FROZEN at start (v7.3): the exercise list, the template facts and the mode live on the
  // session itself, so a mode switch or template change can't re-shape it mid-session.
  const flow = buildFlow(type, mode);
  AS = {
    schemaVersion: SCHEMA_VERSION,
    type, mode, flow, tpl: tplSnapshot(templateFor(type, mode, s)),
    armCheck: mode === 'recovery' ? (tappedArmCheck !== undefined ? tappedArmCheck : todayArmCheck(s)) : null,
    startTime: Date.now(),
    activeMs: 0, lastActiveAt: Date.now(), coreForkShown: false,
    cursor: 0, phase: 'view', setIdx: 0,
    timerEnd: null, timerKind: null,
    records: {}, sessionNote: '', issues: []
  };
  if(legsOnly){ AS.legsOnly = true; AS.armWorkEnded = true; }
  flow.forEach(st=>{
    if(st.kind === 'exercise'){
      const ex = EXERCISE_LIBRARY[st.exId];
      const n = st.sets || ex.sets;
      AS.records[st.uid] = { kind:'exercise', exId:st.exId, sets:new Array(n).fill(0), setStatus:new Array(n).fill('pending'), status:'pending', issueFlag:'none', note:'', quality:'unknown', painFree:'unknown' };
    } else {
      AS.records[st.uid] = { kind: st.kind, status:'pending' };
    }
  });
  persistAS();
  enterSessionScreen();
}

function resumeSession(asked){
  if(handoffActive()){ showScreen('home'); return; }
  const s = getState();
  if(!s.activeSession){ renderHome(); return; }
  // v7.3: a recovery session resumed on a new day opens with that day's arm check, and the
  // entry logs the check of the day it is finished on. `asked` = { value } once answered.
  const answered = !!(asked && typeof asked === 'object' && 'value' in asked);
  if(!answered && s.activeSession.mode === 'recovery' && needsArmCheck(s)){ askArmCheck((v)=> resumeSession({ value: v })); return; }
  AS = s.activeSession;
  if(AS.mode === 'recovery') AS.armCheck = answered ? asked.value : todayArmCheck(s);
  // Un-park: clear the bound, restart the clock. Frozen timers stay paused — the user
  // restarts them deliberately (no ambush).
  if(AS.parkedAt){ delete AS.parkedAt; delete AS.parkExpiresAt; }
  if(typeof AS.activeMs !== 'number') AS.activeMs = 0;
  AS.lastActiveAt = Date.now();
  // Reconcile a timer that expired while the app was closed. Cold resume never
  // fires a cue (GO/RELEASE) — the user is already looking at the resume state,
  // so surprise audio on page load would be worse than silence.
  let reconciled = false;
  if(AS.timerEnd && Date.now() >= AS.timerEnd){
    const wasKind = AS.timerKind;
    const expiredAt = AS.timerEnd;
    clearTimerState();
    if(wasKind === 'rest' && AS.phase === 'rest'){
      // Rest finished while away → terminal rest-complete; wait for the user's tap.
      AS.phase = 'restComplete';
    } else if(wasKind === 'work' && AS.phase === 'work'){
      // Hold finished while away. Treat it as a completed hold (mirrors
      // onWorkTimerComplete), then place the user correctly relative to the rest
      // that would have started at expiredAt — never a dead 'work' screen.
      reconcileExpiredWork(expiredAt);
    }
    reconciled = true;
  }
  if(reconciled) persistAS();
  enterSessionScreen();
}

// Cold-resume handler for a hold timer that expired while the app was closed.
// Marks the set complete at full target, then branches on the rest window:
// still-running rest → 'rest' with correct remaining; elapsed rest → 'restComplete';
// no rest (final set/station or restSec 0) → advance. Plays no cue (cold resume).
function reconcileExpiredWork(expiredAt){
  const flow = currentFlow();
  const st = flow[AS.cursor];
  const ex = EXERCISE_LIBRARY[st.exId];
  const rec = AS.records[st.uid];
  rec.sets[AS.setIdx] = ex.repRange[1]; // full hold achieved
  rec.setStatus[AS.setIdx] = 'done';
  clearTimerState();
  const restSec = REST_TIMES[st.blockType] || 0;
  const moreSets = AS.setIdx + 1 < setsFor(st);
  const moreStations = nextLiveIndex(AS.cursor + 1) < flow.length;
  if(restSec > 0 && (moreSets || moreStations)){
    const restEnd = expiredAt + restSec*1000;
    if(Date.now() >= restEnd){
      AS.phase = 'restComplete'; // rest already elapsed while away
    } else {
      AS.phase = 'rest';
      AS.timerKind = 'rest';
      AS.timerEnd = restEnd; // resume the rest already in progress, not a fresh one
    }
  } else {
    // No rest after this set: advance the cursor exactly as advanceAfterSet would.
    if(moreSets){
      AS.setIdx++; AS.phase = 'view';
    } else {
      rec.status = rec.setStatus.every(x=>x==='skipped') ? 'skipped' : 'done';
      AS.cursor++; AS.setIdx = 0; AS.phase = 'view';
    }
  }
}

function enterSessionScreen(){
  const t = currentTpl();
  document.getElementById('session-title').textContent = t.name;
  const gc = t.grip === 'high' ? 'var(--grip-high)' : t.grip === 'low' ? 'var(--grip-low)' : 'var(--grip-none)';
  document.getElementById('session-grip').innerHTML = `<span class="grip-dot" style="background:${gc}"></span>`;
  showScreen('session');
  renderStation();
}

// The running session's exercise list: frozen at start (v7.3). The rebuild fallback only
// serves a session that somehow lacks one (migrate() freezes older in-flight sessions).
function currentFlow(){ return (AS && Array.isArray(AS.flow)) ? AS.flow : buildFlow(AS.type, AS.mode || 'normal'); }
function currentTpl(){ return (AS && AS.tpl) ? AS.tpl : tplSnapshot(templateFor(AS.type, AS.mode || 'normal')); }

function renderProgressBar(){
  const flow = currentFlow();
  const wrap = document.getElementById('flow-progress');
  wrap.innerHTML = flow.map((st,i)=>{
    let cls = 'flow-seg';
    if(i < AS.cursor) cls += ' done';
    else if(i === AS.cursor) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
}

function renderStation(){
  if(!AS){ showScreen('home'); return; }
  const flow = currentFlow();
  if(AS.phase === 'coreFork'){ renderCoreFork(); return; }
  // v7.3: pass over what can't run now: arm work after a leg-day symptom stop, and
  // conditioning while the cardiology cap holds. Closed out as skipped, never logged as done.
  if(AS.cursor < flow.length && isPassedOver(flow[AS.cursor])){
    while(AS.cursor < flow.length && isPassedOver(flow[AS.cursor])){
      closeOutRecord(AS.records[flow[AS.cursor].uid], false);
      AS.cursor++; AS.setIdx = 0; AS.phase = 'view'; clearTimerState();
    }
    maybeEnterCoreFork();
    persistAS();
    if(AS.phase === 'coreFork'){ renderCoreFork(); return; }
  }
  if(AS.cursor >= flow.length){ renderCompletion(); return; }
  renderProgressBar();
  const st = flow[AS.cursor];
  if(st.kind === 'form' && st.variant === 'opener') renderOpenerStation(st);
  else if(st.kind === 'form') renderFormStation(st);
  else if(st.kind === 'activation') renderActivationStation(st);
  else renderExerciseStation(st);
}

// ---- CORE FORK (v7 elastic sessions) ----
// Shown once, at the moment the core gate is earned with extension work remaining.
// Primary = Finish: Core IS the completed session (red-team Major 2 — the primary action
// matches the declared success unit; extensions are a genuine option, not a debt).
function maybeEnterCoreFork(){
  if(!AS || AS.coreForkShown) return false;
  const flow = currentFlow();
  const lastCoreIdx = flow.reduce((acc,st,i)=> st.core ? i : acc, -1);
  if(lastCoreIdx === -1) return false;
  if(AS.cursor <= lastCoreIdx) return false;   // still inside the core path
  if(nextLiveIndex(AS.cursor) >= flow.length) return false;   // nothing (live) after core -> normal completion
  if(!liveCoreComplete()) return false;        // gate not earned (e.g. skipped anchor sets)
  AS.coreForkShown = true;
  AS.phase = 'coreFork';
  return true;
}
