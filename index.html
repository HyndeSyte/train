function renderHome(){
  // Lazy park expiry — if it finalized, Home re-rendered with fresh state; stop here.
  if(expireParkIfDue()) return;
  const s = getState();
  // Override-aware resolution: Pick -> setSessionOverride() stored a valid
  // SESSION_TEMPLATES key; otherwise fall back to the rotation default.
  const defaultType = getDefaultSessionType(s);
  const overridden = hasSessionOverride(s) && s.nextSessionOverride !== defaultType;
  const nextType = getEffectiveSessionType(s);
  const t = SESSION_TEMPLATES[nextType];
  const est = estimateDuration(nextType);
  const gc = t.grip==='high'?'var(--grip-high)':t.grip==='low'?'var(--grip-low)':'var(--grip-none)';

  // RESUME GUARD: an active session takes over Home entirely. No start path,
  // no Today card, no promotions competing with the in-progress decision.
  if(s.activeSession){
    const a = s.activeSession;
    const rt = SESSION_TEMPLATES[a.type];
    const rtName = rt ? rt.name : a.type;
    // Parked card: factual, never interrogative.
    document.getElementById('home-content').innerHTML = a.parkedAt ? `
      <div class="promo-card">
        <h3>Parked &middot; ${a.type}</h3>
        <p>${rtName} — saved where you left it. Parks clear after tomorrow.</p>
        <div class="promo-actions">
          <button class="btn btn-small btn-primary" onclick="resumeSession()">Resume</button>
          <button class="btn btn-small btn-secondary" onclick="discardActiveSession()">Discard</button>
        </div>
      </div>` : `
      <div class="promo-card">
        <h3>&#9656; Session in progress</h3>
        <p>${rtName} — pick up where you left off.</p>
        <div class="promo-actions">
          <button class="btn btn-small btn-primary" onclick="resumeSession()">Resume Session</button>
          <button class="btn btn-small btn-secondary" onclick="discardActiveSession()">Discard Session</button>
        </div>
      </div>`;
    return;
  }

  // Anchor scoreboard: the two heavy ring anchors' closing-in meter + verdict, read from
  // anchorProgress (the v2 engine's output). No manual promote prompts in v2.
  const anchorHtml = renderAnchorScoreboard(s);

  document.getElementById('home-content').innerHTML = `
    ${anchorHtml}
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="badge badge-${nextType.toLowerCase()}">${nextType}</span>
          <span class="grip-dot" style="background:${gc}"></span>
          <span style="font-size:11px;color:var(--text3);">${t.grip} grip</span>
        </div>
        <span style="font-size:11px;color:var(--text3);">~${est} min</span>
      </div>
      <div class="session-name">${t.name}</div>
      <button class="btn btn-primary" onclick="startSession('${nextType}')">Start Today's Session</button>
      <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:10px;line-height:1.6;">
        Opens with the Form &middot; core ~${estimateCoreDuration(nextType)} min
        ${overridden
          ? `<br>Picked &middot; Default: ${SESSION_TEMPLATES[defaultType].name} &middot; <a href="javascript:void(0)" onclick="clearSessionOverride()" style="color:var(--text2);text-decoration:underline;">Reset to default</a>`
          : `<br><a href="javascript:void(0)" onclick="openSessionPicker()" style="color:var(--text2);text-decoration:underline;">Pick a different day</a>`
        }
        <br><a href="javascript:void(0)" onclick="startSession('MVS')" style="color:var(--text2);text-decoration:underline;">Short on time? Floor day (~${estimateDuration('MVS')} min)</a>
      </div>
    </div>
    ${s.log.length ? renderLastSession(s) : ''}
    ${renderSessionPreview(nextType)}`;
}

function renderLastSession(s){
  const last = s.log[s.log.length-1]; if(!last) return '';
  const hitCount = last.exercises ? Object.entries(last.exercises).filter(([id,r])=>checkHit(id,r)).length : 0;
  const totalEx = last.exercises ? Object.keys(last.exercises).length : 0;
  const stat = last.sessionStatus || 'completed';
  return `<div class="card" style="padding:8px 12px;display:flex;align-items:center;justify-content:space-between;">
    <div style="font-size:12px;color:var(--text2);">Last: <strong style="color:var(--text);">${SESSION_TEMPLATES[last.sessionType]?.name||last.sessionType}</strong></div>
    <div style="font-size:11px;color:var(--text2);">${last.date.slice(5)} &middot; ${hitCount}/${totalEx} HITs<span class="status-chip status-${stat}">${stat}</span></div>
  </div>`;
}

function renderSessionPreview(type){
  const t = SESSION_TEMPLATES[type];
  let inner = t.noForm ? '' : `<div style="font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text3);margin:8px 0 3px;">Form</div>
    <div style="font-size:14px;padding:2px 0;line-height:1.4;">7 steps — root, spine, hips, floor tension, bow</div>`;
  if(t.activation) inner += `<div style="font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text3);margin:8px 0 3px;">${t.activation.title}</div>
    <div style="font-size:14px;padding:2px 0;line-height:1.4;">${t.activation.movements.map(m=>m.name).join(' &middot; ')}</div>`;
  t.blocks.forEach(b=>{
    inner += `<div style="font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text3);margin:8px 0 3px;">${b.label}${(b.core||b.gate)?' &middot; core':''}</div>`;
    b.exercises.forEach(exId=>{ const ex = EXERCISE_LIBRARY[exId]; inner += `<div style="font-size:14px;padding:2px 0;line-height:1.4;">${getVariationName(exId)} <span style="color:var(--text3);">${ex.repRange[0]}-${ex.repRange[1]} ${ex.unit} &times; ${ex.sets}</span></div>`; });
  });
  return `<div class="card"><details open><summary style="font-size:13px;color:var(--text2);cursor:pointer;list-style:none;font-weight:600;">Session preview</summary><div style="margin-top:6px;">${inner}</div></details></div>`;
}

// Session picker modal: lists all 5 ring-spine session types in rotation order with
// Default / Picked / Heavy anchor markers. Tapping the default clears the override;
// tapping a non-default sets it. Bypasses showModal's textContent body (uses innerHTML)
// because the picker needs structured rows with click handlers, not flat text.
function openSessionPicker(){
  const s = getState();
  const defaultType = getDefaultSessionType(s);
  const current = getEffectiveSessionType(s);
  const rows = ROTATION.map(type=>{
    const tpl = SESSION_TEMPLATES[type];
    const isDefault = type === defaultType;
    const isCurrent = type === current;
    const hasHeavyAnchor = tpl.blocks.some(b=> b.progressionType === 'heavyAnchor');
    const markers = [];
    if(isDefault) markers.push('<span style="font-size:10px;color:var(--accent);font-weight:700;letter-spacing:0.5px;">DEFAULT</span>');
    if(isCurrent && !isDefault) markers.push('<span style="font-size:10px;color:var(--warn);font-weight:700;letter-spacing:0.5px;">PICKED</span>');
    if(hasHeavyAnchor) markers.push('<span style="font-size:10px;color:var(--text3);font-weight:700;letter-spacing:0.5px;">HEAVY</span>');
    const markerHtml = markers.length ? ` &middot; ${markers.join(' &middot; ')}` : '';
    return `<div onclick="pickSessionFromModal('${type}')" style="padding:14px 12px;border-bottom:1px solid var(--border);cursor:pointer;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <div>
          <div style="font-size:15px;font-weight:600;">${tpl.name}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px;">${type}${markerHtml}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('modal-title').textContent = 'Pick a different day';
  const body = document.getElementById('modal-body');
  body.innerHTML = `<div style="font-size:13px;color:var(--text2);margin-bottom:12px;">After you log this workout, the rotation continues from that day.</div>
    <div style="margin:0 -16px;border-top:1px solid var(--border);">${rows}</div>`;
  document.getElementById('modal-actions').innerHTML = '<button class="btn btn-secondary" onclick="hideModal()">Cancel</button>';
  document.getElementById('modal').classList.add('visible');
}

function pickSessionFromModal(type){
  if(!isValidSessionType(type)){ hideModal(); return; }
  const s = getState();
  const defaultType = getDefaultSessionType(s);
  if(type === defaultType){
    clearSessionOverride();   // tapping default = clear override
  } else {
    setSessionOverride(type); // tapping non-default = set override
  }
  hideModal();
}

// Anchor scoreboard for Home (Chunk 3): per heavy anchor, a closing-in meter toward the
// next level plus last result + a warm verdict. The meter fills by creditedQualityReps
// (the banked figure the level-up triggers on), never raw — so it can't promise a
// level-up the engine won't grant; raw is shown alongside as the honest last result.
function renderAnchorScoreboard(s){
  const ap = s.anchorProgress || {};
  let html = '';
  Object.keys(HEAVY_ANCHOR_SLOTS).forEach(slotId=>{
    const meta = HEAVY_ANCHOR_SLOTS[slotId];
    const prog = ap[slotId];
    if(!prog || (prog.lastRawQualityReps == null && prog.creditedQualityReps == null)) return; // nothing logged yet
    const ex = EXERCISE_LIBRARY[meta.exId];
    const top = ex.sets * ex.repRange[1];
    const loadStr = prog.externalLoad ? `+${prog.externalLoad}${prog.loadUnit||'lb'}` : '';
    const lastStr = (prog.lastRawQualityReps==null) ? '—' : `${prog.lastRawQualityReps} total`;
    const verdict = anchorVerdict(prog);

    // CLOSING-IN METER. Bar fills by creditedQualityReps (the banked figure the
    // level-up actually triggers on), NOT raw — so the bar never promises a
    // level-up the engine won't grant. Raw is shown alongside as the honest result.
    let meter;
    if(prog.creditedQualityReps === null){
      // Fresh load (just stepped up, or awaiting first baseline at a new load):
      // no credited figure to fill against. Show an empty 'baseline' track, not 0/top
      // (which would read like a regression).
      meter = `
        <div class="meter-track"><div class="meter-fill baseline" style="width:0%"></div></div>
        <div class="meter-caption">Set your baseline this session<span class="mc-sub">First clean session at the new load becomes the number to beat.</span></div>`;
    } else {
      const credited = Math.max(0, Math.min(prog.creditedQualityReps, top));
      const pct = Math.round((credited / top) * 100);
      const remaining = Math.max(0, top - credited);
      const caption = remaining === 0
        ? `Top owned — load goes up next session.`
        : `You're ${remaining} rep${remaining===1?'':'s'} from leveling this up.`;
      meter = `
        <div class="meter-track"><div class="meter-fill" style="width:${pct}%"></div></div>
        <div class="meter-caption">${credited} / ${top} banked toward the next level<span class="mc-sub">${caption}</span></div>`;
    }

    html += `
      <div class="anchor-card">
        <div class="ac-top"><span class="ac-label">${meta.label}</span>${loadStr?`<span class="ac-load">${loadStr}</span>`:''}</div>
        <div class="ac-last">Last session: <strong>${lastStr}</strong></div>
        ${meter}
        ${verdict?`<div class="meter-caption" style="font-weight:400;color:var(--text2);margin-top:9px;">${verdict}</div>`:''}
      </div>`;
  });
  return html;
}
function discardActiveSession(){
  showModal('Discard session?', 'The in-progress session will be deleted. Completed history is not affected.', [
    { text:'Keep', cls:'btn-secondary', action:()=>hideModal() },

  ]);
}

function renderHistory(){
  const s = getState();
  if(!s.log.length){ document.getElementById('history-content').innerHTML = `<div class="empty"><div class="empty-icon">&#128203;</div>No sessions yet.<br>Complete your first session to see history.</div>`; return; }
  const total = s.log.length;
  const html = [...s.log].reverse().map((entry, revIdx)=>{
    const logIdx = total - 1 - revIdx;   // true index into state.log (list is reversed for display)
    const t = SESSION_TEMPLATES[entry.sessionType];
    const hitCount = entry.exercises ? Object.entries(entry.exercises).filter(([id,r])=>checkHit(id,r)).length : 0;
    const totalEx = entry.exercises ? Object.keys(entry.exercises).length : 0;
    let detail = '';
    if(entry.exercises) Object.entries(entry.exercises).forEach(([exId,reps])=>{ const ex = EXERCISE_LIBRARY[exId]; detail += `<div class="history-exercise">${checkHit(exId,reps)?'&#9632;':'&#9633;'} ${ex?ex.name:exId}: <span>${reps.join(', ')}</span></div>`; });
    if(entry.skipped) entry.skipped.forEach(exId=>{ const ex = EXERCISE_LIBRARY[exId]; detail += `<div class="history-exercise" style="color:var(--text3);">&#8212; ${ex?ex.name:exId}: <span>skipped</span></div>`; });
    if(entry.issues) entry.issues.forEach(it=>{ detail += `<div class="history-exercise" style="color:var(--warn);">! ${it.note}</div>`; });
    if(entry.notes) detail += `<div style="font-size:12px;color:var(--text2);margin-top:8px;font-style:italic;">“${entry.notes}”</div>`;
    const stat = entry.sessionStatus || 'completed';
    return `<div class="history-item" onclick="this.classList.toggle('expanded')">
      <div class="history-date">${formatDate(entry.date)}${entry.duration?' &middot; '+entry.duration+' min':''}</div>
      <div class="history-type"><span class="badge badge-${entry.sessionType.toLowerCase()}">${entry.sessionType}</span> ${t?t.name:''}<span class="status-chip status-${stat}">${stat}</span>${entry.coreComplete && stat !== 'completed' ? '<span style="font-size:10px;color:var(--accent);margin-left:6px;">core done</span>' : ''}</div>
      <div class="history-hits">${hitCount}/${totalEx} HITs${entry.skipped&&entry.skipped.length?' &middot; '+entry.skipped.length+' skipped':''}</div>
      <div class="history-detail">${detail}<button class="btn btn-small btn-danger" style="margin-top:12px;" onclick="event.stopPropagation(); confirmDeleteSession(${logIdx})">Delete this session</button></div>
    </div>`;
  }).join('');
  document.getElementById('history-content').innerHTML = html;
}
// ===================================================================
// HISTORY DELETE + SCOREBOARD REBUILD (Option B)
// ===================================================================
// Deleting a session must keep the anchor scoreboard in sync with the log. Option B:
// remove the entry, then REBUILD anchorProgress from scratch by replaying the remaining
// log in order through the same engine finalize uses. This keeps log<->scoreboard parity
// exactly (no drift), at the cost of recomputing — correct while the engine numbers are
// still being graded against real history.
//
// Replay rule (v3 gate, 2026-08-16) MUST match finalize's scoring gate: EVERY entry
// replays — session end-state no longer gates scoring. applyAnchorProgressionV2's own
// guards handle everything else: entries without a performed[] array (pre-engine
// sessions) no-op; skipped or incomplete anchor sets don't score. Never filter on
// progressionEngineVersion — only on entry shape, which the engine already checks.
// Rotation and the picker override are NEVER touched here (scoreboard replay only).
function rebuildAnchorProgress(state){
  state.anchorProgress = {};
  state.log.forEach(entry=>{
    if(!entry) return;
    applyAnchorProgressionV2(state, entry);   // engine guards handle the rest (incl. no performed[])
  });
}

// Delete one log entry by its true index into state.log, then rebuild the scoreboard.
// Single saveState (build the whole next state, then write once), then re-render History.
function deleteLogEntry(logIdx){
  const s = getState();
  if(!Array.isArray(s.log) || logIdx < 0 || logIdx >= s.log.length) return; // stale index guard
  const removed = s.log[logIdx];
  // Queue a soft-delete tombstone so the Notion mirror marks the row Deleted on next push.
  // Queue regardless of prior sync status: a tombstone for a never-synced id is a harmless
  // no-op server-side (query finds nothing), and this guarantees the mirror can't drift.
  if(removed && removed.sessionId){
    if(!Array.isArray(s.pendingDeletes)) s.pendingDeletes = [];
    if(!s.pendingDeletes.includes(removed.sessionId)) s.pendingDeletes.push(removed.sessionId);
  }
  s.log.splice(logIdx, 1);
  rebuildAnchorProgress(s);
  saveState(s);
  hideModal();
  renderHistory();
  pushUnsynced();   // fire-and-forget: drain the tombstone (and any other pending) now
}

// Confirmation modal for deleting a history entry. Names the date + session so the user
// knows exactly what's going away, and warns that the scoreboard recalculates (Option B is
// a stronger action than deleting the log row alone).
function confirmDeleteSession(logIdx){
  const s = getState();
  const entry = s.log[logIdx];
  if(!entry) return;
  const t = SESSION_TEMPLATES[entry.sessionType];
  const name = t ? t.name : entry.sessionType;
  showModal('Delete this session?',
    `${formatDate(entry.date)} — ${name}. This removes it from history and recalculates your scoreboard from your remaining sessions. This can’t be undone.`,
    [
      { text:'Cancel', cls:'btn-secondary', action:()=>hideModal() },
      { text:'Delete', cls:'btn-danger', action:()=>deleteLogEntry(logIdx) }
    ]);
}

function formatDate(ds){ const d = new Date(ds+'T12:00:00'); return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}, ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]} ${d.getDate()}`; }

    { label:'Lower: Squat + Conditioning', ids:['cossack-squat','step-lunge','calf-raise'] },
    { label:'Ring Practice + Whole-body', ids:['ring-face-pull','db-press','para-pushup','hanging-knee-raise'] },
    { label:'Floor day (MVS)', ids:['pushup','reverse-lunge','hollow-body'] },
    { label:'Other / Bench', ids:['ring-curl','glute-bridge','jefferson-curl'] }
  ];
  let html = '';
  cats.forEach(cat=>{
    html += `<div class="block-label">${cat.label}</div>`;
    if(cat.form){
      FORM.screens.forEach((sc,i)=>{ html += `<div class="ref-exercise"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><div class="ref-name">${i+1}. ${sc.title}</div>${sc.reference ? `<button class="ref-btn" style="margin-top:0;" onclick="showFormRef(${i})">&#9654;</button>` : ''}</div><div class="ref-ladder">${sc.breath || sc.movements.map(m=>m.name).join(' &middot; ')}</div></div>`; });
      return;
    }
    cat.ids.forEach(exId=>{
      const ex = EXERCISE_LIBRARY[exId]; if(!ex) return; const i = getCurrentVariation(exId);
      const ladder = ex.ladder.map((v,idx)=>{ if(idx===i) return `<span class="ref-current">${v}</span>`; if(idx<i) return `<span style="text-decoration:line-through;color:var(--text3);">${v}</span>`; return `<span style="color:var(--text3);">${v}</span>`; }).join(' &#8594; ');
      // Anchor slots show their v2 scoreboard total; others just show the ladder (reference only).
      const apEntry = (exId==='ring-pullup' && s.anchorProgress) ? s.anchorProgress['RP_anchor_ring-pullup']
                    : (exId==='ring-pushup' && s.anchorProgress) ? s.anchorProgress['RPush_anchor_ring-pushup'] : null;
      const anchorTag = (apEntry && apEntry.lastRawQualityReps!=null) ? ` &middot; <span style="color:var(--accent);">${apEntry.lastRawQualityReps} total${apEntry.externalLoad?` +${apEntry.externalLoad}${apEntry.loadUnit||'lb'}`:''}</span>` : '';
      html += `<div class="ref-exercise"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;"><div class="ref-name">${ex.name} <span style="color:var(--text3);font-size:12px;font-weight:400;">${ex.repRange[0]}-${ex.repRange[1]} ${ex.unit} &times; ${ex.sets}</span>${anchorTag}</div></div><div class="ref-ladder">${ladder}</div></div>`;
    });
  });
  document.getElementById('reference-content').innerHTML = html;
}

// ===================================================================
// SETTINGS
// ===================================================================
function renderSettings(){
  const s = getState();
  const log = s.log || [];
  const pendingCount = log.filter(e => !e.notionSync || e.notionSync.status !== 'synced').length + (Array.isArray(s.pendingDeletes) ? s.pendingDeletes.length : 0);
  const failedCount = log.filter(e => e.notionSync && e.notionSync.status === 'failed').length;
  const lastSynced = log.map(e => e.notionSync && e.notionSync.syncedAt).filter(Boolean).sort().slice(-1)[0];
  const lastSyncedDisplay = lastSynced ? new Date(lastSynced).toLocaleString() : 'Not yet';
  const syncStatusText = pendingCount === 0 ? (log.length ? 'All sessions synced' : 'No sessions yet') : `${pendingCount} pending${failedCount ? ` (${failedCount} failed)` : ''}`;
  const soundOn = soundEnabled();
  document.getElementById('settings-content').innerHTML = `
    <div class="block-label" style="margin-top:8px;">Sound cues</div>
    <div class="card">
      <div class="setting-row">
        <div><div style="font-weight:600;">Cue sounds</div><div style="font-size:12px;color:var(--text2);">Short tones for timers and saved actions</div></div>
        <button class="btn btn-small ${soundOn?'btn-primary':'btn-secondary'}" onclick="toggleSound()">${soundOn?'On':'Off'}</button>
      </div>
      <div style="font-size:12px;color:var(--text3);margin-top:8px;">Audio cues only play when your phone's silent switch is off.</div>
    </div>
    <div class="block-label">Your data</div>
    <div class="card">
      <div class="setting-row"><div><div style="font-weight:600;">Export data</div><div style="font-size:12px;color:var(--text2);">Download full log as JSON</div></div><button class="btn btn-small btn-secondary" onclick="exportData()">Export</button></div>
    </div>
    <details style="margin-top:14px;">
      <summary style="font-size:13px;color:var(--text3);cursor:pointer;font-weight:600;padding:4px 0;">Advanced</summary>
      <div class="card" style="margin-top:8px;">
        <div style="font-weight:700;margin-bottom:8px;">Notion sync</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:4px;">${syncStatusText}</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:8px;">Last synced: ${lastSyncedDisplay}</div>
        <button class="btn btn-small btn-secondary" onclick="pushUnsynced()">Retry sync</button>
      </div>
      <div class="card" style="margin-top:8px;">
        <div class="setting-row"><div><div style="font-weight:600;">Import data</div><div style="font-size:12px;color:var(--text2);">Restore from a backup</div></div><button class="btn btn-small btn-secondary" onclick="document.getElementById('import-file').click()">Import</button><input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)"></div>
        <div class="setting-row"><div><div style="font-weight:600;">Reset rotation</div><div style="font-size:12px;color:var(--text2);">Next session back to Heavy Rings: Pull</div></div><button class="btn btn-small btn-secondary" onclick="confirmResetRotation()">Reset</button></div>
        <div class="setting-row"><div><div style="font-weight:600;color:#ef4444;">Erase all data</div><div style="font-size:12px;color:var(--text2);">Permanently delete everything</div></div><button class="btn btn-small btn-danger" onclick="confirmErase()">Erase</button></div>
      </div>
    </details>
    <div class="card" style="margin-top:12px;"><div style="font-size:13px;color:var(--text3);"><strong>Build</strong>: ${BUILD_ID} · data ${window.TRAIN_DATA_VERSION} · ${s.log.length} sessions</div></div>`;
}
function toggleSound(){ setSoundEnabled(!soundEnabled()); renderSettings(); }
function exportData(){ const s = getState(); const blob = new Blob([JSON.stringify(s,null,2)],{type:'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=`train-backup-${new Date().toISOString().split('T')[0]}.json`; a.click(); URL.revokeObjectURL(url); }
function importData(ev){ const f = ev.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = e=>{ try { const data = JSON.parse(e.target.result); if(data.log && Array.isArray(data.log)){ showModal('Import data?', `Replace current data with ${data.log.length} sessions from the backup?`, [ {text:'Cancel',cls:'btn-secondary',action:()=>hideModal()}, {text:'Import',cls:'btn-primary',action:()=>{ saveState(migrate(data)); hideModal(); renderSettings(); showScreen('home'); }} ]); } else alert('Invalid backup file.'); } catch(err){ alert('Could not read file.'); } }; r.readAsText(f); }
function confirmResetRotation(){ showModal('Reset rotation?', 'The next session returns to Heavy Rings: Pull. Session history is not changed.', [ {text:'Cancel',cls:'btn-secondary',action:()=>hideModal()}, {text:'Reset',cls:'btn-danger',action:()=>{ hideModal(); resetRotation(); }} ]); }
function resetRotation(){ const s = getState(); s.rotationIndex = 0; saveState(s); renderSettings(); }
function confirmErase(){ showModal('Erase all data?', 'Permanently deletes all sessions, promotions, and progression. Cannot be undone.', [ {text:'Cancel',cls:'btn-secondary',action:()=>hideModal()}, {text:'Erase everything',cls:'btn-danger',action:()=>{ localStorage.removeItem('train_state'); AS=null; hideModal(); showScreen('home'); }} ]); }

// ===================================================================
// MODAL
// ===================================================================
function showModal(title, body, buttons, opts){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent = body;
  const act = document.getElementById('modal-actions');
  if(act.classList && act.classList.toggle) act.classList.toggle('stack', !!(opts && opts.stack));
  act.innerHTML = buttons.map(b=>`<button class="btn ${b.cls}" id="mb-${b.text.replace(/\s/g,'')}">${b.text}</button>`).join('');
  buttons.forEach(b=>{ const el = document.getElementById('mb-'+b.text.replace(/\s/g,'')); if(el) el.onclick = b.action; });
  document.getElementById('modal').classList.add('visible');
}
function hideModal(){ document.getElementById('modal').classList.remove('visible'); var mb = document.getElementById('modal-body'); if(mb) mb.innerHTML = ''; }

// ===================================================================
// INIT
// ===================================================================
document.addEventListener('DOMContentLoaded', async ()=>{
  renderHome();
  // Mirror to Notion in the background: drains pending tombstones and pushes any unsynced
  // sessions oldest-first (this is what backfills existing history on first launch). Never
  // blocks the UI; the indicator reflects progress.
  refreshSyncIndicator();
  pushUnsynced();
});

// Re-sync timer display when returning to the app (handles backgrounding/lock).
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && currentScreen === 'session' && AS && AS.timerEnd){
    if(Date.now() >= AS.timerEnd){
      const kind = AS.timerKind; stopTimerLoop();
      if(kind === 'work') onWorkTimerComplete(); else if(kind === 'rest') onRestTimerComplete();
    } else { startTimerLoop(); }
  }
});

// Prevent pull-to-refresh except inside scrollable areas.
document.body.addEventListener('touchmove', function(e){ if(e.target.closest('.scroll') || e.target.closest('.flow-body')) return; e.preventDefault(); }, { passive:false });
</script>
