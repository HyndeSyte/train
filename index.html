        ${sc.movements.map(m=>`<div style="margin-bottom:10px;"><div style="font-size:14px;font-weight:600;margin-bottom:3px;">${m.name}</div><div style="font-size:13px;color:var(--text2);line-height:1.5;">${m.detail}</div></div>`).join('')}
        ${sc.reference ? `<button class="ref-btn" onclick="showFormRef(${i})">&#9654; Demo</button>` : ''}
      </div>
    </details>`).join('');
  // v7.3: the Form is unchanged in recovery mode; the Arms up and Hands rules ride on top.
  const recoveryNote = AS.mode === 'recovery'
    ? `<div class="recovery-note">Recovery mode: reaches go only as high as PT&rsquo;s rule allows, up to tingling and never into it. On hands and knees, use fists or forearms, not flat palms.</div>`
    : '';
  body.innerHTML = `
    <div style="font-size:12px;color:var(--text3);margin-bottom:6px;">Coming up: ${nextFlowItemLabel()}</div>
    <div class="flow-meta"><span class="badge badge-form">Form</span></div>
    ${recoveryNote}
    <div style="margin-top:6px;">${steps}</div>
    <div style="font-size:11px;color:var(--text3);margin-top:10px;">Tap a step for how-to and demo.</div>`;
  const foot = document.getElementById('flow-foot');
  const nxt = currentFlow()[AS.cursor + 1];
  const label = (nxt && nxt.kind === 'activation') ? 'Continue' : 'Begin Training';
  foot.innerHTML = `
    <button class="btn btn-primary" onclick="advanceForm()">${label}</button>
    <div class="flow-actions-row">
      <button class="mini-btn" onclick="skipFormScreen()">Skip Form</button>
      <button class="mini-btn warn" onclick="confirmStopSession()">Stop</button>
    </div>`;
}
// Demo modal for a Form step: embedded video, or an open-in-browser card for page links.
function showFormRef(idx){
  const sc = FORM.screens[idx]; if(!sc || !sc.reference) return;
  const ref = sc.reference;
  let html = sc.breath ? `<div style="font-size:13px;color:var(--text2);font-style:italic;margin-bottom:10px;">${sc.breath}</div>` : '';
  if(ref.status === 'video'){
    const u = buildEmbedUrl(ref);
    if(u) html += `<div style="position:relative;width:100%;padding-bottom:56.25%;background:#000;border-radius:8px;overflow:hidden;"><iframe src="${u}" style="position:absolute;inset:0;width:100%;height:100%;border:0;" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
    if(ref.fallbackUrl) html += `<div style="margin-top:8px;"><a href="${ref.fallbackUrl}" target="_blank" rel="noopener" style="font-size:12px;color:var(--text2);">Not loading? Open source ↗</a></div>`;
    if(ref.sourceLabel) html += `<div style="font-size:11px;color:var(--text3);margin-top:6px;">Source: ${ref.sourceLabel}</div>`;
  } else if(ref.status === 'link' && ref.url){
    html += `<a href="${ref.url}" target="_blank" rel="noopener" style="display:block;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);text-decoration:none;font-size:14px;font-weight:600;">Open demo ↗<span style="display:block;font-size:12px;color:var(--text2);font-weight:400;margin-top:3px;">${ref.sourceLabel || ''}</span></a>`;
  }
  document.getElementById('modal-title').textContent = sc.title.replace(/&amp;/g,'&');
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-actions').innerHTML = '<button class="btn btn-secondary" onclick="hideModal()">Close</button>';
  document.getElementById('modal').classList.add('visible');
}
function advanceForm(){ unlockAudio(); const flow = currentFlow(); const st = flow[AS.cursor]; if(!AS.records[st.uid]) AS.records[st.uid] = { kind: st.kind, status:'pending' }; AS.records[st.uid].status = 'done'; AS.cursor++; AS.phase='view'; AS.setIdx=0; persistAS(); renderStation(); }
function skipFormScreen(){ cueNoted(); const flow = currentFlow(); const st = flow[AS.cursor]; if(!AS.records[st.uid]) AS.records[st.uid] = { kind: st.kind, status:'pending' }; AS.records[st.uid].status = 'skipped'; AS.cursor++; AS.phase='view'; AS.setIdx=0; persistAS(); renderStation(); }

// ---- EXERCISE STATION ----
function renderExerciseStation(st){
  const ex = EXERCISE_LIBRARY[st.exId];
  // v7.3 frozen flows: a session frozen by migrate() could in principle reach an item with
  // no record yet; give it a fresh one rather than failing to render.
  if(!AS.records[st.uid]) AS.records[st.uid] = { kind:'exercise', exId:st.exId, sets:new Array(st.sets || ex.sets).fill(0), setStatus:new Array(st.sets || ex.sets).fill('pending'), status:'pending', issueFlag:'none', note:'', quality:'unknown', painFree:'unknown' };
  const rec = AS.records[st.uid];
  const varName = getVariationName(st.exId);
  const isDur = isDurationUnit(ex.unit);
  const top = ex.repRange[1];
  const body = document.getElementById('flow-body');
  const foot = document.getElementById('flow-foot');

  // set pills
  const pills = rec.sets.map((v,i)=>{
    let cls = 'set-pill';
    if(rec.setStatus[i] === 'skipped') cls += ' skipped';
    else if(rec.setStatus[i] === 'done'){ cls += (v >= top && v > 0) ? ' hit' : ' done'; }
    if(i === AS.setIdx && AS.phase !== 'rest') cls += ' current';
    const label = rec.setStatus[i] === 'skipped' ? '–' : (rec.setStatus[i] === 'done' ? v : (i+1));
    return `<div class="${cls}">${label}</div>`;
  }).join('');

  const showLookahead = (AS.phase === 'view' || AS.phase === 'ready' || AS.phase === 'log' || AS.phase === 'work' || AS.phase === 'workPaused');
  const head = `
    ${showLookahead ? `<div style="font-size:12px;color:var(--text3);margin-bottom:6px;">Coming up: ${nextFlowItemLabel()}</div>` : ''}
    <div class="flow-meta">
      <span class="badge badge-${AS.type.toLowerCase()}">${st.blockLabel}</span>
      Set ${Math.min(AS.setIdx+1, setsFor(st))} of ${setsFor(st)}
    </div>
    <div class="flow-title">${varName}</div>
    <div class="flow-sub">${ex.name} &middot; ${ex.openReps ? openRepsLabel(ex).toLowerCase() : `target ${repSpan(ex)} ${ex.unit}`}</div>
    <div class="set-pills">${pills}</div>`;
  const recLines = recoveryStationLines(st, ex);
  const symBtn = symptomStopButton();

  if(AS.phase === 'restComplete'){
    // Terminal rest state: timer hit zero, GO already played. Wait for the user.
    body.innerHTML = head + `
      <div class="statebig-rc">Rest complete</div>
      <div class="exercise-note" style="text-align:center;">Next: ${restNextLabel(st, ex)}</div>${thenLine(ex)}`;
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="startNextAfterRest()">Start Next Set</button>
      <div class="flow-actions-row">
        <button class="mini-btn" onclick="redoLastSet()">Redo last set</button>
        <button class="mini-btn" onclick="noteIssue()">Note</button>
        <button class="mini-btn warn" onclick="confirmStopSession()">Stop</button>
      </div>${symBtn}`;
    return;
  }

  if(AS.phase === 'rest' || AS.phase === 'restPaused'){
    const paused = AS.phase === 'restPaused';
    // Rest timer view (chains after a logged/duration set)
    body.innerHTML = head + `
      <div class="timer-phase">${paused ? 'Rest paused' : 'Rest'}</div>
      <div class="timer-big rest" id="timer-display">${paused ? fmtRemaining() : '--'}</div>
      <div class="exercise-note">Next: ${restNextLabel(st, ex)}</div>${thenLine(ex)}`;
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="endRestNow()">Skip rest → Next</button>
      <div class="flow-actions-row">
        <button class="mini-btn" onclick="${paused ? 'resumeTimer()' : 'pauseTimer()'}">${paused ? 'Resume' : 'Pause'}</button>
        <button class="mini-btn" onclick="noteIssue()">Note issue</button>
        <button class="mini-btn warn" onclick="confirmStopSession()">Stop</button>
      </div>${symBtn}`;
    if(!paused) startTimerLoop();
    return;
  }

  if(isDur && (AS.phase === 'work' || AS.phase === 'workPaused')){
    const paused = AS.phase === 'workPaused';
    body.innerHTML = head + `
      <div class="timer-phase">${paused ? 'Paused' : 'Hold'}</div>
      <div class="timer-big work" id="timer-display">${paused ? fmtRemaining() : '--'}</div>
      <div class="exercise-note">${refCue(ex)}</div>`;
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="${paused ? 'resumeTimer()' : 'pauseTimer()'}">${paused ? 'Resume' : 'Pause'}</button>
      <div class="flow-actions-row">
        <button class="mini-btn" onclick="finishDurationEarly()">End set early</button>
        <button class="mini-btn" onclick="skipCurrentSet()">Skip set</button>
        <button class="mini-btn warn" onclick="confirmStopSession()">Stop</button>
      </div>${symBtn}`;
    if(!paused) startTimerLoop();
    return;
  }

  // phase === 'view' / 'ready' / 'log'
  if(isDur){
    // duration set ready
    body.innerHTML = head + `
      <div class="target-pill">Hold for ${top} ${ex.unit}</div>
      <div class="exercise-note">${refCue(ex)}</div>
      <button class="ref-btn" onclick="showRef('${st.exId}')">&#9654; Reference</button>${recLines}`;
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="startDurationSet()">Start hold</button>
      <div class="flow-actions-row">
        <button class="mini-btn" onclick="skipCurrentSet()">Skip set</button>
        <button class="mini-btn" onclick="skipExercise()">Skip exercise</button>
        <button class="mini-btn warn" onclick="confirmStopSession()">Stop</button>
      </div>${symBtn}`;
  } else {
    // rep set ready/log
    const cur = rec.sets[AS.setIdx] || '';
    body.innerHTML = head + `
      <div class="target-pill">${ex.openReps ? openRepsLabel(ex) : `Target ${repSpan(ex)} ${ex.unit}`}</div>
      ${st.blockType === 'power' ? '<div style="font-size:12px;color:var(--text2);text-align:center;margin-bottom:6px;">Crisp, not max. Stop the set when a rep gets sloppy.</div>' : `<div style="font-size:12px;color:var(--text2);text-align:center;margin-bottom:6px;">Stop ${cardioCapOn(getState()) ? '2–3' : '1–3'} reps short of failure.</div>`}
      <input class="rep-input-big" id="rep-input" type="number" inputmode="numeric" pattern="[0-9]*" value="${cur}" placeholder="0" onfocus="this.select()">
      <div class="exercise-note">${refCue(ex)}</div>
      <button class="ref-btn" onclick="showRef('${st.exId}')">&#9654; Reference</button>${recLines}`;
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="logRepSet()">Log set</button>
      <div class="flow-actions-row">
        <button class="mini-btn" onclick="skipCurrentSet()">Skip set</button>
        <button class="mini-btn" onclick="skipExercise()">Skip exercise</button>
        <button class="mini-btn warn" onclick="confirmStopSession()">Stop</button>
      </div>${symBtn}`;
  }
}

function nextFlowItemLabel(){
  const flow = currentFlow();
  const next = flow[nextLiveIndex(AS.cursor + 1)];
  if(!next) return 'Finish';
  if(next.kind === 'form') return next.variant === 'opener' ? 'Opener' : 'Form';
  if(next.kind === 'activation') return (currentTpl().activation || {}).title || 'Prep';
  return getVariationName(next.exId);
}

function restNextLabel(st, ex){
  // What comes after this rest?
  if(AS.setIdx + 1 < setsFor(st)) return `${getVariationName(st.exId)} — set ${AS.setIdx + 2}`;
  const flow = currentFlow();
  const next = flow[nextLiveIndex(AS.cursor + 1)];
  if(!next) return 'Finish session';
  if(next.kind === 'form') return next.variant === 'opener' ? 'Opener' : 'Form';
  if(next.kind === 'activation') return (currentTpl().activation || {}).title || 'Prep';
  return getVariationName(next.exId);
}
// The exercise AFTER this one — shown during between-set rests (2026-06-03 note).
function thenLine(ex){
  if(AS.setIdx + 1 >= setsFor(currentFlow()[AS.cursor])) return '';
  return `<div style="font-size:12px;color:var(--text3);text-align:center;margin-top:4px;">Then: ${nextFlowItemLabel()}</div>`;
}

// ---- RECOVERY STATION AIDS (v7.3) ----
function openRepsLabel(ex){ return 'Open reps' + (String(ex.unit).indexOf('/side') !== -1 ? ' per side' : ''); }
// Under a recovery exercise: last time's numbers (reps first, then angle), the one-rung
// reminder after a symptom stop, the worse-day hold, and PT's rule with the effort cap.
function recoveryStationLines(st, ex){
  if(!AS) return '';
  const s = getState();
  const capOn = cardioCapOn(s);
  const capText = isDurationUnit(ex.unit) ? 'end the hold well before your limit' : 'two reps short of failure';
  if(AS.mode !== 'recovery'){
    return capOn ? `<div class="recovery-lines">Until cardiology clears: ${capText}.</div>` : '';
  }
  const lines = [];
  const last = lastPerformance(s, st.exId);
  if(last && last.symptomStop) lines.push('<span style="color:var(--warn);">Last time this crossed PT&rsquo;s line: one rung easier today.</span>');
  else if(last && last.reps.length) lines.push(`Last time: ${last.reps.join(' &middot; ')}`);
  if(AS.armCheck === 'worse') lines.push('Arm check says worse: no progression today.');
  lines.push(`Up to tingling, never into it${capOn ? ' &middot; ' + capText : ''}.`);
  return `<div class="recovery-lines">${lines.join('<br>')}</div>`;
}
function symptomStopButton(){
  if(!AS || AS.mode !== 'recovery') return '';
  return `<button class="mini-btn warn symptom-btn" onclick="openSymptomStop()">Symptom stop</button>`;
}

// ---- SYMPTOM STOP (v7.3): PT's rule, crossing it. ----
// First crossing: stop that exercise for today (its gate slot still counts); next time it
// shows "one rung easier". A second crossing, or symptoms that linger, end the arm work:
// a ring day stops there, a leg day finishes the legs. Either way the session counts
// complete, so a bad day never stalls the rotation.
function openSymptomStop(){
  if(!AS) return;
  const ringDay = RING_DAYS.indexOf(AS.type) !== -1;
  const second = Array.isArray(AS.symptomStops) && AS.symptomStops.length > 0;
  const endLabel = ringDay ? 'End arm work, session counts' : 'End arm work, finish the legs';
  const body = (second
      ? 'Second crossing this session: the arm work is done for today. '
      : 'Crossed PT’s line? Stop this exercise for today; next time it drops one rung. A second crossing, or symptoms that linger, end the arm work for today. ')
    + 'The session counts either way. New weakness, or numbness that doesn’t settle: call PT or a doctor promptly.';
  const buttons = second ? [
    { text: endLabel, cls:'btn-primary', action:()=>{ hideModal(); symptomEndArmWork(); } },
    { text:'Cancel', cls:'btn-secondary', action:()=>hideModal() }
  ] : [
    { text:'Stop this exercise', cls:'btn-primary', action:()=>{ hideModal(); symptomStopExercise(); } },
    { text: endLabel, cls:'btn-secondary', action:()=>{ hideModal(); symptomEndArmWork(); } },
    { text:'Cancel', cls:'btn-secondary', action:()=>hideModal() }
  ];
  showModal('Symptom stop', body, buttons, { stack:true });
}
// Close out an exercise record: sets not done become skipped. symptom=true marks the
// exercise stopped at PT's line (its gate slot counts; the log keeps the flag).
function closeOutRecord(rec, symptom){
  if(!rec) return;
  if(Array.isArray(rec.setStatus)){
    rec.setStatus = rec.setStatus.map(x=> x === 'done' ? x : 'skipped');
    rec.sets = rec.sets.map((v,i)=> rec.setStatus[i] === 'done' ? v : 0);
    rec.status = rec.setStatus.some(x=> x === 'done') ? 'done' : 'skipped';
  } else {
    rec.status = 'skipped';
  }
  if(symptom) rec.symptomStopped = true;
}
function symptomStopExercise(){
  if(!AS) return;
  stopTimerLoop(); clearTimerState();
  const flow = currentFlow(); const st = flow[AS.cursor];
  if(!st){ renderStation(); return; }
  if(!AS.records[st.uid]) AS.records[st.uid] = { kind: st.kind, status:'pending' };
  closeOutRecord(AS.records[st.uid], true);
  AS.symptomStops = (AS.symptomStops || []).concat([st.exId || st.kind]);
  AS.issues.push({ exId: st.exId || null, note: 'Symptom stop: crossed PT’s line' });
  cueNoted();
  AS.cursor++; AS.setIdx = 0; AS.phase = 'view';
  maybeEnterCoreFork();
  persistAS();
  renderStation();
}
function symptomEndArmWork(){
  if(!AS) return;
  const flow = currentFlow(); const st = flow[AS.cursor];
  AS.symptomStop = true;
  AS.issues.push({ exId: (st && st.exId) || null, note: 'Symptom stop: arm work ended for today' });
  cueNoted();
  if(RING_DAYS.indexOf(AS.type) !== -1){
    // Ring day: stop there. The current exercise closes as-is; the session counts complete.
    stopTimerLoop(); clearTimerState();
    if(st && AS.records[st.uid]) closeOutRecord(AS.records[st.uid], true);
    AS.cursor = flow.length; AS.setIdx = 0; AS.phase = 'view';
  } else {
    // Leg day: finish the legs. An arm item in progress closes now; later ones are passed over.
    AS.armWorkEnded = true;
    if(st && st.kind === 'exercise' && st.arms){
      stopTimerLoop(); clearTimerState();
      closeOutRecord(AS.records[st.uid], true);
      AS.cursor++; AS.setIdx = 0; AS.phase = 'view';
    }
  }
  persistAS();
  renderStation();
}

// ---- rep set ----
function logRepSet(){
  unlockAudio();
  const flow = currentFlow(); const st = flow[AS.cursor]; const ex = EXERCISE_LIBRARY[st.exId]; const rec = AS.records[st.uid];
  const input = document.getElementById('rep-input');
  const val = parseInt(input && input.value, 10) || 0;
  rec.sets[AS.setIdx] = val;
  rec.setStatus[AS.setIdx] = 'done';
  cueLogged();
  beginRestOrAdvance(st, ex, rec);
}

// ---- duration set ----
function startDurationSet(){
  unlockAudio();
  const flow = currentFlow(); const st = flow[AS.cursor]; const ex = EXERCISE_LIBRARY[st.exId];
  AS.phase = 'work';
  AS.timerKind = 'work';
  AS.timerEnd = Date.now() + ex.repRange[1]*1000;
  cueStarted();
  persistAS();
  renderStation();
}
function finishDurationEarly(){
  const flow = currentFlow(); const st = flow[AS.cursor]; const ex = EXERCISE_LIBRARY[st.exId]; const rec = AS.records[st.uid];
  const elapsed = Math.max(1, ex.repRange[1] - Math.max(0, Math.round((AS.timerEnd - Date.now())/1000)));
  stopTimerLoop();
  rec.sets[AS.setIdx] = elapsed;
  rec.setStatus[AS.setIdx] = 'done';
  clearTimerState();
  cueLogged();
  beginRestOrAdvance(st, ex, rec);
}
function onWorkTimerComplete(){
  const flow = currentFlow(); const st = flow[AS.cursor]; const ex = EXERCISE_LIBRARY[st.exId]; const rec = AS.records[st.uid];
  rec.sets[AS.setIdx] = ex.repRange[1]; // full hold achieved
  rec.setStatus[AS.setIdx] = 'done';
  cueRelease();
  clearTimerState();
  beginRestOrAdvance(st, ex, rec);
}

function beginRestOrAdvance(st, ex, rec){
  const restSec = REST_TIMES[st.blockType] || 0;
  // If there are more sets or another station, run a rest timer; otherwise advance.
  const moreSets = AS.setIdx + 1 < setsFor(st);
  const flow = currentFlow();
  const moreStations = nextLiveIndex(AS.cursor + 1) < flow.length;
  if(restSec > 0 && (moreSets || moreStations)){
    AS.phase = 'rest';
    AS.timerKind = 'rest';
    AS.timerEnd = Date.now() + restSec*1000;
    persistAS();
    renderStation();
  } else {
    advanceAfterSet();
  }
}
// Clears every timer-related field. Used on every path that leaves a work/rest
// timer so stale paused-remaining time can never resurface in a later phase.
function clearTimerState(){ AS.timerEnd = null; AS.timerKind = null; AS.timerRemaining = null; }
function endRestNow(){ stopTimerLoop(); clearTimerState(); advanceAfterSet(); }
// Pause/resume for work and rest timers. Stores remaining ms so the absolute
// timerEnd can be rebuilt on resume (survives the wall-clock model).
function fmtRemaining(){
  const ms = (AS && AS.timerRemaining != null) ? AS.timerRemaining
           : (AS && AS.timerEnd ? Math.max(0, AS.timerEnd - Date.now()) : 0);
  const sec = Math.max(0, Math.round(ms/1000));
  return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
}
function pauseTimer(){
  if(!AS || !AS.timerEnd) return;
  stopTimerLoop();
  AS.timerRemaining = Math.max(0, AS.timerEnd - Date.now());
  AS.timerEnd = null;
  AS.phase = (AS.phase === 'rest') ? 'restPaused' : 'workPaused';
  persistAS();
  renderStation();
}
function resumeTimer(){
  if(!AS || AS.timerRemaining == null) return;
  AS.timerEnd = Date.now() + AS.timerRemaining;
  AS.timerRemaining = null;
  AS.phase = (AS.phase === 'restPaused') ? 'rest' : 'work';
  persistAS();
  renderStation();
}
// User-tapped advance from the terminal restComplete state.
function startNextAfterRest(){ unlockAudio(); advanceAfterSet(); }
// Rest timer expiring must NOT auto-advance. Play GO and wait for the user's tap.
function onRestTimerComplete(){ cueGo(); clearTimerState(); AS.phase='restComplete'; persistAS(); renderStation(); }

function advanceAfterSet(){
  const flow = currentFlow(); const st = flow[AS.cursor]; const rec = AS.records[st.uid];
  if(AS.setIdx + 1 < setsFor(st)){
    AS.setIdx++; AS.phase = 'view';
  } else {
    rec.status = rec.setStatus.every(s=>s==='skipped') ? 'skipped' : 'done';
    AS.cursor++; AS.setIdx = 0; AS.phase = 'view';
    maybeEnterCoreFork();
  }
  persistAS();
  renderStation();
}

function redoLastSet(){
  stopTimerLoop();
  const flow = currentFlow(); const st = flow[AS.cursor]; const rec = AS.records[st.uid];
  rec.sets[AS.setIdx] = 0; rec.setStatus[AS.setIdx] = 'pending';
  AS.phase = 'view'; clearTimerState();
  persistAS();
  renderStation();
}

function skipCurrentSet(){
  cueNoted();
  stopTimerLoop();
  const flow = currentFlow(); const st = flow[AS.cursor]; const rec = AS.records[st.uid];
  rec.sets[AS.setIdx] = 0; rec.setStatus[AS.setIdx] = 'skipped';
  clearTimerState();
  if(AS.setIdx + 1 < setsFor(st)){ AS.setIdx++; AS.phase='view'; persistAS(); renderStation(); }
  else { advanceAfterSet(); }
}

function skipExercise(){
  cueNoted();
  stopTimerLoop();
  const flow = currentFlow(); const st = flow[AS.cursor]; const rec = AS.records[st.uid];
  rec.setStatus = rec.setStatus.map(s=> s==='done' ? s : 'skipped');
  rec.sets = rec.sets.map((v,i)=> rec.setStatus[i]==='done' ? v : 0);
  rec.status = rec.setStatus.some(s=>s==='done') ? 'done' : 'skipped';
  clearTimerState();
  AS.cursor++; AS.setIdx = 0; AS.phase = 'view';
  maybeEnterCoreFork();
  persistAS();
  renderStation();
}

// The exercise's text cue, read from the reference schema (note field retired in the
// curation pass). Empty string if somehow absent — callers supply their own fallback.
function refCue(ex){ return (ex && ex.reference && ex.reference.cue) || ''; }

// Reference modal (v1 curation): cues-first, in-PWA. Renders the standalone form cue, an
// inline embedded clip when status==='video' (built from mediaType + videoId + start/end;
// loads paused, no autoplay dependency), a "not loading?" source fallback, engaged muscles
// as text, and a source label. status: 'text' (cue only, a complete state) | 'video' |
// 'broken' (degrades to cue + fallback). Muscle-highlight graphics intentionally deferred.
function buildEmbedUrl(ref){
  const id = ref.videoId;
  if(!id) return null;
  if(ref.mediaType === 'youtube'){
    let u = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?playsinline=1&rel=0&modestbranding=1';
    if(ref.start) u += '&start=' + ref.start;
    if(ref.end) u += '&end=' + ref.end;
    return u;
  }
  if(ref.mediaType === 'vimeo'){
    let u = 'https://player.vimeo.com/video/' + encodeURIComponent(id) + '?playsinline=1&title=0&byline=0&portrait=0';
    if(ref.start) u += '#t=' + ref.start + 's';
    return u;
  }
  return null;
}
function showRef(exId){

// Shared reference modal (library exercises and, since v7.4, PT's list items).

function noteIssue(){
  const flow = currentFlow(); const st = flow[AS.cursor]; const rec = AS.records[st.uid];
  const txt = prompt('Add a note for this set:', rec.note || '');
  if(txt === null) return;
  rec.note = txt.trim();
  rec.issueFlag = txt.trim() ? 'issue' : 'none';

// ---- TIMER LOOP (absolute-time based; survives backgrounding) ----
function startTimerLoop(){
  stopTimerLoop();
  const tick = ()=>{
    if(!AS || !AS.timerEnd){ return; }
    const remaining = Math.max(0, Math.round((AS.timerEnd - Date.now())/1000));
    const el = document.getElementById('timer-display');
    if(el){ const m = Math.floor(remaining/60), s = remaining%60; el.textContent = m + ':' + String(s).padStart(2,'0'); }
    if(remaining <= 0){
      stopTimerLoop();
      const kind = AS.timerKind;
      if(kind === 'work') onWorkTimerComplete();
      else if(kind === 'rest') onRestTimerComplete();
      return;
    }
    timerRAF = setTimeout(tick, 250);
  };
  tick();
}
function stopTimerLoop(){ if(timerRAF){ clearTimeout(timerRAF); timerRAF = null; } }

// ---- LEAVE / PARK / STOP / COMPLETE ----
function confirmStopSession(){
  // v7 leave sheet: Park primary (resumable, bounded, self-clearing); End & save = Stopped
  // (still counts + scores if core done); Discard destroys with no log entry.
  // v7.3: until cardiology clears hard efforts (either mode), the sheet carries the
  // warning signs (End & save is the action they call for).
  const s = getState();
  const cardiac = cardioCapOn(s)
    ? ' Chest pressure, unusual breathlessness, a racing or skipping heart, or light-headedness: End & save, then call cardiology; call 911 if it’s severe.'
    : '';
  showModal('Leave session?',
    'Park it and pick up where you left off — parks clear after tomorrow. Or end it now and save what’s done.' + cardiac,
    [
      { text:'Park through tomorrow', cls:'btn-primary',   action:()=>{ hideModal(); parkSession(); } },
      { text:'End & save',            cls:'btn-secondary', action:()=>{ hideModal(); finalizeSession('stopped'); } },
      { text:'Discard',               cls:'btn-danger',    action:()=>{ hideModal(); discardCurrentSession(); } },
      { text:'Cancel',                cls:'btn-secondary', action:()=>hideModal() }
    ], { stack:true });
}

// ---- PARK (v7): thin metadata on the already-resumable activeSession. Atomically
// freezes any live timer into the existing paused representation (timerRemaining), so a
// hold can never "complete" while parked. The bound is fixed from parkedAt — end of the
// FOLLOWING local day — and reopening the app never slides it. Expiry is lazy (no
// scheduler, no notification): enforced on the first Home render past the bound.
function endOfNextDay(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()+2); return d.getTime(); }
function parkSession(){
  if(!AS) return;
  stopTimerLoop();
  if(AS.timerEnd){
    AS.timerRemaining = Math.max(0, AS.timerEnd - Date.now());
    AS.timerEnd = null;
    AS.phase = (AS.phase === 'rest') ? 'restPaused' : (AS.phase === 'work') ? 'workPaused' : AS.phase;
  }
  markActive();                       // bank the segment, THEN freeze the clock
  AS.lastActiveAt = null;
  AS.parkedAt = Date.now();
  AS.parkExpiresAt = endOfNextDay(AS.parkedAt);
  persistAS();
  AS = null;
  showScreen('home');
}
// Finalize an expired park as-is (Completed iff core done), quietly. Returns true if it
// finalized — that path re-renders Home; the caller must stop rendering stale state.
function expireParkIfDue(){
  if(handoffActive()) return false;   // a handed-off copy writes nothing, not even an expiry
  const s = getState();
  const a = s.activeSession;
  if(a && a.parkedAt && a.parkExpiresAt && Date.now() > a.parkExpiresAt){
    AS = a;
    finalizeSession('parkExpired');
    return true;
  }
  return false;
}

// Single source of truth for "destroy the in-progress session without logging".
// Called from confirmStopSession's Discard and from Home's Resume-card Discard.
// Clears AS, nulls activeSession in storage, plays no cue, advances no rotation, writes no log.
function discardCurrentSession(){
  stopTimerLoop();
  const s = getState();
  s.activeSession = null;
  saveState(s);
  AS = null;
  showScreen('home');
}

function renderCompletion(){
  stopTimerLoop();
  renderProgressBar();
  const flow = currentFlow();
  let done=0, skipped=0, exTotal=0;
  flow.forEach(st=>{ if(st.kind==='exercise'){ exTotal++; const r=AS.records[st.uid]; if(r && r.setStatus && r.setStatus.some(s=>s==='done')) done++; else skipped++; } });
  const body = document.getElementById('flow-body');
  body.innerHTML = `
    <div class="flow-meta"><span class="badge badge-${AS.type.toLowerCase()}">${AS.type}</span> Session review</div>
    <div class="flow-title">Nice work.</div>
    <div class="flow-sub">${done} completed &middot; ${skipped} skipped of ${exTotal} exercises.${currentTpl().opener || currentTpl().noForm ? '' : ' The Form is done too.'}${AS.legsOnly ? ' Legs only today, by choice; the session counts.' : AS.symptomStop ? ' Arm work ended at a symptom stop; the session counts.' : ''}</div>
    <div style="margin-top:14px;">
      <div class="move-name" style="font-size:14px;margin-bottom:8px;">Anything to note? (optional)</div>
      <textarea class="note-field" id="session-note" rows="3" placeholder="How it felt, anything to remember…">${AS.sessionNote||''}</textarea>
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--text2);cursor:pointer;">
        <input type="checkbox" id="session-attention" ${AS.attentionFlag?'checked':''} style="width:18px;height:18px;flex:none;">
        Flag this session for review
      </label>
    </div>`;
  const foot = document.getElementById('flow-foot');
  foot.innerHTML = `<button class="btn btn-primary" onclick="finalizeSession('completed')">Complete Session</button>`
    + (ROTATION.indexOf(AS.type) !== -1 ? `<div style="font-size:12px;color:var(--text3);text-align:center;margin-top:10px;">An easy walk after counts as Engine: log it from Home.</div>` : '');
}

function finalizeSession(statusReason){
  stopTimerLoop();
  if(!AS){ showScreen('home'); return; }
  const noteEl = document.getElementById('session-note');
  if(noteEl) AS.sessionNote = noteEl.value.trim();
  const attnEl = document.getElementById('session-attention');
  if(attnEl) AS.attentionFlag = !!attnEl.checked;

  // TRANSACTIONAL FINALIZE (Chunk 2, commit 2):
  // Build the entire next state in memory, validate it, then save ONCE and render.
  // On any throw, we neither save nor advance rotation — the in-progress session is
  // left intact so the user can retry, rather than half-committing.
  try {
    const flow = currentFlow();
    // Entry date is the LOCAL day (an evening session is not tomorrow's); an expired park keeps
    // the day it was parked. completedAt stays the UTC instant.
    const today = (statusReason === 'parkExpired' && AS.parkedAt) ? localDay(AS.parkedAt) : localDay();
    const gc = liveCoreComplete();   // the v7 core gate, computed while records are live

    // Build the slot-aware performed/skipped records from flow metadata (added in commit 1).
    // performed[] preserves slotId + exId + role + progressionType + reps for each exercise
    // (the durable shape commit 3's scoring engine reads). exercises{exId:[reps]} and
    // skipped[] are kept in parallel for backward-compatible reads (history/sync/renderers).
    const exercises = {}; const skipped = []; const exerciseMeta = {}; const performed = [];
    let anyDone = false, anySkipped = false;
    flow.forEach(st=>{
      if(st.kind !== 'exercise') return;
      const rec = AS.records[st.uid] || { setStatus:[], sets:[], status:'skipped', issueFlag:'none', note:'', quality:'unknown', painFree:'unknown' };
      const role = (st.progressionType === 'heavyAnchor') ? 'anchor' : (st.blockType || 'builder');
      const targetSets = Array.isArray(rec.sets) && rec.sets.length ? rec.sets.length : undefined;   // v8: the session's set count
      const doneSets = rec.setStatus.map((status,i)=> status==='done' ? rec.sets[i] : null).filter(v=>v!==null);
      const wasSkippedWhole = rec.setStatus.every(x=>x==='skipped') || (rec.status==='skipped' && doneSets.length===0);
      const reps = rec.sets.map((v,i)=> rec.setStatus[i]==='done' ? v : 0);
      let item;
      if(wasSkippedWhole || doneSets.length===0){
        skipped.push(st.exId); anySkipped = true;
        item = { slotId: st.slotId, exId: st.exId, role, progressionType: st.progressionType || 'loose', reps, skipped: true };
        if(AS.legsOnly && st.arms) item.omitted = 'legsOnly';   // passed over by choice, not left undone
      } else {
        exercises[st.exId] = reps;
        anyDone = true;
        if(rec.setStatus.some(x=>x==='skipped')) anySkipped = true;
        item = { slotId: st.slotId, exId: st.exId, role, progressionType: st.progressionType || 'loose', reps };
      }
      if(targetSets) item.targetSets = targetSets;
      if(rec.symptomStopped) item.symptomStop = true;   // v7.3: stopped at PT's line
      performed.push(item);
      // reserved fields preserved (hidden)
      exerciseMeta[st.exId] = { setStatus:rec.setStatus, issueFlag:rec.issueFlag, note:rec.note||'', quality:rec.quality, painFree:rec.painFree };
    });

    // v7 status: Completed = core done (extension tail optional, never demotes). Stopped
    // stays a DISTINCT intent status; coreComplete is the orthogonal counting gate.
    let sessionStatus;
    if(statusReason === 'stopped') sessionStatus = 'stopped';
    else if(statusReason === 'parkExpired') sessionStatus = gc ? 'completed' : 'partial';
    else sessionStatus = gc ? 'completed' : (anySkipped ? 'partial' : 'completed');

    const entry = {
      date: today, sessionType: AS.type, logSchemaVersion: 2, coreComplete: gc,
      sessionId: genSessionId(),
      completedAt: new Date().toISOString(),
      attentionFlag: !!AS.attentionFlag,
      exercises, skipped: skipped.length ? skipped : undefined,
      performed,
      sessionStatus, exerciseMeta,
      issues: AS.issues.length ? AS.issues : undefined,
      notes: AS.sessionNote || undefined,
      duration: sessionActiveMinutes(),
      // v7.3 recovery layer: the mode the session was STARTED in (frozen), the day's arm
      // check, and any symptom stop. Mode also drives the replay-safe anchor reset.
      mode: AS.mode === 'recovery' ? 'recovery' : 'normal'
    };
    if(AS.armCheck) entry.armCheck = AS.armCheck;
    if(AS.legsOnly) entry.legsOnly = true;
    if(AS.symptomStop) entry.symptomStop = true;
    if(Array.isArray(AS.symptomStops) && AS.symptomStops.length) entry.symptomStops = AS.symptomStops.slice();

    // Build next state in memory (do not mutate live state until validated).
    const next = getState();
    entry.sessionSequence = next.nextSessionSequence++;
    entry.overrideUsed = ROTATION.indexOf(entry.sessionType) !== -1 && entry.sessionType !== getDefaultSessionType(next);
    entry.notionSync = { status:'pending', lastAttemptAt:null, syncedAt:null, notionPageId:null, error:null };
    next.log.push(entry);

    // ANCHOR SCORING (v3 gate): end-state no longer gates scoring. The complete-anchor
    // predicate is UNCHANGED and remains the only quality gate — "one great set, then
    // stop" still earns nothing. Builder work never scores.
    applyAnchorProgressionV2(next, entry);
    {
      // Snapshot the heavy-anchor scoreboard for this session so the Notion mirror's credited
      // figures stay correct even when this entry is re-pushed after later sessions move the
      // running scoreboard. Performance fields (reps, raw total) are re-derived at send time.
      const ap = entry.performed.find(x => x.progressionType === 'heavyAnchor' && HEAVY_ANCHOR_SLOTS[x.slotId] && !x.skipped);
      if(ap && next.anchorProgress[ap.slotId]){
        const sb = next.anchorProgress[ap.slotId];
        entry.anchorSnapshot = {
          creditedReps: (typeof sb.creditedQualityReps === 'number') ? sb.creditedQualityReps : null,
          creditDelta: (typeof sb.creditedQualityReps === 'number' && typeof sb.previousCreditedQualityReps === 'number') ? (sb.creditedQualityReps - sb.previousCreditedQualityReps) : null,
          creditCapped: !!sb.creditCapped,
          load: sb.externalLoad || 0,
          loadUnit: sb.loadUnit || 'lb'
        };
      }
    }

    // Rotation + override (v7 invariant, red-teamed 2026-08-16): advance iff CORE achieved
    // and rotation type, from the LOGGED sessionType (GPT blocker 1). Override is consumed
    // iff the selected rotation session achieved core — pre-core stop/park-expiry
    // PRESERVES it. Floor (MVS) never advances or consumes. Discard never reaches here.
    const rotIdx = ROTATION.indexOf(entry.sessionType);
    if(entry.coreComplete && rotIdx !== -1){
      next.rotationIndex = (rotIdx + 1) % ROTATION.length;
      next.nextSessionOverride = null;
    }

    next.activeSession = null;

    // Validate before committing: log grew by exactly one, rotation index in range,
    // active session cleared. If anything is off, throw — nothing is saved, rotation
    // does not advance, the in-progress session stays put.
    if(!Array.isArray(next.log) || next.log.length < 1) throw new Error('finalize: log invalid');
    if(typeof next.rotationIndex !== 'number' || next.rotationIndex < 0 || next.rotationIndex >= ROTATION.length) throw new Error('finalize: rotationIndex out of range');
    if(next.activeSession !== null) throw new Error('finalize: activeSession not cleared');

    saveState(next);   // single write
    AS = null;
    if(statusReason === 'completed') cueSessionDone();
    syncEntry(entry.sessionId);   // fire-and-forget; never blocks finishing
    showScreen('home');
  } catch(err){
    // Do NOT save, do NOT advance rotation, do NOT null AS — leave the session resumable.
    console.error('finalizeSession aborted; no state saved', err);
    showModal('Could not finish session', 'Something went wrong saving this session, so nothing was changed. Your in-progress session is still here — try finishing again.', [
      { text:'OK', cls:'btn-secondary', action:()=>hideModal() }
    ]);
  }
}

let currentScreen = 'home';
function showScreen(name){
  if(name !== 'session') stopTimerLoop();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  currentScreen = name;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const map = { home:'today', history:'history', reference:'exercises', settings:'settings' };
  document.querySelectorAll('.nav-btn').forEach(b=>{ if(b.textContent.trim().toLowerCase().includes(map[name]||name)) b.classList.add('active'); });
  if(name==='home') renderHome();
  if(name==='history') renderHistory();
  if(name==='reference') renderReference();
  if(name==='settings') renderSettings();
  if(name==='pt') renderPtScreen();
}

// ===================================================================
// HOME
// ===================================================================
function renderHome(){
  // Handed off, flag unknown or backstop pending: one card in place of Start, PT's list and
  // the Resume block. No getState() here, so a pending backstop writes no default state.
  if(handoffActive()){ document.getElementById('home-content').innerHTML = renderHandoffCard(); return; }
  // Lazy park expiry — if it finalized, Home re-rendered with fresh state; stop here.
  if(expireParkIfDue()) return;
  const s = getState();
  const recovery = isRecoveryOn(s);
  // Override-aware resolution: Pick -> setSessionOverride() stored a valid
  // SESSION_TEMPLATES key; otherwise fall back to the rotation default.
  const defaultType = getDefaultSessionType(s);
  const overridden = hasSessionOverride(s) && s.nextSessionOverride !== defaultType;
  const nextType = getEffectiveSessionType(s);
  const mode = sessionModeFor(s, nextType);
  const t = templateFor(nextType, mode, s);
  const est = estimateFromTemplate(t);
  const gc = t.grip==='high'?'var(--grip-high)':t.grip==='low'?'var(--grip-low)':'var(--grip-none)';

  // RESUME GUARD: an active session takes over Home entirely. No start path,
  // no Today card, no promotions competing with the in-progress decision.
  // v7.3: the one exception is PT's list, which runs outside the session slot.
  if(s.activeSession){
    const a = s.activeSession;
    const rt = a.tpl || SESSION_TEMPLATES[a.type];
    const rtName = rt ? rt.name : a.type;
    // v7.3: a session started before recovery mode keeps its (normal) exercises, which hold
    // work recovery mode parks. Lead with Discard; Resume stays possible behind a confirm.
    if(recovery && a.mode !== 'recovery'){
      document.getElementById('home-content').innerHTML = `
      <div class="promo-card" style="background:var(--warn-dim);border-color:var(--warn);">
        <h3 style="color:var(--warn);">${a.parkedAt ? 'Parked' : 'In progress'} &middot; started before recovery mode</h3>
        <p>${rtName} holds work recovery mode parks (hanging, full bodyweight on the arms, weights, flat palms). Discard it and start today&rsquo;s recovery session instead.</p>
        <div class="promo-actions">
          <button class="btn btn-small btn-primary" onclick="discardActiveSession()">Discard</button>
          <button class="btn btn-small btn-secondary" onclick="confirmResumePreRecovery()">Resume anyway</button>
        </div>
      </div>` + renderPtCard(s);
      return;
    }
    // Parked card: factual, never interrogative.
    document.getElementById('home-content').innerHTML = a.parkedAt ? `
      <div class="promo-card">
        <h3>Parked &middot; ${a.type}</h3>
        <p>${rtName} — saved where you left it. Parks clear after tomorrow.</p>
        <div class="promo-actions">
          <button class="btn btn-small btn-primary" onclick="resumeSession()">Resume</button>
          <button class="btn btn-small btn-secondary" onclick="discardActiveSession()">Discard</button>
        </div>
      </div>` : `
      <div class="promo-card">
        <h3>&#9656; Session in progress</h3>
        <p>${rtName} — pick up where you left off.</p>
        <div class="promo-actions">
          <button class="btn btn-small btn-primary" onclick="resumeSession()">Resume Session</button>
          <button class="btn btn-small btn-secondary" onclick="discardActiveSession()">Discard Session</button>
        </div>
      </div>`;
    if(recovery) document.getElementById('home-content').innerHTML += renderPtCard(s);
    return;
  }

  // Anchor scoreboard: the two heavy ring anchors' closing-in meter + verdict, read from
  // anchorProgress (the v2 engine's output). No manual promote prompts in v2.
  // v7.3: hidden while recovery mode is on (recovery work never scores).
  const anchorHtml = recovery ? '' : renderAnchorScoreboard(s);
  const defaultName = (templateFor(defaultType, sessionModeFor(s, defaultType), s) || {}).name || defaultType;
  // Recovery mode: PT's list takes the Floor day's place, and ring days carry the PT-visit rule.
  const extraLine = recovery
    ? (ROTATION.indexOf(nextType) !== -1 ? `<br>PT visit or a rough arm day? <a href="javascript:void(0)" onclick="startSession('${nextType}',{legsOnly:true})" style="color:var(--text2);text-decoration:underline;">Legs only today</a>` : '')
    : `<br><a href="javascript:void(0)" onclick="startSession('MVS')" style="color:var(--text2);text-decoration:underline;">Short on time? Floor day (~${estimateCoreDuration('MVS')} min)</a>`
      + (cardioCapOn(s) ? `<br>Until cardiology clears: two reps short of failure; no jumps, sprints, hill repeats or jump rope.` : '');

  document.getElementById('home-content').innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="badge badge-${nextType.toLowerCase()}">${nextType}</span>
          ${mode === 'recovery' ? '<span class="status-chip status-recovery" style="margin-left:0;">recovery</span>' : ''}
          <span class="grip-dot" style="background:${gc}"></span>
          <span style="font-size:11px;color:var(--text3);">${t.grip} grip</span>
        </div>
        <span style="font-size:11px;color:var(--text3);">~${est} min</span>
      </div>
      <div class="session-name">${t.name}</div>
      <button class="btn btn-primary" onclick="startSession('${nextType}')">Start Today's Session</button>
      <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:10px;line-height:1.6;">
        ${t.opener ? 'Opens with the 90-second opener' : 'Opens with the Form'} &middot; core ~${estimateFromTemplate(t, true)} min
        ${overridden
          ? `<br>Picked &middot; Default: ${defaultName} &middot; <a href="javascript:void(0)" onclick="clearSessionOverride()" style="color:var(--text2);text-decoration:underline;">Reset to default</a>`
          : `<br><a href="javascript:void(0)" onclick="openSessionPicker()" style="color:var(--text2);text-decoration:underline;">Pick a different day</a>`
        }
        ${extraLine}
      </div>
    </div>
    ${recovery ? renderPtCard(s) : ''}
    ${renderWeekCard(s, recovery)}
    ${anchorHtml}
    ${s.log.length ? renderLastSession(s) : ''}
    ${renderSessionPreview(nextType, mode)}
    ${recovery ? renderRecoveryRules(s) : ''}`;
}

// ---- PT'S LIST CARD + RECOVERY RULES (Home, v7.3) ----
// A list belongs to the local day it was STARTED on (23:55 -> 00:05 counts for the first day).
function ptDoneToday(s){
  const d = localDay();
  return (s.log || []).some(e=> e && e.sessionType === 'PT' && (e.startedAt || e.completedAt) && localDay(e.startedAt || e.completedAt) === d);
}
function renderPtCard(s){
  if(!PT_LIST) return '';
  const done = ptDoneToday(s);
  const ivy = (PT_LIST.ivyUntil && localDay() <= PT_LIST.ivyUntil) ? ` &middot; tick it in My Ivy Care too, through ${formatDate(PT_LIST.ivyUntil)}` : '';
  return `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <div style="display:flex;align-items:center;gap:6px;"><span class="badge badge-pt">PT</span><span style="font-size:11px;color:var(--text3);">once a day</span></div>
        <span style="font-size:11px;color:var(--text3);">~${ptEstimateMin('pt')} min</span>

// Anchor scoreboard for Home (Chunk 3): per heavy anchor, a closing-in meter toward the
// next level plus last result + a warm verdict. The meter fills by creditedQualityReps
// (the banked figure the level-up triggers on), never raw — so it can't promise a
// level-up the engine won't grant; raw is shown alongside as the honest last result.
function renderAnchorScoreboard(s){
  const ap = s.anchorProgress || {};
  let html = '';
  Object.keys(HEAVY_ANCHOR_SLOTS).forEach(slotId=>{
    const meta = HEAVY_ANCHOR_SLOTS[slotId];
    if(meta.legacy) return;   // v7 slots live on in history only
    const prog = ap[slotId];
    if(!prog || (prog.lastRawQualityReps == null && prog.creditedQualityReps == null)) return; // nothing logged yet
    const top = anchorTopTotal(meta.exId, meta.sets);
    const loadStr = prog.externalLoad ? `+${prog.externalLoad}${prog.loadUnit||'lb'}` : '';
    const lastStr = (prog.lastRawQualityReps==null) ? '—' : `${prog.lastRawQualityReps} total`;
    const verdict = anchorVerdict(prog);

    // CLOSING-IN METER. Bar fills by creditedQualityReps (the banked figure the
    // level-up actually triggers on), NOT raw — so the bar never promises a
    // level-up the engine won't grant. Raw is shown alongside as the honest result.
    let meter;
    if(prog.creditedQualityReps === null){
      // Fresh load (just stepped up, or awaiting first baseline at a new load):
      // no credited figure to fill against. Show an empty 'baseline' track, not 0/top
      // (which would read like a regression).
      meter = `
        <div class="meter-track"><div class="meter-fill baseline" style="width:0%"></div></div>
        <div class="meter-caption">Set your baseline this session<span class="mc-sub">First clean session at the new load becomes the number to beat.</span></div>`;
    } else {
      const credited = Math.max(0, Math.min(prog.creditedQualityReps, top));
      const pct = Math.round((credited / top) * 100);
      const remaining = Math.max(0, top - credited);
      const caption = remaining === 0
        ? `Top owned — load goes up next session.`
        : `You're ${remaining} rep${remaining===1?'':'s'} from leveling this up.`;
      meter = `
        <div class="meter-track"><div class="meter-fill" style="width:${pct}%"></div></div>
        <div class="meter-caption">${credited} / ${top} banked toward the next level<span class="mc-sub">${caption}</span></div>`;
    }

    html += `
      <div class="anchor-card">
        <div class="ac-top"><span class="ac-label">${meta.label}</span>${loadStr?`<span class="ac-load">${loadStr}</span>`:''}</div>
        <div class="ac-last">Last session: <strong>${lastStr}</strong></div>
        ${meter}
        ${verdict?`<div class="meter-caption" style="font-weight:400;color:var(--text2);margin-top:9px;">${verdict}</div>`:''}
      </div>`;
  });
  return html;
}

// Engine = moderate aerobic minutes (talk test), logged as an 'EN' entry: a log entry with
// no exercises, so it counts as an active day, syncs to the Session Log as "Engine", and
// never touches the rotation, the anchors or the arm check. The week starts Monday (local).
const ENGINE_KINDS = ['Walk','Hike','Ruck','Farm work','Other'];
const ENGINE_TARGET = 150;
function weekBounds(){
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const start = localDay(d.getTime()); d.setDate(d.getDate() + 7);
  return { start, end: localDay(d.getTime()) };
}
function weekMeasures(s){
  const w = weekBounds();
  const inWeek = (s.log || []).filter(e=> e && typeof e.date === 'string' && e.date >= w.start && e.date < w.end);
  return {
    strength: inWeek.filter(e=> ROTATION.indexOf(e.sessionType) !== -1 && e.coreComplete === true).length,
    activeDays: new Set(inWeek.map(e=> e.date)).size,
    engine: inWeek.filter(e=> e.sessionType === 'EN').reduce((a,e)=> a + (typeof e.duration === 'number' ? e.duration : 0), 0)
  };
}
function renderWeekCard(s, recovery){

  return `<div class="card">

// ===================================================================
// PT'S LIST SESSION (v7.3 recovery layer)
// ===================================================================
// Its own short session, once a day, in the Floor day's place. It runs OUTSIDE the single
// active-session slot (in-memory PTS only), so it never parks, can start while a ring
// session is parked, never advances the rotation and never consumes a picker override.
// One tap-through card (ticks are visual only, nothing logged per set), one Finish.
let PTS = null;
function startPtSession(){
  if(handoffActive()){ showScreen('home'); return; }
  if(!PT_LIST) return;
  unlockAudio();
  const s = getState();
  // Once a day: after today's list is logged, reopening it is for reference only.
  if(ptDoneToday(s)){ PTS = { viewOnly: true, startedAt: Date.now(), armCheck: null, status: {}, run: null, note: '' }; showScreen('pt'); return; }
  const go = (v)=>{ PTS = { startedAt: Date.now(), armCheck: v !== undefined ? v : todayArmCheck(getState()), status: {}, run: null, note: '' }; showScreen('pt'); };
  if(needsArmCheck(s)) askArmCheck(go); else go();
}
// ---- v7.4: guided PT's list --------------------------------------------------------------
// Doses are structured (sets x reps, an optional hold per rep, optional per side). Each item
// starts on one tap, then the timer runs it hands-off: get set -> hold -> release -> next rep,
// switch sides, rest between sets. Reps without a hold wait for "Set done". The timer is
// absolute-time (survives backgrounding) and the screen is kept awake while one runs.
function escHtml(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ptItemsAll(){
  const items = (PT_LIST && Array.isArray(PT_LIST.items)) ? PT_LIST.items : [];
  // Items with holdSteps carry a per-install hold level (state.ptLevels[id]); apply it here so the
  // dose line, the plan and the log all agree.
  let lv = {};
  try { lv = (getState().ptLevels) || {}; } catch(e){}
  return items.map(it=> Array.isArray(it.holdSteps) ? Object.assign({}, it, { holdSec: it.holdSteps[Math.min(lv[it.id] || 0, it.holdSteps.length - 1)] }) : it);
}
function ptCanHoldLonger(it){ if(!it || !Array.isArray(it.holdSteps)) return false; let lv = {}; try { lv = getState().ptLevels || {}; } catch(e){} return (lv[it.id] || 0) < it.holdSteps.length - 1; }
function ptHoldLonger(i){
  const it = ptItemsAll()[i]; if(!ptCanHoldLonger(it)) return;
  const s = getState(); s.ptLevels = s.ptLevels || {}; s.ptLevels[it.id] = (s.ptLevels[it.id] || 0) + 1; saveState(s);
  PTS.lastDone = null; cueLogged(); renderPtScreen();
}
// On a day the arm check says worse, Train adds sit out; PT's program runs at a smaller range.
function ptWorseToday(){ return !!(PTS && PTS.armCheck === 'worse'); }
function ptItemShown(it){ return !(it && it.block === 'adds' && ptWorseToday()); }
function ptDoseLine(it){
  if(!it) return '';
  if(it.doseText) return it.doseText;
  const sets = it.sets || 1, reps = it.reps || 1, side = it.perSide ? (it.sideWord ? ' each ' + it.sideWord : ' each side') : '';

// The step plan for one item. Pure: the tests drive it directly.
function buildPtPlan(it){
  const steps = [];
  const sets = Math.max(1, it.sets || 1), reps = Math.max(1, it.reps || 1);
  const sides = it.perSide ? (it.sides || ['Right','Left']) : [null];
  if(it.holdSec) steps.push({ kind:'ready', sec: it.setupSec || 5, set:1, sets, side: sides[0] });
  for(let s = 1; s <= sets; s++){
    sides.forEach((side, si)=>{
      if(it.holdSec){
        for(let r = 1; r <= reps; r++){
          steps.push({ kind:'hold', sec: it.holdSec, set:s, sets, rep:r, reps, side });
          if(r < reps) steps.push({ kind:'relax', sec: it.relaxSec || 3, set:s, sets, rep:r+1, reps, side });
        }
      } else {
        steps.push({ kind:'reps', reps, set:s, sets, side });
      }
      if(si < sides.length - 1) steps.push({ kind:'switch', sec: it.switchSec || 5, set:s, sets, side: sides[si+1] });
    });
    if(s < sets) steps.push({ kind:'rest', sec: (it.restSec != null ? it.restSec : 15), set:s+1, sets, side: sides[0] });
  }

}

function ptEstimateMin(block){

    buildPtPlan(it).forEach(st=>{ sec += st.sec || (st.kind === 'reps' ? st.reps * (it.secPerRep || 3) : 0); });

function ptStepLabel(st){

function ptSessionStatus(){

      <div class="history-hits">${isEngine ? `${escHtml(entry.engineKind || 'Engine')} &middot; ${entry.duration || 0} min` : entry.legsOnly ? `Legs only &middot; ${hitCount}/${totalEx} HITs` : isPt ? (stat === 'completed' ? 'PT&rsquo;s list done' : stat === 'stopped' ? 'PT&rsquo;s list &middot; stopped for symptoms' : 'PT&rsquo;s list &middot; partly done') : `${hitCount}/${totalEx} HITs`}${entry.skipped&&entry.skipped.length?' &middot; '+entry.skipped.length+' skipped':''}${entry.symptomStop || (entry.symptomStops && entry.symptomStops.length) ? ' &middot; symptom stop' : ''}</div>
      <div class="history-detail">${detail}${handedOff ? '' : `<button class="btn btn-small btn-danger" style="margin-top:12px;" onclick="event.stopPropagation(); confirmDeleteSession(${logIdx})">Delete this session</button>`}</div>
    </div>`;
  }).join('');
  document.getElementById('history-content').innerHTML = html;
}
// ===================================================================
// HISTORY DELETE + SCOREBOARD REBUILD (Option B)
// ===================================================================
// Deleting a session must keep the anchor scoreboard in sync with the log. Option B:
// remove the entry, then REBUILD anchorProgress from scratch by replaying the remaining
// log in order through the same engine finalize uses. This keeps log<->scoreboard parity
// exactly (no drift), at the cost of recomputing — correct while the engine numbers are
// still being graded against real history.
//
// Replay rule (v3 gate, 2026-08-16) MUST match finalize's scoring gate: EVERY entry
// replays — session end-state no longer gates scoring. applyAnchorProgressionV2's own
// guards handle everything else: entries without a performed[] array (pre-engine
// sessions) no-op; skipped or incomplete anchor sets don't score. Never filter on
// progressionEngineVersion — only on entry shape, which the engine already checks.
// Rotation and the picker override are NEVER touched here (scoreboard replay only).
function rebuildAnchorProgress(state){
  state.anchorProgress = {};
  // v7.3: a recovery-mode turn-off resets both anchors at its point in the log (resetSeq =
  // the first sequence number after it). Recovery entries carry their own reset.
  const resetSeq = (state.recovery && typeof state.recovery.resetSeq === 'number') ? state.recovery.resetSeq : null;
  let resetApplied = false;
  state.log.forEach(entry=>{
    if(!entry) return;
    if(resetSeq !== null && !resetApplied && typeof entry.sessionSequence === 'number' && entry.sessionSequence >= resetSeq){
      resetHeavyAnchors(state, null); resetApplied = true;
    }
    applyAnchorProgressionV2(state, entry);   // engine guards handle the rest (incl. no performed[])
  });
  if(resetSeq !== null && !resetApplied) resetHeavyAnchors(state, null);
}

// Delete one log entry by its true index into state.log, then rebuild the scoreboard.
// Single saveState (build the whole next state, then write once), then re-render History.
function deleteLogEntry(logIdx){
  if(handoffActive()){ hideModal(); renderHistory(); return; }   // no tombstone could sync
  const s = getState();
  if(!Array.isArray(s.log) || logIdx < 0 || logIdx >= s.log.length) return; // stale index guard
  const removed = s.log[logIdx];
  // Queue a soft-delete tombstone so the Notion mirror marks the row Deleted on next push.
  // Queue regardless of prior sync status: a tombstone for a never-synced id is a harmless
  // no-op server-side (query finds nothing), and this guarantees the mirror can't drift.
  if(removed && removed.sessionId){
    if(!Array.isArray(s.pendingDeletes)) s.pendingDeletes = [];
    if(!s.pendingDeletes.includes(removed.sessionId)) s.pendingDeletes.push(removed.sessionId);
  }
  s.log.splice(logIdx, 1);
  rebuildAnchorProgress(s);
  saveState(s);
  hideModal();
  renderHistory();
  pushUnsynced();   // fire-and-forget: drain the tombstone (and any other pending) now
}

// Confirmation modal for deleting a history entry. Names the date + session so the user
// knows exactly what's going away, and warns that the scoreboard recalculates (Option B is
// a stronger action than deleting the log row alone).
function confirmDeleteSession(logIdx){
  const s = getState();
  const entry = s.log[logIdx];
  if(!entry) return;
  const name = entryName(entry);
  showModal('Delete this session?',
    `${formatDate(entry.date)} — ${name}. This removes it from history and recalculates your scoreboard from your remaining sessions. This can’t be undone.`,
    [
      { text:'Cancel', cls:'btn-secondary', action:()=>hideModal() },
      { text:'Delete', cls:'btn-danger', action:()=>deleteLogEntry(logIdx) }
    ]);
}

function formatDate(ds){ const d = new Date(ds+'T12:00:00'); return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}, ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]} ${d.getDate()}`; }

// ===================================================================
function renderReference(){
  const s = getState();
  // v8: one group per live session, read from its template, then the Form.
  const cats = ROTATION.concat(['MVS']).map(k=>{ const t = SESSION_TEMPLATES[k];
    return { label: t.name, ids: t.blocks.reduce((a,b)=> a.concat(b.exercises), []) }; });
  cats.push({ label:'The Form (mobility kata, Floor day)', form:true });
  // v7.3: in recovery mode, PT's list and the recovery swaps lead the reference.
  const recovery = isRecoveryOn(s);
  if(recovery){
    cats.unshift({ label:'Recovery swaps', ids: Object.keys(EXERCISE_LIBRARY).filter(id=> id.indexOf('rec-') === 0) });
    if(PT_LIST) cats.unshift({ label: PT_LIST.name, pt:true });
  }
  let html = '';
  cats.forEach(cat=>{
    html += `<div class="block-label">${cat.label}</div>`;
    if(cat.pt){
      html += `<div class="ref-exercise"><div class="ref-ladder">${PT_LIST.rule} PT&rsquo;s movements, doses inside PT&rsquo;s limits; updated ${formatDate(PT_LIST.updated)}.</div></div>`;
      ptItemsAll().forEach((i, idx)=>{ html += `<div class="ref-exercise"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><div class="ref-name">${i.name} <span style="color:var(--text3);font-size:12px;font-weight:400;">${ptDoseLine(i)}</span></div><button class="ref-btn" style="margin-top:0;" onclick="showPtRef(${idx})">&#9654;</button></div><div class="ref-ladder">${i.block === 'adds' || i.block === 'open' ? 'Train adds (optional, inside PT\u2019s limits)' : i.source === 'clinic' ? 'Shown in clinic' : 'My Ivy Care home program'}</div></div>`; });
      return;
    }
    if(cat.form){
      FORM.screens.forEach((sc,i)=>{ html += `<div class="ref-exercise"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><div class="ref-name">${i+1}. ${sc.title}</div>${sc.reference ? `<button class="ref-btn" style="margin-top:0;" onclick="showFormRef(${i})">&#9654;</button>` : ''}</div><div class="ref-ladder">${sc.breath || sc.movements.map(m=>m.name).join(' &middot; ')}</div></div>`; });
      return;
    }
    cat.ids.forEach(exId=>{
      const ex = EXERCISE_LIBRARY[exId]; if(!ex) return; const i = getCurrentVariation(exId);
      const ladder = ex.ladder.map((v,idx)=>{ if(idx===i) return `<span class="ref-current">${v}</span>`; if(idx<i) return `<span style="text-decoration:line-through;color:var(--text3);">${v}</span>`; return `<span style="color:var(--text3);">${v}</span>`; }).join(' &#8594; ');
      // Anchor slots show their v2 scoreboard total; others just show the ladder (reference only).
      const apEntry = (exId==='ring-pullup' && s.anchorProgress) ? s.anchorProgress['RP_anchor_ring-pullup']
                    : (exId==='ring-pushup' && s.anchorProgress) ? s.anchorProgress['RPush_anchor_ring-pushup'] : null;
      const anchorTag = (!recovery && apEntry && apEntry.lastRawQualityReps!=null) ? ` &middot; <span style="color:var(--accent);">${apEntry.lastRawQualityReps} total${apEntry.externalLoad?` +${apEntry.externalLoad}${apEntry.loadUnit||'lb'}`:''}</span>` : '';
      html += `<div class="ref-exercise"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;"><div class="ref-name">${ex.name} <span style="color:var(--text3);font-size:12px;font-weight:400;">${ex.openReps ? openRepsLabel(ex).toLowerCase() : `${ex.repRange[0]}-${ex.repRange[1]} ${ex.unit}`} &times; ${ex.sets}</span>${anchorTag}</div></div><div class="ref-ladder">${ladder}</div></div>`;
    });
  });
  document.getElementById('reference-content').innerHTML = html;
}

function renderSettings(){
  const s = getState();
  const log = s.log || [];
  const pendingCount = log.filter(e => !e.notionSync || e.notionSync.status !== 'synced').length + (Array.isArray(s.pendingDeletes) ? s.pendingDeletes.length : 0);
  const failedCount = log.filter(e => e.notionSync && e.notionSync.status === 'failed').length;
  const lastSynced = log.map(e => e.notionSync && e.notionSync.syncedAt).filter(Boolean).sort().slice(-1)[0];
  const lastSyncedDisplay = lastSynced ? new Date(lastSynced).toLocaleString() : 'Not yet';
  const syncStatusText = pendingCount === 0 ? (log.length ? 'All sessions synced' : 'No sessions yet') : `${pendingCount} pending${failedCount ? ` (${failedCount} failed)` : ''}`;
  const soundOn = soundEnabled();
  const recOn = isRecoveryOn(s), clear = cardioCleared(s);
  const sinceLine = (recOn && s.recovery.since) ? ` &middot; on since ${formatDate(localDay(s.recovery.since))}` : '';
  // Hand-off row (hidden in the native shell). Three faces: writable (offer the hand-off),
  // handed off (offer the undo), unknown (offer the retry).
  const hv = handoffValue(), handedOff = handoffActive();
  const handoffRow = !handoffSupported() ? '' : handoffBackstopPending ? `<div class="setting-row"><div><div style="font-weight:600;">Hand-off</div><div style="font-size:12px;color:var(--text2);">Checking which app is in charge&hellip;</div></div></div>`
    : hv === 'unknown' ? `<div class="setting-row"><div><div style="font-weight:600;">Hand-off</div><div style="font-size:12px;color:var(--text2);">Can&rsquo;t tell which app is in charge; read-only until hyndesyte.github.io answers</div></div><button class="btn btn-small btn-primary" onclick="retryHandoffBackstop()">Retry connection</button></div>`
    : hv === 'on' ? `<div class="setting-row"><div><div style="font-weight:600;">Handed off to the Train app</div><div style="font-size:12px;color:var(--text2);">This copy no longer logs or syncs. Undo only as part of a rollback.</div></div><button class="btn btn-small btn-secondary" onclick="confirmHandoffUndo()">Undo</button></div>`
    : `<div class="setting-row"><div><div style="font-weight:600;">Hand off to the Train app</div><div style="font-size:12px;color:var(--text2);">Cutover step 1: this copy stops logging and syncing once everything is finished and synced</div></div><button class="btn btn-small btn-secondary" onclick="confirmHandoff()">Hand off</button></div>`;
  document.getElementById('settings-content').innerHTML = `
    <div class="block-label" style="margin-top:8px;">Recovery mode</div>
    <div class="card">
      <div class="setting-row">
        <div><div style="font-weight:600;">Recovery mode</div><div style="font-size:12px;color:var(--text2);">Reduced-load swaps, PT&rsquo;s list as its own daily session, scoreboard hidden${sinceLine}</div></div>
        <button class="btn btn-small ${recOn?'btn-primary':'btn-secondary'}" onclick="toggleRecoveryMode()">${recOn?'On':'Off'}</button>
      </div>
      ${(recOn || s.recovery.offAt || clear) ? `<div class="setting-row">
        <div><div style="font-weight:600;">Cardiology cleared hard efforts</div><div style="font-size:12px;color:var(--text2);">Gate 4: lifts the two-reps-short cap; power work and jump rope return</div></div>
        <button class="btn btn-small ${clear?'btn-primary':'btn-secondary'}" onclick="toggleCardioClear()">${clear?'Yes':'No'}</button>
      </div>` : ''}
      <div style="font-size:12px;color:var(--text3);margin-top:8px;">Turn recovery mode off only after PT clears you, hang test included. The two ring anchors then restart at bodyweight. A session already in progress keeps its exercises.</div>
    </div>
    <div class="block-label">Markers</div>
    ${renderMarkersCard(s)}
    <div class="block-label">Sound cues</div>
    <div class="card">
      <div class="setting-row">
        <div><div style="font-weight:600;">Cue sounds</div><div style="font-size:12px;color:var(--text2);">Short tones for timers and saved actions</div></div>
        <button class="btn btn-small ${soundOn?'btn-primary':'btn-secondary'}" onclick="toggleSound()">${soundOn?'On':'Off'}</button>
      </div>
      <div style="font-size:12px;color:var(--text3);margin-top:8px;">Audio cues only play when your phone's silent switch is off.</div>
    </div>
    <div class="block-label">Your data</div>
    <div class="card">
      <div class="setting-row"><div><div style="font-weight:600;">Export data</div><div style="font-size:12px;color:var(--text2);">Full log as JSON, via the share sheet</div></div><button class="btn btn-small btn-secondary" onclick="exportData()">Export</button></div>
      <div id="session-digest" style="font-size:12px;color:var(--text3);margin-top:8px;">${sessionIdsOf(s).length} sessions &middot; digest &hellip;</div>
      ${handoffRow}
    </div>
    <details style="margin-top:14px;">
      <summary style="font-size:13px;color:var(--text3);cursor:pointer;font-weight:600;padding:4px 0;">Advanced</summary>
      <div class="card" style="margin-top:8px;">
        <div style="font-weight:700;margin-bottom:8px;">Notion sync</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:4px;">${syncStatusText}${handedOff ? ' &middot; paused: ' + (handoffBackstopPending ? 'checking which app is in charge' : hv === 'unknown' ? 'which app is in charge is unknown' : 'this copy is handed off') : ''}</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:8px;">Last synced: ${lastSyncedDisplay}</div>
        ${handedOff ? '' : `<button class="btn btn-small btn-secondary" onclick="pushUnsynced()">Retry sync</button>`}
      </div>
      <div class="card" style="margin-top:8px;">
        <div class="setting-row"><div><div style="font-weight:600;">Import data</div><div style="font-size:12px;color:var(--text2);">Restore from a backup</div></div><button class="btn btn-small btn-secondary" onclick="document.getElementById('import-file').click()">Import</button><input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)"></div>
        <div class="setting-row"><div><div style="font-weight:600;">Reset rotation</div><div style="font-size:12px;color:var(--text2);">Next session back to A</div></div><button class="btn btn-small btn-secondary" onclick="confirmResetRotation()">Reset</button></div>
        ${handedOff ? '' : `<div class="setting-row"><div><div style="font-weight:600;color:#ef4444;">Erase all data</div><div style="font-size:12px;color:var(--text2);">Permanently delete everything</div></div><button class="btn btn-small btn-danger" onclick="confirmErase()">Erase</button></div>`}
      </div>
    </details>
    <div class="card" style="margin-top:12px;"><div style="font-size:13px;color:var(--text3);"><strong>Build</strong>: ${BUILD_ID} · data ${window.TRAIN_DATA_VERSION} · ${s.log.length} sessions</div></div>`;
  fillSessionDigest();
}
function toggleSound(){ setSoundEnabled(!soundEnabled()); renderSettings(); }
// ---- RECOVERY MODE SWITCHES (v7.3) ----
function setRecoveryMode(on){
  const s = getState();
  s.recovery = Object.assign({ on:false, cardioClear:false, since:null, offAt:null }, s.recovery);
  s.recovery.on = !!on;
  if(on){ s.recovery.since = new Date().toISOString(); s.recovery.offAt = null; }
  else {
    // The two ring anchors restart at bodyweight now. resetSeq marks the point in the log,
    // so any later replay (history delete, migration) re-applies it there.
    s.recovery.offAt = new Date().toISOString();
    s.recovery.resetSeq = (typeof s.nextSessionSequence === 'number') ? s.nextSessionSequence : 0;
    resetHeavyAnchors(s, localDay());
  }
  saveState(s);
}
function toggleRecoveryMode(){
  const s = getState();
  if(isRecoveryOn(s)){
    const capNote = cardioCleared(s) ? '' : ' Cardiology hasn’t cleared hard efforts yet, so the effort cap stays on until you mark it cleared.';
    showModal('Turn off recovery mode?', 'Only after PT clears you, hang test included. Ring sessions go back to normal, PT’s list leaves Home, and the two ring anchors restart at bodyweight. A session already in progress keeps its exercises.' + capNote, [
      { text:'Cancel', cls:'btn-secondary', action:()=>hideModal() },
      { text:'Turn off', cls:'btn-danger', action:()=>{ hideModal(); setRecoveryMode(false); renderSettings(); } }
    ]);
  } else {
    showModal('Turn on recovery mode?', 'Ring sessions switch to the reduced-load swaps, PT’s list takes the Floor day’s place, and the anchor scoreboard is hidden. A session already in progress keeps its exercises.', [
      { text:'Cancel', cls:'btn-secondary', action:()=>hideModal() },
      { text:'Turn on', cls:'btn-primary', action:()=>{ hideModal(); setRecoveryMode(true); renderSettings(); } }
    ]);
  }
}
function setCardioClear(on){
  const s = getState();
  s.recovery = Object.assign({ on:false, cardioClear:false, since:null, offAt:null }, s.recovery);
  s.recovery.cardioClear = !!on;
  saveState(s);
}
function toggleCardioClear(){
  const s = getState();
  if(cardioCleared(s)){ setCardioClear(false); renderSettings(); return; }   // the safer direction needs no confirm
  showModal('Cardiology cleared hard efforts?', 'Turn this on only once cardiology has cleared hard efforts. It lifts the two-reps-short cap and brings power work, hill repeats and jump rope back.', [
    { text:'Cancel', cls:'btn-secondary', action:()=>hideModal() },
    { text:'Yes, cleared', cls:'btn-primary', action:()=>{ hideModal(); setCardioClear(true); renderSettings(); } }
  ]);
}
// Export: hand the backup to the share sheet when the browser can share files (in a Home Screen
// web app a blob <a download> shows no download or only a preview, WebKit bug 275288); the blob
// link is the fallback only where files can't be shared. A cancelled share sheet is not an error.
function exportBackupFile(){ const json = JSON.stringify(getState(),null,2); const name = `train-backup-${localDay()}.json`; return { json, name }; }
function exportViaBlob(json, name){ const blob = new Blob([json],{type:'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url); }
function exportData(){
  const { json, name } = exportBackupFile();
  let file = null;
  try {
    if(navigator.share && navigator.canShare && typeof File === 'function'){
      const f = new File([json], name, { type:'application/json' });
      if(navigator.canShare({ files:[f] })) file = f;
    }
  } catch(e){ file = null; }
  if(!file){ exportViaBlob(json, name); return; }
  navigator.share({ files:[file], title:'Train backup' }).catch(err=>{
    if(err && err.name === 'AbortError') return;   // he closed the sheet
    showModal('Could not open the share sheet', 'Save the backup with a download instead?', [
      { text:'Cancel', cls:'btn-secondary', action:()=>hideModal() },
      { text:'Download', cls:'btn-primary', action:()=>{ hideModal(); exportViaBlob(json, name); } }
    ]);
  });
}
function importData(ev){ const f = ev.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = e=>{ try { const data = JSON.parse(e.target.result); if(data.log && Array.isArray(data.log)){ showModal('Import data?', `Replace current data with ${data.log.length} sessions from the backup?`, [ {text:'Cancel',cls:'btn-secondary',action:()=>hideModal()}, {text:'Import',cls:'btn-primary',action:()=>{ saveState(migrate(data)); hideModal(); renderSettings(); showScreen('home'); }} ]); } else alert('Invalid backup file.'); } catch(err){ alert('Could not read file.'); } }; r.readAsText(f); }
function confirmResetRotation(){ showModal('Reset rotation?', 'The next session returns to A. Session history is not changed.', [ {text:'Cancel',cls:'btn-secondary',action:()=>hideModal()}, {text:'Reset',cls:'btn-danger',action:()=>{ hideModal(); resetRotation(); }} ]); }
function resetRotation(){ const s = getState(); s.rotationIndex = 0; saveState(s); renderSettings(); }
function confirmErase(){ showModal('Erase all data?', 'Permanently deletes all sessions, promotions, and progression. Cannot be undone.', [ {text:'Cancel',cls:'btn-secondary',action:()=>hideModal()}, {text:'Erase everything',cls:'btn-danger',action:()=>{ localStorage.removeItem('train_state'); AS=null; hideModal(); showScreen('home'); }} ]); }

// ===================================================================
// MODAL
// ===================================================================
function showModal(title, body, buttons, opts){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent = body;
  const act = document.getElementById('modal-actions');
  if(act.classList && act.classList.toggle) act.classList.toggle('stack', !!(opts && opts.stack));
  act.innerHTML = buttons.map(b=>`<button class="btn ${b.cls}" id="mb-${b.text.replace(/\s/g,'')}">${b.text}</button>`).join('');
  buttons.forEach(b=>{ const el = document.getElementById('mb-'+b.text.replace(/\s/g,'')); if(el) el.onclick = b.action; });
  document.getElementById('modal').classList.add('visible');
}
function hideModal(){ document.getElementById('modal').classList.remove('visible'); var mb = document.getElementById('modal-body'); if(mb) mb.innerHTML = ''; }

// ===================================================================
// INIT
// ===================================================================
document.addEventListener('DOMContentLoaded', async ()=>{
  // Hand-off backstop first, from the raw keys, before anything calls getState(): with no
  // state and no flag (an evicted copy, or a fresh install), or with the flag unknown, read
  // writer.json and hold Home for up to 3 seconds. Every other boot skips this entirely.
  if(handoffBackstopNeeded()){
    handoffBackstopPending = true;
    renderHome();
    await runHandoffBackstop();
  }
  renderHome();
  // Ask the browser to keep this origin's storage out of eviction under storage pressure
  // (best effort; a refusal changes nothing).
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); } catch(e){}
  // Mirror to Notion in the background: drains pending tombstones and pushes any unsynced
  // sessions oldest-first (this is what backfills existing history on first launch). Never
  // blocks the UI; the indicator reflects progress. A handed-off copy skips it.
  refreshSyncIndicator();
  if(!handoffActive()) pushUnsynced();
});

// Re-sync timer display when returning to the app (handles backgrounding/lock).
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && currentScreen === 'session' && AS && AS.timerEnd){
    if(Date.now() >= AS.timerEnd){
      const kind = AS.timerKind; stopTimerLoop();
      if(kind === 'work') onWorkTimerComplete(); else if(kind === 'rest') onRestTimerComplete();
    } else { startTimerLoop(); }
  }
});

// Prevent pull-to-refresh except inside scrollable areas.
document.body.addEventListener('touchmove', function(e){ if(e.target.closest('.scroll') || e.target.closest('.flow-body')) return; e.preventDefault(); }, { passive:false });
</script>
